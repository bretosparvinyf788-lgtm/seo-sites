tyles</p><h3>Versace Medusa Head Belt</h3><strong>$11.11</strong><small><b>QC:</b> Confirm buckle design, belt colour, width and selected length</small><a href=\"https://kakobuymake.com/?m=home&amp;c=View&amp;a=index&amp;aid=1294\" target=\"_blank\">View product <span>↗</span></a></div></article><article class=\"product\"><a class=\"product-img\" href=\"https://kakobuymake.com/?m=home&amp;c=View&amp;a=index&amp;aid=1291\" target=\"_blank\"><img src=\"/products-v5/adwysd-hoodie.webp\" alt=\"ADWYSD Sunburst Logo Hoodie\"><em>08</em></a><div><p>Hoodies · 29 styles</p><h3>ADWYSD Sunburst Logo Hoodie</h3><strong>$19.41</strong><small><b>QC:</b> Confirm colour, logo position, hood shape and chest width</small><a href=\"https://kakobuymake.com/?m=home&amp;c=View&amp;a=index&amp;aid=1291\" target=\"_blank\">View product <span>↗</span></a></div></article><article class=\"product\"><a class=\"product-img\" href=\"https://kakobuymake.com/?m=home&amp;c=View&amp;a=index&amp;aid=1289\" target=\"_blank\"><img src=\"/products-v5/kobe-shoes.webp\" alt=\"Nike Kobe Basketball Shoes\"><em>09</em></a><div><p>Shoes · 27 styles</p><h3>Nike Kobe Basketball Shoes</h3><strong>$40.51</strong><small><b>QC:</b> Check colourway, heel shape, outsole length and both shoes</small><a href=\"https://kakobuymake.com/?m=home&amp;c=View&amp;a=index&amp;aid=1289\" target=\"_blank\">View product <span>↗</span></a></div></article><article class=\"product\"><a class=\"product-img\" href=\"https://kakobuymake.com/?m=home&amp;c=View&amp;a=index&amp;aid=1285\" target=\"_blank\"><img src=\"/products-v5/new-era-hats.webp\" alt=\"New Era 59FIFTY Fitted Hats\"><em>10</em></a><div><p>Other · 40 styles</p><h3>New Era 59FIFTY Fitted Hats</h3><strong>$11.25</strong><small><b>QC:</b> Confirm team design, crown shape, size label and embroidery</small><a href=\"https://kakobuymake.com/?m=home&amp;c=View&amp;a=index&amp;aid=1285\" target=\"_blank\">View product <span>↗</span></a></div></article></div><a class=\"outline-bu   "<section class=\"how\"><header class=\"center\"><p>HOW IT WORKS</p><h2>From find to parcel in three steps</h2><span>Research first, verify the warehouse evidence, then choose the shipping route.</span></header><div class=\"steps\"><article><small>01</small><i>⌕</i><h3>Browse the finds</h3><p>Start with a real product record, current options and a clear source link.</p></article><article><small>02</small><i>◎</i><h3>Review warehouse QC</h3><p>Confirm the option and visible condition; request one precise detail when needed.</p></article><article><small>03</small><i>↗</i><h3>Plan the parcel</h3><p>Compare actual and volumetric weight before choosing an eligible route.</p></article></div></section>\n" +
  "<section class=\"qc\" id=\"qc\"><div><p>QC EDUCATION</p><h2>Start with evidence,<br>not assumptions.</h2><span>Use warehouse photos to answer six visible-condition questions before the seller-return window narrows. QC helps you make a shipping decision; it is not professional authentication.</span><div class=\"qc-grid\"><article><i>01</i><div><h3>Shape & proportion</h3><p>Compare the silhouette, symmetry and panel shape with the selected listing.</p></div></article><article><i>02</i><div><h3>Stitching & construction</h3><p>Look for straight seams, clean edges, working zips and secure hardware.</p></div></article><article><i>03</i><div><h3>Logos & prints</h3><p>Check placement, alignment, colour and whether embroidery edges look clean.</p></div></article><article><i>04</i><div><h3>Materials & texture</h3><p>Use close views to review knit, grain, surface finish and visible consistency.</p></div></article><article><i>05</i><div><h3>Size measurements</h3><p>Request a visible tape measure for fit-sensitive dimensions and shoe length.</p></div></article><article><i>06</i><div><h3>Visible defects</h3><p>Scan for stains, tears, dents, scratches, missing parts and colour variation.</p></div></article></div><a class=\"qc-button\" href=\"/guides/superbuy-qc-photo-checklist.html\">Open the complete QC guide ↗</a></div><figure><figcaption>EXAMPLE QC REFERENCE DIAGRAM</figcaption><img src=\"/qc-hoodie-diagram.png\" alt=\"Hoodie QC diagram\"><p><b>3</b> standard photos · <b>CN¥2</b> listed extra detail photo*</p></figure></section>\n" +
  "<section class=\"shipping\"><div><p>PARCEL PLANNER</p><h2>Measure the box,<br>not only the haul.</h2><span>Use L × W × H ÷ 6,000 to compare parcel volume with scale weight. Final route pricing remains on Superbuy.</span><a href=\"/guides/how-superbuy-shipping-cost-is-calculated.html\">Read the shipping guide ↗</a></div><form oninput=\"calculate()\"><label>Actual weight<div><input id=\"w\" value=\"2.4\" type=\"number\" step=\"0.1\"><i>kg</i></div></label><label>Length<div><input id=\"l\" value=\"38\" type=\"number\"><i>cm</i></div></label><label>Width<div><input id=\"wd\" value=\"28\" type=\"number\"><i>cm</i></div></label><label>Height<div><input id=\"h\" value=\"20\" type=\"number\"><i>cm</i></div></label><output><small>PLANNING WEIGHT</small><b id=\"result\">3.55 kg</b><span id=\"result-note\">Scale 2.40 kg · Volume 3.55 kg</span></output></form></section>\n" +
  "<section class=\"section fees\"><header class=\"center\"><p>CLEAR COST REFERENCES</p><h2>Know what is included</h2><span>Public Superbuy service information checked in August 2026. Confirm the final amount at checkout.</span></header><div><article><b>CN¥0</b><h3>Standard purchasing</h3><p>Taobao, Tmall, JD and 1688</p></article><article><b>3</b><h3>Standard QC photos</h3><p>For ordinary eligible items</p></article><article><b>CN¥2</b><h3>Detailed photo</h3><p>One requested angle or detail</p></article><article><b>90</b><h3>Free storage days</h3><p>From warehouse arrival</p></article></div></section>\n" +
  "<section class=\"section guide-section\" id=\"guides\"><header class=\"split\"><div><p>BUYER GUIDES</p><h2>Research that saves expensive mistakes</h2></div><a class=\"outline-button\" href=\"/guides/index.html\">View all articles ↗</a></header><div class=\"guide-grid\"><article class=\"guide-card\"><a class=\"guide-image\" href=\"/guides/superbuy-product-listing-verification-guide.html\"><img src=\"/guides/superbuy-listing-verification.webp\" alt=\"Product listing, variant swatches and order verification checklist\" loading=\"eager\"><i>01</i></a><div><p>Pre-order field guide · August 31, 2026</p><h3><a href=\"/guides/superbuy-product-listing-verification-guide.html\">Superbuy Product Listing Verification: Catch Costly Order Traps</a></h3><span>Verify variants, price ranges, seller notes, minimum quantities and missing information before a Superbuy agent purchases.</span><a class=\"read\" href=\"/guides/superbuy-product-listing-verification-guide.html\">14 min <b>↗</b></a></div></article><article class=\"guide-card\"><a class=\"guide-image\" href=\"/guides/superbuy-returns-exchanges-warehouse-workflow.html\"><img src=\"/guides/superbuy-returns-exchanges.webp\" alt=\"Warehouse inspection and return or exchange preparation\" loading=\"lazy\"><i>02</i></a><div><p>After-sales field guide · August 28, 2026</p><h3><a href=\"/guides/superbuy-returns-exchanges-warehouse-workflow.html\">Superbuy Returns and Exchanges: A Warehouse-First Workflow</a></h3><span>Use warehouse evidence, seller eligibility and a cost test to decide whether to return, exchange or keep an item before international shipping.</span><a class=\"read\" href=\"/guides/superbuy-returns-exchanges-warehouse-workflow.html\">14 min <b>↗</b></a></div></article><article class=\"guide-card\"><a class=\"guide-image\" href=\"/guides/superbuy-shipping-restrictions-parcel-splitting.html\"><img src=\"/guides/superbuy-shipping-restrictions.webp\" alt=\"Restricted goods separated into compatible international parcels\" loading=\"lazy\"><i>03</i></a><div><p>Route planning · August 27, 2026</p><h3><a href=\"/guides/superbuy-shipping-restrictions-parcel-splitting.html\">Superbuy Shipping Restrictions: How to Split a Mixed Parcel</a></h3><span>Use warehouse labels and live route results to decide when batteries, liquids, branded goods or oversized items should travel separately.</span><a class=\"read\" href=\"/guides/superbuy-shipping-restrictions-parcel-splitting.html\">14 min <b>↗</b></a></div></article></div></section>\n" +
  "<section class=\"section faq\" id=\"faq\"><header class=\"center\"><p>FAQ</p><h2>Answers before checkout</h2><span>Independent guidance for common Superbuy spreadsheet, QC, shipping and fee questions.</span></header><div><details open><summary><span>01</span><b>What is a Superbuy spreadsheet?</b><i>+</i></summary><p>A Superbuy spreadsheet is an independent research index that organizes product references from marketplaces such as Taobao, Weidian and 1688 before a buyer submits an order through an agent. A useful sheet should show more than a product name and link: it should identify the category, reference price, available options, source marketplace, most recent link-check date and whether warehouse QC evidence exists. Treat every row as a starting point rather than a guarantee. Open the source listing, confirm that the seller, colour, size and version still match the recorded item, and only then paste the link into Superbuy.</p></details><details ><summary><span>02</span><b>Is this the official Superbuy website?</b><i>+</i></summary><p>No. Spreadsheets-Superbuy is an independent research and education website and is not owned, operated or endorsed by Superbuy. This website helps visitors compare product references, understand QC photos and plan parcels, but it does not accept payments, purchase merchandise, store goods, inspect warehouse arrivals or arrange international delivery. Any price, service rule or shipping explanation shown here is a research snapshot. Your Superbuy order page, warehouse record, route quotation and checkout screen remain the controlling sources for a real transaction. If the two differ, rely on the information displayed inside your Superbuy account before paying.</p></details><details ><summary><span>03</span><b>Does Superbuy provide free QC photos?</b><i>+</i></summary><p>For an ordinary eligible warehouse arrival, Superbuy currently describes its standard inspection as including three free QC photos. Those images are intended to confirm the received item, selected option and visible condition from standard warehouse angles. They should not be interpreted as a complete material test or authentication report. Inspection coverage can differ for certain 1688 order classes, second-hand purchases, customized items or products with restricted after-sales support. When the item reaches the warehouse, check how many images actually appear, compare the labels and options against your order, and request a targeted additional photo before the seller-return window closes if a critical detail is missing.</p></details><details ><summary><span>04</span><b>How much does one additional Superbuy QC photo cost?</b><i>+</i></summary><p>Superbuy's current value-added service list displays CN¥2 for one detailed photo, but the amount shown on the live service-order screen should always be treated as final. The best use of a paid photo is a precise, testable request: ask for the insole beside a ruler, the wash label in focus, the front logo photographed straight-on, or a close view of a suspected stain. A vague request such as 'take more pictures' can produce an angle that does not answer your question. Review the three standard images first, identify the single uncertainty affecting your keep-or-return decision, and write the instruction so warehouse staff can reproduce it without guessing.</p></details><details ><summary><span>05</span><b>Does Superbuy charge a purchasing service fee?</b><i>+</i></summary><p>Superbuy currently lists standard purchasing from mainstream platforms such as Taobao, Tmall, JD and 1688 at CN¥0 purchasing service fee. That does not mean the complete transaction is free. The buyer still pays the seller's product price, domestic delivery when charged, international freight and any optional warehouse services. Different rules can apply to second-hand marketplaces, unsupported websites, expert purchasing or other special-order channels. Payment processors and currency conversion can also create costs that are separate from the purchasing service fee. Before submitting an unusual link, review the order estimate line by line and distinguish platform purchasing fees from seller shipping, payment charges and optional service selections.</p></details><details ><summary><span>06</span><b>Why can international shipping cost change after payment?</b><i>+</i></summary><p>The amount paid when a parcel is first submitted is generally based on estimated packed weight, estimated dimensions and the route information available at that moment. After consolidation and packaging, the warehouse or logistics provider measures the actual parcel and determines the route's chargeable weight. A larger box, protective reinforcement, dimensional rounding or a route that compares scale weight with volumetric weight can change the result. If the verified charge is lower than the deposit, the difference may be returned to the account; if it is higher, an additional payment may be required. Compare the final parcel record with the estimate instead of treating the first quotation as a guaranteed fixed price.</p></details><details ><summary><span>07</span><b>What is volumetric weight?</b><i>+</i></summary><p>Volumetric weight converts the space occupied by a parcel into a weight used for freight calculation. Superbuy's public calculator explains the common formula length × width × height in centimetres ÷ 6,000. For example, a 50 × 40 × 30 cm carton produces a volumetric weight of 10 kg even if the scale weight is only 6 kg. A route that charges the larger figure may therefore bill 10 kg. The divisor, rounding method and comparison rule can vary by route, so use the calculation for planning rather than as a final quotation. Bulky shoes, puffer jackets and excessive seller packaging are common reasons a light haul becomes dimensionally expensive.</p></details><details ><summary><span>08</span><b>How long is free warehouse storage?</b><i>+</i></summary><p>Superbuy currently lists 90 days of free warehouse storage, normally counted from an item's warehouse arrival rather than from the day the order was placed. This period gives buyers time to receive several purchases, inspect QC images and combine compatible items into one international parcel. It should not be treated as unlimited holding time. Items left beyond the free period can attract a per-item daily storage charge, and maximum retention or extension rules may apply. Record the arrival date of every item, especially when building a haul across several sellers. Resolve returns early and submit the parcel before the oldest item approaches its deadline instead of waiting for all products to have the same storage age.</p></details><details ><summary><span>09</span><b>What does W2C mean?</b><i>+</i></summary><p>W2C usually means 'where to cop' and, in some communities, 'want to cop.' The search intent is practical: the visitor wants the original marketplace reference or a usable route to the product, not a general explanation. A responsible W2C record should identify the source platform, show the last observed price and options, state when the link was checked and connect the listing to relevant QC evidence when available. W2C is not a quality certificate. Sellers can replace a listing, reuse an old product page or change the batch without changing the URL. Confirm the live title, images, variant selection and seller identity before placing an order through Superbuy.</p></details><details ><summary><span>10</span><b>Do the prices on this website guarantee the final seller price?</b><i>+</i></summary><p>No. Every displayed product price is a reference snapshot from the time the listing was reviewed. Chinese marketplace sellers can change prices, coupons, deposits, minimum quantities, domestic shipping and variant surcharges without updating an external spreadsheet. A low headline price may also belong to the cheapest accessory or smallest option rather than the product shown in the main image. Open the source page and select the exact colour, size and version to reveal the applicable amount. Then review the Superbuy order confirmation for seller shipping and adjustments. If a purchaser reports a price difference, verify the listing rather than assuming the spreadsheet amount overrides the seller's current terms.</p></details><details ><summary><span>11</span><b>Can QC photos prove authenticity?</b><i>+</i></summary><p>No. Warehouse QC photos are evidence of visible condition, not professional authentication. They can help confirm quantity, colour, printed labels, approximate shape, measurements and obvious problems such as stains, tears, dents, missing accessories or uneven construction. They cannot reliably establish material composition, internal construction, long-term durability or legal authenticity, especially when the decisive feature is not visible in the supplied angles. Use QC to answer a defined shipping question: did the correct option arrive, is there a visible defect, and do the measured dimensions fit the intended use? If authenticity is essential, use an appropriate authorized retailer or qualified authentication service rather than relying on warehouse photographs alone.</p></details><details ><summary><span>12</span><b>How can I reduce avoidable shipping cost?</b><i>+</i></summary><p>Begin before parcel submission. Review the weight and likely dimensions of each item, consolidate compatible purchases, and remove unnecessary retail packaging only when it does not protect the product or hold resale value for you. Shoe boxes, inflatable fillers and oversized seller cartons can increase volumetric weight dramatically. Compare eligible routes using both scale and estimated dimensional weight, then consider whether splitting restricted, fragile or unusually bulky items produces a better result. Rehearsal or package-removal services can improve the estimate when available, but the cheapest configuration is not always the safest. Keep structural protection for electronics, glass, rigid accessories and any product that could be crushed during international handling.</p></details></div></section>\n" +

  "<footer><button class=\"brand\" onclick=\"showHome()\"><i>S</i><span><b>Superbuy</b><small>Spreadsheets</small></span></button><p>Independent product research, QC guidance and parcel-planning resources. Not affiliated with Superbuy.</p><a href=\"/guides/index.html\">All buyer guides →</a></footer>";const LIST="<header class=\"nav\"><button class=\"brand notranslate\" translate=\"no\" onclick=\"showHome()\"><i>S</i><span><b>Superbuy</b><small>Spreadsheets</small></span></button><nav><a href=\"#categories\" onclick=\"event.preventDefault();goSection('categories')\">Categories</a><a href=\"#products\" onclick=\"event.preventDefault();goSection('products')\">Finds</a><a href=\"#qc\" onclick=\"event.preventDefault();goSection('qc')\">QC</a><a href=\"#guides\" onclick=\"event.preventDefault();goSection('guides')\">Guides</a><a href=\"#faq\" onclick=\"event.preventDefault();goSection('faq')\">FAQ</a></nav><div class=\"nav-tools\"><a class=\"top-cta\" href=\"https://kakobuymake.com\" target=\"_blank\">Full spreadsheet ↗</a></div><button class=\"menu-toggle notranslate\" translate=\"no\" type=\"button\" aria-label=\"Open navigation\" aria-expanded=\"false\" onclick=\"toggleMenu(this)\"><i></i><i></i></button><div class=\"mobile-menu\"><button onclick=\"goSection('categories');closeMenu()\">Categories</button><button onclick=\"goSection('products');closeMenu()\">Finds</button><button onclick=\"goSection('qc');closeMenu()\">QC</button><button onclick=\"goSection('guides');closeMenu()\">Guides</button><button onclick=\"goSection('faq');closeMenu()\">FAQ</button></div></header><div class=\"nav-spacer\" aria-hidden=\"true\"></div><section class=\"page-head\"><p>ALL BUYER GUIDES</p><h1>Original research for better parcel decisions.</h1><span>Three independent, long-form English guides based on current public Superbuy service information.</span></section><section class=\"list-grid\"><button class=\"list-card\" onclick=\"showArticle('how-superbuy-shipping-cost-is-calculated')\"><img src=\"/guides/shipping.webp\" alt=\"\"><div><small>Shipping intelligence · August 21, 2026</small><h2>Superbuy Shipping Cost Explained: A Parcel-First Planning Method</h2><p>A practical, evidence-led method for first weight, dimensional pressure, restricted goods, route comparison and the final deposit adjustment.</p><b>15 min · Read full guide →</b></div></button><button class=\"list-card\" onclick=\"showArticle('superbuy-qc-photo-checklist')\"><img src=\"/guides/qc.webp\" alt=\"\"><div><small>QC field guide · August 21, 2026</small><h2>Superbuy QC Photos: A Six-Layer Inspection System Before Shipping</h2><p>Turn three standard warehouse photos into a ship, hold or after-sales decision—and know exactly when one targeted detail photo is worth buying.</p><b>14 min · Read full guide →</b></div></button><button class=\"list-card\" onclick=\"showArticle('superbuy-fees-coupons-storage-guide')\"><img src=\"/guides/fees.webp\" alt=\"\"><div><small>Cost planning · August 21, 2026</small><h2>Superbuy Service Fees, Coupons and Storage: The Real Cost Map</h2><p>Separate zero-fee purchasing from optional services, coupon conditions, warehouse ageing and the final landed cost of a parcel.</p><b>15 min · Read full guide →</b></div></button></section>";const VIEWS={"how-superbuy-shipping-cost-is-calculated":"<header class=\"nav\"><button class=\"brand notranslate\" translate=\"no\" onclick=\"showHome()\"><i>S</i><span><b>Superbuy</b><small>Spreadsheets</small></span></button><nav><a href=\"#categories\" onclick=\"event.preventDefault();goSection('categories')\">Categories</a><a href=\"#products\" onclick=\"event.preventDefault();goSection('products')\">Finds</a><a href=\"#qc\" onclick=\"event.preventDefault();goSection('qc')\">QC</a><a href=\"#guides\" onclick=\"event.preventDefault();goSection('guides')\">Guides</a><a href=\"#faq\" onclick=\"event.preventDefault();goSection('faq')\">FAQ</a></nav><div class=\"nav-tools\"><a class=\"top-cta\" href=\"https://kakobuymake.com\" target=\"_blank\">Full spreadsheet ↗</a></div><button class=\"menu-toggle notranslate\" translate=\"no\" type=\"button\" aria-label=\"Open navigation\" aria-expanded=\"false\" onclick=\"toggleMenu(this)\"><i></i><i></i></button><div class=\"mobile-menu\"><button onclick=\"goSection('categories');closeMenu()\">Categories</button><button onclick=\"goSection('products');closeMenu()\">Finds</button><button onclick=\"goSection('qc');closeMenu()\">QC</button><button onclick=\"goSection('guides');closeMenu()\">Guides</button><button onclick=\"goSection('faq');closeMenu()\">FAQ</button></div></header><div class=\"nav-spacer\" aria-hidden=\"true\"></div><section class=\"page-head\"><p>Shipping intelligence · 15 min</p><h1>Superbuy Shipping Cost Explained: A Parcel-First Planning Method</h1><span>A shipping quote is not a price tag attached to a product. It is the result of a packed parcel, a route rule and a destination. This guide shows how to plan those variables before they become an expensive surprise.</span></section><figure class=\"cover\"><img src=\"/guides/shipping.webp\" alt=\"\"></figure><div class=\"article-shell\"><aside class=\"article-aside\"><small>FIELD GUIDE</small><p>Published August 21, 2026</p><p>15 min read</p><button onclick=\"showList()\">← All articles</button></aside><article class=\"article-body\"><section><small>01</small><h2>The useful question is not ‘How much per kilogram?’</h2><p>People often begin with a product link and ask for one universal Superbuy shipping price per kilogram. That question feels practical, but it removes the variables that actually create the charge. Superbuy cannot know the final international freight when a seller has not yet sent the item to the warehouse. The warehouse still needs to receive it, record its weight, identify any shipping restrictions, combine it with other orders, remove or retain packaging, and place everything in a final carton. Only then does a parcel exist in the logistical sense.</p><p>A better starting point is parcel-first planning. Imagine the box that will leave the warehouse, not the isolated hoodie, pair of shoes or accessory currently in your cart. Ask four questions: where is it going, how heavy will the packed parcel be, how much space will it occupy, and which routes can legally accept its contents? This perspective explains why two users can ship the same product to different countries and receive very different quotes. The product is only one input; the complete packed parcel is the billable object.</p></section><section><small>02</small><h2>Separate the two payment stages before comparing prices</h2><p>A Superbuy purchase normally has two financial stages. At the purchasing stage, you pay the seller's product price and any Chinese domestic delivery fee needed to move the order to the Superbuy warehouse. Standard purchasing from mainstream platforms such as Taobao, Tmall, JD.com and 1688 is currently listed by Superbuy without a purchasing service fee. That does not mean the order has reached your country, and it does not make seller delivery, optional services, payment processing or later freight disappear.</p><p>The second stage begins when stored items are selected and submitted as an international parcel. Superbuy states that several orders can be consolidated into one parcel for free. Consolidation often improves the use of the initial chargeable unit, but it is not automatically cheaper in every case. Combining a restricted liquid with ordinary clothing may reduce route choice; adding a bulky shoe box may push the carton into a higher volumetric band. Keep merchandise, China delivery, warehouse services and international freight in separate spreadsheet columns so you can see which decision changed the total.</p></section><section><small>03</small><h2>Read first weight and continued weight as billing steps</h2><p>Many routes use an initial or first-weight unit followed by continued-weight units. Superbuy's calculator defines the first unit as the minimum billable amount. If a route begins with 500 grams, a 140-gram parcel can still be charged as 500 grams. Once the parcel crosses that unit, additional weight is billed in the route's stated increments. The increments are not necessarily smooth: a parcel just above a boundary may enter another full step, which is why removing 40 grams sometimes saves nothing and removing 140 grams sometimes changes the quote.</p><p>Compare routes with the entire chargeable weight, not the attractive first-weight headline. One line may start cheaply but add expensive continued units; another may cost more at the beginning and become better value as the parcel grows. Also read what the displayed quote includes. Superbuy's fee explanation lists possible components such as customs clearance, fuel surcharge and operation fees alongside base freight. Route labels and inclusions can change, so the live submission screen is more useful than a rate screenshot copied from an old haul in another country.</p></section><section><small>04</small><h2>Calculate dimensional pressure before the carton is packed</h2><p>A scale measures mass, while a carrier also sells limited space. Light goods that occupy a large carton can therefore be charged by volumetric weight. Superbuy's public freight calculator shows the common air-cargo formula: length multiplied by width multiplied by height in centimetres, divided by 6,000. A 60 × 40 × 30 centimetre box produces 12 kilograms of volumetric weight even when the scale reads much less. The applicable route can have its own measurement and rounding rules, but this calculation is an excellent planning alarm.</p><p>Shoes, padded jackets, plush toys and decorative boxes create more dimensional pressure than a flat stack of T-shirts. Remove unnecessary seller packaging only when it has no protective or resale value. Free simple packaging and excess-package removal can reduce avoidable space, while vacuum packaging can help compress soft textiles when that paid service is appropriate. Do not flatten a structured bag or discard protection around fragile goods simply to chase a smaller number. The rational target is the lowest protected volume, not the smallest box at any cost.</p></section><section><small>05</small><h2>Product classification can eliminate the cheapest route</h2><p>The freight calculator asks for item category because route eligibility depends on contents as well as weight. Batteries, electronics, liquids, pastes, powders, food, cosmetics, branded goods and other sensitive categories can narrow the list. Superbuy's calculator also notes that different delivery methods have their own maximum weights and that an overweight parcel must be reduced or resubmitted. A generic quote for ordinary goods should never be treated as a promise that the same line will accept a mixed parcel.</p><p>Classify the haul before consolidating it. Put ordinary textiles in one group, battery-containing products in another, and liquids or other restricted goods in a third. Then check whether combining groups creates a meaningful saving or merely removes useful routes. Destination rules matter too: a line visible for the United States may not appear for Germany, Canada or Australia with identical contents. The warehouse classification and the routes displayed at submission time are the operational answer; community route lists are only historical context.</p></section><section><small>06</small><h2>Understand why the first international payment is a deposit</h2><p>Superbuy's official purchasing guide describes the international shipping payment as a deposit calculated from estimated weight, the selected delivery method and destination. After the parcel is packed, the shipping company verifies its size and weight. If the verified charge is lower than the deposit, the difference can be returned to the Superbuy account after shipment. The important idea is that the first number is built from provisional parcel data, while the final number follows the measured parcel handed to the carrier.</p><p>This adjustment is not evidence that the calculation was arbitrary. It is a correction between prediction and packed reality. To learn from it, save the estimated weight, estimated dimensions, chosen route, deposit and final verified charge. Add notes about removed packaging or reinforcement. After two or three parcels, your own records become more valuable than a public ‘price per kilogram’ table because they reflect your destination, preferred product mix and packaging choices. You can begin to predict which items create dimensional cost and how much estimation error is typical.</p></section><section><small>07</small><h2>Compare routes on risk, not price alone</h2><p>A meaningful route comparison contains more than the payable amount. Record the delivery estimate, tracking level, maximum weight, size restrictions, accepted item categories, customs model, insurance availability and compensation ceiling. A tax-included or tax-free route label should be read through the current route description; it does not excuse inaccurate declarations or override the destination country's import law. Customs assessment remains tied to the goods, declared value and local rules, and the recipient can still have obligations.</p><p>The cheapest route can be sensible for replaceable basics and a poor choice for a fragile or time-sensitive parcel. Insurance is also not a substitute for packing. Reinforcement, corner protection or bubble cushioning may be justified when damage probability matters more than a small increase in weight. Conversely, expensive protective extras on a soft, low-value garment can add cost without solving a real problem. Choose route and packaging together because they manage different parts of the same risk: the route governs transport terms, while packaging governs physical survival.</p></section><section><small>08</small><h2>Use a pre-submission worksheet that produces a decision</h2><p>Before clicking submit, list every warehouse item with its recorded weight, restriction type and packaging decision. Estimate a carton size, calculate volumetric weight with the 6,000 divisor as a reference, and compare that figure with the total scale weight. Mark which boxes, tags or inserts must remain. Then test at least two eligible routes in the live calculator and record the full quote, not just the base freight. Apply coupons only after identifying the route you would choose without them.</p><p>Finally, create a decision note: ‘Ship together because both routes accept the contents and consolidation uses the first-weight unit efficiently,’ or ‘Split the battery item because it removes three lower-cost clothing routes.’ A written reason prevents random changes when another quote appears. After dispatch, replace estimates with final figures and calculate freight per item using one consistent allocation method, such as recorded item weight. The method will not make every parcel cheap, but it turns shipping from a surprise into a controlled, reviewable process.</p></section><section class=\"article-faq\"><small>PRACTICAL FAQ</small><h2>Questions readers ask before committing</h2><details><summary>Does Superbuy have one fixed shipping price per kilogram? <i>+</i></summary><p>No. Destination, route, packed dimensions, chargeable-weight steps, item restrictions and current surcharges all affect the quote. A per-kilogram figure taken from another parcel is not transferable without those variables.</p></details><details><summary>What volumetric-weight formula does Superbuy show? <i>+</i></summary><p>Its public calculator shows length × width × height in centimetres ÷ 6,000 for most air cargo. Individual routes can use their own rules, so treat the formula as a planning reference and confirm the live route calculation.</p></details><details><summary>Why did my final freight differ from the deposit? <i>+</i></summary><p>The deposit uses estimated parcel data. After packing, the carrier verifies weight and dimensions. Superbuy states that a difference between the final fee and deposit is adjusted after shipment, including returning an overpayment to the account.</p></details><details><summary>Is consolidation always cheaper? <i>+</i></summary><p>No. It can use the first-weight unit efficiently, but a bulky box or restricted item may raise dimensional weight or remove routes. Compare the consolidated parcel with sensible split-parcel scenarios before submitting.</p></details><details><summary>Should I remove every shoe box? <i>+</i></summary><p>Only when the box has little protective or personal value. Removing it can reduce volume, but footwear still needs protection against crushing. Choose the lowest protected volume rather than the smallest possible package.</p></details><details><summary>Can a shipping coupon make a costly route the best option? <i>+</i></summary><p>Sometimes, but compare the post-coupon total with every eligible route. A discount attached to a higher base price may still leave you paying more, and coupon thresholds, routes and expiry conditions can limit use.</p></details><details><summary>What should I record after shipment? <i>+</i></summary><p>Save packed weight and dimensions, route, deposit, coupon, final freight, packaging services and delivery outcome. These records create a destination-specific model for future parcels instead of relying on unrelated community screenshots.</p></details><details><summary>Are import taxes always included in Superbuy freight? <i>+</i></summary><p>No. Treatment depends on the selected line and destination. Read the current route description and local rules, declare accurately, and keep a separate customs allowance unless the displayed service terms clearly say otherwise.</p></details></section><div class=\"research-note\"><b>Research note</b><p>Written from Superbuy public fee, freight, purchasing, warehouse and new-user information checked on August 21, 2026. Confirm current pricing and eligibility in your account before paying.</p></div><div class=\"article-actions\"><button onclick=\"showList()\">View all buyer guides →</button><button onclick=\"showHome()\">Back to homepage →</button></div></article></div>","superbuy-qc-photo-checklist":"<header class=\"nav\"><button class=\"brand notranslate\" translate=\"no\" onclick=\"showHome()\"><i>S</i><span><b>Superbuy</b><small>Spreadsheets</small></span></button><nav><a href=\"#categories\" onclick=\"event.preventDefault();goSection('categories')\">Categories</a><a href=\"#products\" onclick=\"event.preventDefault();goSection('products')\">Finds</a><a href=\"#qc\" onclick=\"event.preventDefault();goSection('qc')\">QC</a><a href=\"#guides\" onclick=\"event.preventDefault();goSection('guides')\">Guides</a><a href=\"#faq\" onclick=\"event.preventDefault();goSection('faq')\">FAQ</a></nav><div class=\"nav-tools\"><a class=\"top-cta\" href=\"https://kakobuymake.com\" target=\"_blank\">Full spreadsheet ↗</a></div><button class=\"menu-toggle notranslate\" translate=\"no\" type=\"button\" aria-label=\"Open navigation\" aria-expanded=\"false\" onclick=\"toggleMenu(this)\"><i></i><i></i></button><div class=\"mobile-menu\"><button onclick=\"goSection('categories');closeMenu()\">Categories</button><button onclick=\"goSection('products');closeMenu()\">Finds</button><button onclick=\"goSection('qc');closeMenu()\">QC</button><button onclick=\"goSection('guides');closeMenu()\">Guides</button><button onclick=\"goSection('faq');closeMenu()\">FAQ</button></div></header><div class=\"nav-spacer\" aria-hidden=\"true\"></div><section class=\"page-head\"><p>QC field guide · 14 min</p><h1>Superbuy QC Photos: A Six-Layer Inspection System Before Shipping</h1><span>Warehouse photographs become valuable when every frame answers a specific decision. Use this evidence-led method to separate visible facts, missing information and risks that a camera cannot prove.</span></section><figure class=\"cover\"><img src=\"/guides/qc.webp\" alt=\"\"></figure><div class=\"article-shell\"><aside class=\"article-aside\"><small>FIELD GUIDE</small><p>Published August 21, 2026</p><p>14 min read</p><button onclick=\"showList()\">← All articles</button></aside><article class=\"article-body\"><section><small>01</small><h2>Treat QC as a gate, not a decoration</h2><p>Superbuy's current homepage states that three free QC photos are taken during warehouse inspection for ordinary eligible items. Those images sit at the most useful point in the buying journey: the seller has delivered the physical unit, but you have not yet paid to move it internationally. The purpose is not to admire the purchase. It is to decide whether the visible evidence supports one of three actions—ship, request clarification, or pursue an after-sales solution while the item is still in China.</p><p>Standard QC has a defined ceiling. Photographs can show the wrong colour, obvious damage, quantity, printed size and many construction details. They cannot authenticate a product, verify fibre composition, prove internal electronics performance or predict long-term durability. Superbuy's forwarding guidance also distinguishes basic confirmation from professional product inspection. Good buyers do not ask a photograph to answer a chemical or mechanical question; they identify what is visible, then buy a targeted service when a higher-risk item needs another kind of evidence.</p></section><section><small>02</small><h2>Layer one: reconcile the received item with the order</h2><p>Begin with order identity before examining craftsmanship. Match the selected colour, model, size option, quantity and included pieces against the warehouse record. For patterned items, check that the photographed version corresponds to the chosen option rather than a similar thumbnail. For sets, count visible components and note anything hidden by packaging. A beautifully made item is still wrong if it is not the configuration you paid for, and an incorrect option is usually easier to explain with a simple order-to-photo comparison.</p><p>Use all three standard frames together. Warehouse lighting, camera white balance and your display can shift colour, so one warm photograph should not trigger a conclusion by itself. Compare neutral surfaces in the scene and look for consistent differences across angles. If colour is commercially or personally critical, request a neutral-light close view with the whole affected panel visible. Describe the selected option in your request; ‘colour looks wrong’ is weaker than ‘please photograph the olive body beside the order's colour label under neutral light.’</p></section><section><small>03</small><h2>Layer two: read silhouette and proportion before details</h2><p>Stand back from the zoom button. The full-item frame reveals proportion errors that close-ups hide: unequal shoe shapes, a twisted garment body, an off-centre pocket, a tilted graphic, mismatched bag handles or an uneven hem. Compare left and right sides, then follow major horizontal and vertical lines. On clothing, inspect shoulder slope, sleeve balance and body length. On footwear, compare toe shape, heel height and the alignment of panels on both shoes rather than judging one attractive side.</p><p>Creases are not automatically defects. Soft goods can compress during domestic delivery and may relax after unpacking, while stains, abrasion, holes, glue residue and permanent distortion require a closer look. Distinguish packaging pressure from construction failure by asking whether the mark follows a fold or interrupts the material surface. If the standard image is too distant, request one straight-on full view before purchasing several tiny close-ups. Context makes a detail interpretable; without it, you may not know where the photographed flaw sits on the item.</p></section><section><small>04</small><h2>Layer three: inspect construction where stress accumulates</h2><p>Construction quality is easiest to assess at load-bearing points. Examine shoulder seams, pocket corners, cuffs, waistbands, zipper ends, bag-handle attachments, lace eyelets and the junction between a shoe upper and sole. Look for consistent stitch density, straight seams, secured thread ends and symmetrical assembly. A single loose surface thread can be minor; skipped stitches, open seams or repeated waviness near a stress point suggest a functional problem. Compare the same feature on both sides whenever the product is symmetrical.</p><p>Superbuy currently lists re-inspection at CN¥6 per order, including three photos and verification of style, quantity, colour, size, model, damage and obvious defects. Use it when the original set is contradictory or appears to document a broader problem. If the question concerns one exact location, the detailed-photo service is more efficient. The current fee table lists a personalised high-definition detail photo at CN¥2 per image, although an older example on the same official fee page still mentions CN¥3; the order screen should therefore be treated as final.</p></section><section><small>05</small><h2>Layer four: turn sizing into a reproducible measurement</h2><p>A seller size chart is a claim about a batch; a warehouse measurement is evidence about the unit received. For clothing, identify the dimensions that determine fit for that garment—chest width, shoulder width, body length, sleeve, waist, rise or inseam. For shoes, outsole or insole length often tells more than a regional size label. For bags, hats and accessories, physical dimensions prevent scale surprises that styled seller photographs can conceal. Compare these numbers with an item you already own and wear, not only with your body measurement.</p><p>Write measurement requests so another person can execute them without interpretation. Name both endpoints, ask that the item lie flat when appropriate, and require the tape numbers to remain visible in one frame. ‘Measure the hoodie’ is ambiguous; ‘measure chest width from pit seam to pit seam with the front flat’ is operational. One precise CN¥2 frame can prevent a costly international shipment, while three vague frames can leave the same uncertainty. Save the result beside the size option in your spreadsheet for future seller comparisons.</p></section><section><small>06</small><h2>Layer five: separate surface evidence from material claims</h2><p>QC photos can reveal weave, nap, grain, sheen, print edges, embroidery density and visible surface damage. They cannot confirm a fabric percentage or tell you how a coating will age. Use close views to compare consistency: does the texture change unexpectedly between panels, does embroidery pull the surrounding fabric, does screen printing crack at a fold, or does hardware finish vary between matching pieces? Natural-looking light is useful because aggressive reflections can disguise scratches and flatten texture.</p><p>For electronics, a photograph of the box or device exterior is not a function test. Superbuy's fee list currently offers a CN¥12 power-on inspection for 3C products and appliances, with a photo showing powered-on status. Even that check confirms a limited moment, not every feature, battery health or long-term reliability. Decide what failure would make the purchase unacceptable, then choose evidence proportional to the risk. A simple accessory may need only quantity and connector type; a higher-value device may justify power-on evidence and closer inspection of ports.</p></section><section><small>07</small><h2>Layer six: finish with a written ship, hold or return record</h2><p>After review, write one outcome. ‘Ship’ means the visible item matches the order and no unresolved issue exceeds your tolerance. ‘Hold’ means a named question remains and you have requested a specific photo, measurement or inspection. ‘After-sales’ means the evidence shows a material mismatch or defect and you are contacting the agent before the relevant return opportunity closes. Do not leave an item in a vague mental state while the warehouse clock continues; Superbuy lists 90 days of free storage, but seller after-sales windows can be much shorter.</p><p>Store the QC date, received option, measured values, visible issues, extra-service cost and final decision in your product record. That history reveals patterns no single photograph can show. You may learn that one clothing category consistently needs chest measurements, that glossy accessories require angle-specific scratch checks, or that a seller's colours regularly differ from listing images. QC then becomes a feedback system: every parcel improves the questions you ask before buying and the evidence you request before paying international freight.</p></section><section class=\"article-faq\"><small>PRACTICAL FAQ</small><h2>Questions readers ask before committing</h2><details><summary>How many free Superbuy QC photos are provided? <i>+</i></summary><p>Superbuy currently advertises three free QC photos during warehouse inspection for ordinary eligible items. Some 1688 categories and special order types can follow different standards, so check the order record when the expected photos are absent.</p></details><details><summary>How much is one extra detailed photo? <i>+</i></summary><p>The current value-added service table lists CN¥2 per detailed photo. Because an older example on the same official page still mentions CN¥3, rely on the price displayed in your order before payment.</p></details><details><summary>Can QC photos prove authenticity? <i>+</i></summary><p>No. They document visible condition and attributes. They are not professional authentication, laboratory analysis or a guarantee of material composition, performance or durability.</p></details><details><summary>What is the best first extra photo for clothing? <i>+</i></summary><p>Usually a fit-critical measurement or a straight-on view of a suspected defect. Name the exact endpoints or location so the image resolves a decision instead of adding another general angle.</p></details><details><summary>When is re-inspection better than one detailed photo? <i>+</i></summary><p>Choose re-inspection when the standard set is incomplete, contradictory or suggests multiple basic problems involving option, quantity, damage or obvious defects. Use a detailed photo for one tightly defined question.</p></details><details><summary>Can warehouse lighting make the colour look wrong? <i>+</i></summary><p>Yes. Camera white balance, lighting and your screen can shift colour. Compare every frame and request a neutral-light photo when exact colour is central to the decision.</p></details><details><summary>Does a power-on photo prove an electronic item fully works? <i>+</i></summary><p>No. It shows that the device reached a powered-on state during the check. It does not test every function, battery condition or future reliability.</p></details><details><summary>How should QC notes be stored? <i>+</i></summary><p>Record the review date, selected and received options, measurements, visible issues, paid checks and final action. Connect the notes to the exact product link and warehouse order.</p></details></section><div class=\"research-note\"><b>Research note</b><p>Written from Superbuy public fee, freight, purchasing, warehouse and new-user information checked on August 21, 2026. Confirm current pricing and eligibility in your account before paying.</p></div><div class=\"article-actions\"><button onclick=\"showList()\">View all buyer guides →</button><button onclick=\"showHome()\">Back to homepage →</button></div></article></div>","superbuy-fees-coupons-storage-guide":"<header class=\"nav\"><button class=\"brand notranslate\" translate=\"no\" onclick=\"showHome()\"><i>S</i><span><b>Superbuy</b><small>Spreadsheets</small></span></button><nav><a href=\"#categories\" onclick=\"event.preventDefault();goSection('categories')\">Categories</a><a href=\"#products\" onclick=\"event.preventDefault();goSection('products')\">Finds</a><a href=\"#qc\" onclick=\"event.preventDefault();goSection('qc')\">QC</a><a href=\"#guides\" onclick=\"event.preventDefault();goSection('guides')\">Guides</a><a href=\"#faq\" onclick=\"event.preventDefault();goSection('faq')\">FAQ</a></nav><div class=\"nav-tools\"><a class=\"top-cta\" href=\"https://kakobuymake.com\" target=\"_blank\">Full spreadsheet ↗</a></div><button class=\"menu-toggle notranslate\" translate=\"no\" type=\"button\" aria-label=\"Open navigation\" aria-expanded=\"false\" onclick=\"toggleMenu(this)\"><i></i><i></i></button><div class=\"mobile-menu\"><button onclick=\"goSection('categories');closeMenu()\">Categories</button><button onclick=\"goSection('products');closeMenu()\">Finds</button><button onclick=\"goSection('qc');closeMenu()\">QC</button><button onclick=\"goSection('guides');closeMenu()\">Guides</button><button onclick=\"goSection('faq');closeMenu()\">FAQ</button></div></header><div class=\"nav-spacer\" aria-hidden=\"true\"></div><section class=\"page-head\"><p>Cost planning · 15 min</p><h1>Superbuy Service Fees, Coupons and Storage: The Real Cost Map</h1><span>The phrase ‘zero service fee’ describes one line in a multi-stage purchase. This guide maps every decision that can change landed cost, then shows where coupons and free storage genuinely help.</span></section><figure class=\"cover\"><img src=\"/guides/fees.webp\" alt=\"\"></figure><div class=\"article-shell\"><aside class=\"article-aside\"><small>FIELD GUIDE</small><p>Published August 21, 2026</p><p>15 min read</p><button onclick=\"showList()\">← All articles</button></aside><article class=\"article-body\"><section><small>01</small><h2>Build the cost map before looking for a discount</h2><p>A low marketplace price is the opening figure, not the completed cost. A useful Superbuy budget has separate lines for merchandise, Chinese domestic delivery, purchasing service, selected warehouse services, international freight, payment or currency-conversion effects, and destination-side tax or handling. Each line belongs to a different decision-maker. The seller controls the product and often domestic delivery; you select warehouse services and a shipping route; payment providers set their own processing and exchange conditions; customs follows destination law.</p><p>Keeping these lines separate prevents false conclusions. If a CN¥80 item later costs CN¥220 at your door, that does not prove a hidden CN¥140 agent fee. The difference may be domestic postage, detailed photographs, protective packing, the first international weight unit and import charges. Conversely, a zero purchasing fee does not guarantee a competitive landed total. A cost map makes the transaction auditable: you can identify the expensive stage and change the behaviour that produced it instead of blaming one vague number called ‘fees.’</p></section><section><small>02</small><h2>Know exactly where standard purchasing is free</h2><p>Superbuy's current official fee structure lists standard purchasing from Taobao, Tmall, JD.com and 1688 without a purchasing service fee. You still pay the product price and any Chinese courier charge from the merchant to the warehouse. A seller with ‘free shipping’ may absorb that domestic leg; another seller may add it. The distinction matters when comparing duplicate listings because a slightly higher item price with domestic delivery included can beat a cheaper listing that adds courier cost at checkout.</p><p>Do not extend the zero-fee statement to every source link. Superbuy currently lists a flat CN¥20 fee per order for second-hand purchases from platforms such as Xianyu, Paipai and Zhuanzhuan. Kongfz and other second-hand platforms are shown at 10 percent of item value, with a CN¥10 minimum and CN¥20 maximum. Unlisted platforms use the same published percentage range, while Shipping Expert purchasing for special goods is listed at 10 percent, with a CN¥20 minimum and CN¥300 maximum. Confirm the category assigned on the order page.</p></section><section><small>03</small><h2>Treat value-added services as uncertainty reducers</h2><p>Optional services are not hidden charges when the user actively selects them, but they can become habitual spending if chosen without a question. Superbuy's current table lists a detailed photo at CN¥2, re-inspection at CN¥6 per order, a power-on check for electronics at CN¥12 per item, a product video at CN¥20, and model try-on photos at CN¥30. Prices and availability can change, and the live order screen remains final. The important budgeting method is to connect every service with a named risk.</p><p>Ask what evidence changes your decision. A chest measurement can prevent an unusable garment; a power-on image can detect one category of electronic failure; a close photograph can document a scratch. Purchasing all three for a simple low-value T-shirt would be poor allocation. The same reasoning applies to packaging. Free excess-packaging removal or simple packaging can lower weight, while paid bubble cushioning, sealing or reinforcement can protect vulnerable goods. Optional cost is rational when the expected loss it reduces is larger than the service price.</p></section><section><small>04</small><h2>Read the 90-day storage benefit as a working window</h2><p>Superbuy currently provides 90 days of free storage from warehouse arrival. This window is useful because purchases from different sellers rarely arrive together; it allows QC review and consolidation without immediate international dispatch. After the free period, the official fee page lists CN¥0.1 per item per day. The ordinary maximum storage period is 180 days, after which an item with no parcel submission or feedback may be treated as abandoned and disposed of under the published policy.</p><p>The storage extension service is a separate concept. Superbuy currently lists it at CN¥10 per item per month, with up to six months for an individual product. The page explicitly says that extending the maximum storage period does not remove the daily storage fee after the free period. In practical terms, paying for an extension buys time, not free warehousing. Create a tracker with arrival date, QC status, seller after-sales deadline, free-storage end date and intended parcel. Review it weekly rather than discovering forgotten items on day 91.</p></section><section><small>05</small><h2>Decode the coupon bundle without turning it into cash</h2><p>Superbuy publicly promotes a CN¥560 new-user gift or coupon bundle. That figure is an aggregate face value, not a CN¥560 cash balance and not a promise that one parcel will receive the full reduction. Individual shipping coupons can carry minimum-spend thresholds, route eligibility, expiry dates and task or account conditions. Because the public banner does not display every term, the logged-in coupon wallet and parcel submission page are the authoritative sources for what can be used on a specific shipment.</p><p>The official new-user task page gives a more concrete example. It currently lists six shipping-coupon rewards: CN¥10 for completing the new-user guide; CN¥20 for a first shopping-agent order; CN¥20 for a first forwarding order; CN¥10 for first use of a value-added service; CN¥20 for shipping a first international parcel; and CN¥20 for sharing as a new user. These visible tasks total CN¥100. Do not combine that number with the advertised CN¥560 bundle unless the account terms show that the rewards are separate and simultaneously claimable.</p></section><section><small>06</small><h2>Apply coupons after route selection, not before</h2><p>A coupon is useful only against the right baseline. First compare every eligible route using chargeable weight, delivery range, item acceptance, tracking, customs model, insurance and compensation. Identify the route you would choose at full price. Then test each available coupon and record the final payable amount. If a CN¥30 coupon forces a route that costs CN¥55 more before discount, it has increased spending while creating the feeling of a saving.</p><p>Also check expiry against the warehouse plan. Rushing an incomplete parcel to use a coupon can waste the first-weight unit, while waiting for an additional item may improve consolidation but allow the coupon to expire. There is no universal answer because item arrival dates and route thresholds differ. Write both scenarios: ship now with the current voucher, or consolidate later without it. Compare total landed cost and operational risk, not the emotional value of ‘using’ a benefit before it disappears.</p></section><section><small>07</small><h2>Keep international freight outside the service-fee debate</h2><p>International shipping is the second purchasing stage, not a percentage purchasing commission. Superbuy explains that the charge can combine initial weight, additional weight, customs clearance, fuel surcharge and operation components, depending on the route. The system uses destination, selected line and final parcel data. Its freight calculator also shows the common volumetric reference of length × width × height in centimetres divided by 6,000, which explains why a light but bulky order can exceed its scale-weight expectation.</p><p>The official purchasing guide describes the initial international payment as a deposit based on estimated weight, method and destination. The carrier later verifies packed size and weight, and a difference can be adjusted after shipment. Keep the deposit and final charge as separate fields. If you place the entire freight adjustment under ‘service fee,’ you lose the information needed to improve packaging and route choice. Cost analysis is useful only when each figure is assigned to the mechanism that actually produced it.</p></section><section><small>08</small><h2>Calculate landed cost with one consistent allocation rule</h2><p>After dispatch, close the record. Enter final merchandise and domestic delivery, special purchasing charge if any, warehouse services, verified international freight, coupon discount, payment cost and any known import amount. For a consolidated parcel, allocate shared freight by recorded warehouse weight, volumetric contribution or another method you can repeat. Weight is simple and transparent; volumetric allocation is more accurate for bulky items but requires measurements. Consistency is more important than pretending that an arbitrary split is perfectly precise.</p><p>This ledger changes future buying. You may discover that cheap boxed accessories are expensive after dimensional allocation, while compact clothing remains efficient. You may find that one extra measurement prevents enough returns to justify its cost, or that most coupons never affect the winning route. The goal is not to minimise every line. It is to spend deliberately: use free standard purchasing where it applies, buy evidence and protection only when they resolve a real risk, and dispatch before storage becomes an avoidable recurring charge.</p></section><section class=\"article-faq\"><small>PRACTICAL FAQ</small><h2>Questions readers ask before committing</h2><details><summary>Does Superbuy charge a service fee for Taobao or 1688? <i>+</i></summary><p>Its current fee structure lists standard purchasing from Taobao, Tmall, JD.com and 1688 with no purchasing service fee. Product price, seller delivery, optional services, international freight and other transaction costs remain separate.</p></details><details><summary>What is the published fee for Xianyu purchases? <i>+</i></summary><p>Superbuy currently lists CN¥20 per order for second-hand purchasing from Xianyu, Paipai, Zhuanzhuan and similar named platforms. Check the order page in case the link is classified differently.</p></details><details><summary>Is the CN¥560 new-user offer cash? <i>+</i></summary><p>No. It is advertised as a gift or shipping-coupon bundle with aggregate face value. Each coupon can have its own threshold, route, expiry and account conditions.</p></details><details><summary>How much free storage does Superbuy provide? <i>+</i></summary><p>The current policy lists 90 days from warehouse arrival. After that, the published charge is CN¥0.1 per item per day, subject to the storage rules shown in your account.</p></details><details><summary>Does paying for storage extension remove daily storage fees? <i>+</i></summary><p>No. Superbuy's fee page says the extension increases the maximum period, while daily storage charges still apply after the original free period.</p></details><details><summary>Are three standard QC photos an extra fee? <i>+</i></summary><p>Superbuy currently promotes three free QC photos for ordinary eligible warehouse items. Additional specified angles, re-inspection and specialised checks are optional paid services.</p></details><details><summary>Should payment exchange costs be called a purchasing fee? <i>+</i></summary><p>No. Card processing, top-up charges or currency conversion come from the payment method and exchange path. Record them separately so the purchasing service price remains accurate.</p></details><details><summary>What is the best way to compare coupon value? <i>+</i></summary><p>Record the best eligible route at full price, then apply the coupon and compare final payable totals. Do not value a voucher by face amount when it requires a more expensive route.</p></details></section><div class=\"research-note\"><b>Research note</b><p>Written from Superbuy public fee, freight, purchasing, warehouse and new-user information checked on August 21, 2026. Confirm current pricing and eligibility in your account before paying.</p></div><div class=\"article-actions\"><button onclick=\"showList()\">View all buyer guides →</button><button onclick=\"showHome()\">Back to homepage →</button></div></article></div>"};const I18N={"zh":{"Language":"语言","Categories":"分类","Finds":"精选商品","Guides":"指南","Full spreadsheet ↗":"完整电子表格 ↗","Independent Superbuy product research · 2026":"独立 Superbuy 商品研究 · 2026","Find better products.":"发现更好的商品。","Ship with confidence."
