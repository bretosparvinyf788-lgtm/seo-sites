<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Sugargoo shipping to the United States</title><desc id="d">A parcel route from a China warehouse to a United States delivery checkpoint.</desc><rect width="1200" height="630" fill="#f4efe6"/><circle cx="1030" cy="90" r="170" fill="#315fff"/><text x="65" y="95" fill="#ff5a1f" font-family="Arial" font-size="23" font-weight="900">USA ROUTE BOARD / 2026</text><text x="65" y="175" fill="#171714" font-family="Arial" font-size="62" font-weight="900">COST. TIME. TRACKING.</text><path d="M135 430C350 265 520 540 735 375s285-75 360-145" fill="none" stroke="#171714" stroke-width="8" stroke-dasharray="20 15"/><g font-family="Arial" font-weight="900"><rect x="70" y="350" width="220" height="135" rx="18" fill="#ffd7c6"/><text x="104" y="410" font-size="20">WAREHOUSE</text><text x="104" y="450" font-size="16">MEASURE</text><rect x="470" y="420" width="220" height="135" rx="18" fill="#dbe8ff"/><text x="510" y="480" font-size="20">ROUTE</text><text x="510" y="520" font-size="16">COMPARE</text><rect x="840" y="285" width="280" height="135" rx="18" fill="#b7f02a"/><text x="875" y="345" font-size="20">UNITED STATES</text><text x="875" y="385" font-size="16">TRACK HANDOFF</text></g><text x="65" y="590" fill="#6f6d65" font-family="Arial" font-size="20">CHOOSE FROM THE CURRENT PARCEL, NOT AN OLD ROUTE NAME.</text></svg>
