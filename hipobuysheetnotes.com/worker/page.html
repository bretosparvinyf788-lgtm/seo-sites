  <script>const DATA={"languages":{"en":"English (United States)","en-GB":"English (United Kingdom)","en-AU":"English (Australia)","en-NZ":"English (New Zealand)","en-CA":"English (Canada)","zh":"简体中文（中国）","fr":"Français (France)","de":"Deutsch (Deutschland)","de-CH":"Deutsch (Schweiz)","it":"Italiano (Italia)","pl":"Polski (Polska)","pt":"Português (Portugal)","pt-BR":"Português (Brasil)","es":"Español (España)","es-MX":"Español (México)","da":"Dansk (Danmark)","no":"Norsk (Norge)","sv":"Svenska (Sverige)","ko":"한국어 (대한민국)"},"copy":{"en":{"nav":["Home","All finds","Categories","Image search"],"eyebrow":"INDEPENDENT PRODUCT NOTES","title":"Hipobuy Spreadsheet","intro":"Explore current finds by category, compare listing photos and prices, then check the item on Hipobuy before ordering.","search":"Search products","searchButton":"Search","categories":"Browse by category","latest":"Latest from the source","browse":"Browse all finds","guideTitle":"From a find to an informed order","guide":["Start with a product keyword or one of the ten categories. Browse the full catalog to sort by newest, price or views, and open several items for comparison. Compare the item title, cover image and listed price rather than choosing from a photo alone. If a search is too narrow, try fewer words or a different spelling.","Open the product page to review the original seller carousel and the separate source reference photos below it. Compare size, color, material and variant details on the original listing. Similar photos can belong to different sellers. Reference images are not your own order’s warehouse inspection, so use them as a starting point and ask about any missing details.","Use the Hipobuy purchase link when available, then confirm that the item and selected size or color match your choice. Currency conversions here are approximate; check the current price and any applicable shipping charges on Hipobuy. Before arranging delivery, review the inspection photos for your own order. Handle payments, order questions and after-sales support through your Hipobuy account."],"faqTitle":"Common questions","faq":[["Can I download a spreadsheet file?","“Spreadsheet” describes the browsable collection of product links on this site. Open categories or the full catalog to move through individual listings and their detail pages; there is no file download or separate sheet to import."],["Is this an official Hipobuy website?","No. This is an independent product directory; Hipobuy operates its own registration and purchasing service. Selecting a verified purchase link takes you to Hipobuy. A listing here does not mean Hipobuy has inspected or endorsed that seller."],["Where do the listings and categories come from?","Products, ten categories, cover images and prices are read from an external catalog when you browse. This site does not keep a separate product database. Each product page retains the corresponding source record so you can compare what is displayed."],["Do you handle orders or customer support?","This site helps you browse and compare listings. It does not accept payments or manage purchases, warehouse inspection, parcels or refunds. For an existing order, contact Hipobuy through your account and provide the relevant order number."],["How do I find and compare products?","Search by words in a listing, choose one of the available categories, and use the supported sort options on the full catalog. Open individual pages to compare their seller photos, source reference photos, source record and purchase destination. There is no brand filter."],["Can I search by uploading a photo?","Image search and photo uploads are not available on this site yet. Use the text search and category pages instead, then inspect each matching product page. Similar-looking products from different sellers should not be treated as the same listing."],["Why can two similar products be separate entries?","A similar title or cover photo can belong to different sellers, variants or source records. Open both product pages and compare their product IDs, seller galleries and source links before deciding they represent the same offer."],["What should I do when a search has no results?","Try fewer keywords or a different spelling, then browse the relevant category. A seller may use a different title. If the source is temporarily unavailable, retry later; an empty search does not confirm that the product is out of stock."],["Where do the carousel images come from?","For a product with a valid Weidian ID, the upper gallery reads images for that exact original seller item, including genuine variant photos when available. Clicking a thumbnail changes the preview only. Choose a size or color later on the purchasing page."],["Are the photos below a product verified warehouse QC?","Not necessarily. The lower photos are reference images from the matching source product page; the source does not label each one as a warehouse QC record. Seller presentation images appear in the upper carousel. Neither set proves the quality of the item you will receive."],["Why does a product have one image or no seller gallery?","Some original sellers publish only one picture. Other source records lack a valid Weidian ID, or a seller page may be unavailable. The product page explains the known case and keeps the source reference photos separate; it never repeats those photos to fake a carousel."],["Where can I check sizing and material details?","Open the original seller listing and the Hipobuy purchase page for the exact item and variant. Look for measurements, material descriptions and size charts; photos alone cannot establish fit or fabric. Ask for missing information before ordering."],["Are the listed prices or stock guaranteed?","No. The catalog shows a source price for comparison, and sellers may change prices, options or availability. Select your country currency for an approximate conversion, then confirm the exact variant and final price on Hipobuy before paying."],["How does the Hipobuy purchase link work?","When a valid Weidian item ID is present, the purchase button opens that item on Hipobuy with the supplied invitation code. It does not place an order on this site. Check the item title, selected variant, live price and address on Hipobuy before continuing."],["What if the seller changes or removes a product?","A seller can edit a price, variants or photos after an entry appears here, or remove the listing entirely. Recheck the original record and the Hipobuy destination before purchasing; a past image is not a current stock or quality guarantee."],["Does a listing establish authenticity or quality?","No. This directory provides links, seller images and source references, not authentication, laboratory testing or a quality score. Photos may be from an earlier item or different lighting. Review the exact offer and decide on the purchasing site."]],"register":"Register on Hipobuy","view":"View details","original":"Check source page","buy":"Open on Hipobuy","source":"Updated product listings","imageTitle":"Image search","imageBody":"Image search is not available yet. Photo uploads are disabled and no photos are stored here.","back":"Back to finds","noResults":"No matching source listings were returned.","unavailable":"The source is temporarily unavailable. Please try again shortly.","independent":"Independent product guide, not operated by Hipobuy. Confirm product details before placing an order.","photoNote":"Source listing photos. No separate QC records were identified for this item.","sourceNote":"Verify images, variants and price on the source and purchase pages.","page":"Page","next":"Next","previous":"Previous","sorting":"Sort","sortOptions":["Source order","Price: low to high","Price: high to low"],"faqGroups":["About this directory","Finding and comparing items","Photos and product pages","Prices, links and purchasing"],"guideHeadings":["Find a shortlist","Check the exact listing","Review before you order"]},"zh":{"nav":["首页","全部商品","分类","图片搜索"],"eyebrow":"独立商品笔记","title":"Hipobuy Spreadsheet","intro":"按分类浏览商品，比较商品图片与标价，再前往 Hipobuy 核对商品后下单。","search":"搜索商品","searchButton":"搜索","categories":"按分类浏览","latest":"精选商品","browse":"浏览全部商品","guideTitle":"从发现商品到确认订单","guide":["先用商品关键词搜索，或从十个分类中选择对应类别。进入全部商品页面后，可以按最新、价格或浏览量排序，并打开几件候选商品进行比较。不要只看封面就决定，请同时核对名称、标价和商品详情；搜索范围太窄时，可减少关键词或换一种拼写。","打开商品详情，查看上方原卖家轮播与下方单独展示的来源参考照片，再到原始页面核对尺码、颜色、材质和规格。外观相似的图片可能来自不同卖家。参考照片并不等于自己订单的仓库验货记录；缺少尺寸或材质信息时，先询问清楚再决定购买。","如有 Hipobuy 购买链接，进入后再次确认商品以及所选尺码、颜色是否对应。本站货币换算仅供参考，请在 Hipobuy 核对实时价格和适用的运费。安排发货前检查自己订单的验货照片；付款、订单问题与售后通过自己的 Hipobuy 账户处理。"],"faqTitle":"常见问题","faq":[["可以下载电子表格文件吗？","“电子表格”指本站可浏览的商品链接合集。您可以按分类或进入完整目录查看每件商品及其独立详情页；目前没有单独可下载或导入的表格文件。"],["这是 Hipobuy 官方网站吗？","不是。本站是独立商品目录，注册和购买服务由 Hipobuy 官方网站提供。点击已核验的购买链接会离开本站；收录某件商品不代表 Hipobuy 已检查或认可该卖家。"],["商品与分类从哪里来？","商品、十个分类、封面和标价在浏览时从外部目录读取，本站没有独立商品数据库。每个独立商品页保留对应来源记录，方便核对页面展示的信息。"],["本站能处理订单或提供售后吗？","本站用于浏览和比较商品，不收款，也不管理采购、仓库验货、包裹或退款。已有订单的问题请通过自己的 Hipobuy 账户联系客服，并提供对应订单号。"],["如何查找和比较商品？","可用商品关键词搜索、进入对应分类，并在完整目录使用支持的排序方式。比较时请打开各自商品页，核对卖家轮播、来源参考照片、来源记录和购买目标；本站没有品牌筛选。"],["能上传照片搜商品吗？","本站图片搜索暂未开放，也不能上传照片。请先使用关键词搜索或分类浏览，再打开商品详情核对图片；不同卖家的相似图片不能视为同一商品。"],["为什么相似商品会是不同记录？","相近标题或封面可能属于不同卖家、款式或来源记录。请分别打开详情页，核对商品编号、卖家图库和来源链接，再判断是否为同一件商品。"],["搜索没有结果时该怎么办？","试着减少关键词、换一种拼写，或直接进入对应分类。卖家可能使用不同的商品名称。若来源暂时无法读取，请稍后重试；没有搜索结果不代表商品已经售罄。"],["上方商品轮播图来自哪里？","有有效微店商品 ID 时，上方轮播读取该原卖家商品的展示图，并在可用时加入同一商品的真实款式图。点击缩略图只切换预览；尺码、颜色要到购买页面再选择。"],["商品下方照片都是已核验的仓库 QC 吗？","不一定。下方是同一来源商品页的参考照片，来源站没有逐张标明是否为仓库 QC；上方轮播则来自卖家展示图。两组图片都不能保证未来收到的商品质量。"],["为什么商品只有一张图或没有轮播？","有些卖家原本只发布一张图片；另一些来源记录缺少有效微店 ID，或原商品页暂时无法访问。详情页会说明已知原因，下方参考照片仍独立展示，不会重复它们凑轮播。"],["在哪里核对尺码和材质？","请打开该商品与对应规格的卖家原始页面和 Hipobuy 购买页面，查看实际尺寸、材质说明和尺码表。单靠照片不能判断合身程度或面料；信息缺失时先询问，再下单。"],["价格和库存有保证吗？","没有。目录显示来源站标价用于比较，卖家随时可能改价、调整规格或下架。选择国家货币只会按参考汇率约算；付款前请在 Hipobuy 核实所选款式和最终金额。"],["Hipobuy 购买链接如何工作？","来源记录含有效微店商品 ID 时，按钮会打开 Hipobuy 对应商品并保留邀请码；本站不会替您下单。继续购买前请在 Hipobuy 核对商品标题、规格、实时价格与收货地址。"],["卖家修改或下架商品怎么办？","卖家可能随时修改价格、规格和图片，也可能下架商品。购买前请重新核对来源记录与 Hipobuy 页面；旧照片不能保证当前库存或品质。"],["列表能证明商品真伪或品质吗？","不能。本站提供商品链接、卖家展示图和来源参考照片，不提供鉴定、检测或质量评分。照片可能来自较早商品或不同光线；请核对具体卖家报价后自行决定。"]],"register":"前往 Hipobuy 注册","view":"查看详情","original":"查看原始商品页","buy":"前往 Hipobuy","source":"实时更新的商品","imageTitle":"图片搜索","imageBody":"图片搜索暂未开放；这里不能上传照片，也不会保存照片。","back":"返回商品列表","noResults":"没有匹配的商品。","unavailable":"商品暂时无法读取，请稍后重试。","independent":"独立商品推荐站，非 Hipobuy 官方运营。下单前请核对商品详情。","photoNote":"来源站商品图片；该商品未识别到独立 QC 记录。","sourceNote":"请在来源页与购买页再次核对图片、规格及价格。","page":"第","next":"下一页","previous":"上一页","sorting":"排序","sortOptions":["默认顺序","价格从低到高","价格从高到低"],"faqGroups":["关于这个商品目录","查找与比较商品","商品图片与详情","价格、链接与购买"],"guideHeadings":["搜索并建立候选清单","核对具体商品与图片","下单与发货前再确认"]},"de":{"nav":["Startseite","Alle Artikel","Kategorien","Bildsuche"],"eyebrow":"UNABHÄNGIGE PRODUKTNOTIZEN","title":"Hipobuy Spreadsheet","intro":"Entdecke aktuelle Artikel nach Kategorien, vergleiche Fotos und Preise und prüfe sie vor der Bestellung bei Hipobuy.","search":"Produkte suchen","searchButton":"Suchen","categories":"Kategorien entdecken","latest":"Neu aus der Quelle","browse":"Alle Artikel ansehen","guideTitle":"Vom Fund zur Bestellung","guide":["Suche nach einem Produktwort oder wähle eine der zehn Kategorien. Sortiere den vollständigen Katalog nach neuesten Artikeln, Preis oder Aufrufen und öffne mehrere Angebote zum Vergleich. Prüfe Titel, Bild und Preis zusammen. Versuche weniger Wörter oder eine andere Schreibweise, wenn die Suche zu eng ist.","Prüfe auf der Produktseite die Verkäufergalerie und die getrennten Referenzfotos. Vergleiche Größen, Farben, Materialien und Varianten im Originalangebot. Ähnliche Fotos können von verschiedenen Verkäufern stammen. Referenzbilder sind keine Lagerprüfung deiner Bestellung; frage fehlende Maße und Materialangaben vor dem Kauf nach.","Öffne den verfügbaren Hipobuy-Link und prüfe Artikel, Größe und Farbe erneut. Währungsumrechnungen sind ungefähre Angaben; bestätige den aktuellen Preis und anfallende Versandkosten auf Hipobuy. Prüfe vor dem Versand die Inspektionsbilder deiner eigenen Bestellung. Zahlungen, Bestellfragen und Kundendienst laufen über dein Hipobuy-Konto."],"faqTitle":"Häufige Fragen","faq":[["Kann ich eine Tabellendatei herunterladen?","Dies ist ein online durchsuchbarer Produktkatalog mit Kategorien und einzelnen Produktseiten. Eine Datei zum Herunterladen gibt es nicht."],["Ist dies eine offizielle Hipobuy-Liste?","Nein. Dies ist ein unabhängiger Produktratgeber. Registrierung und Kauf erfolgen bei Hipobuy."],["Woher stammen die Produkte?","Produkte, Kategorien, Bilder und Preise werden aus einem externen Katalog geladen. Eine eigene Produktdatenbank gibt es hier nicht."],["Bearbeitet diese Seite Bestellungen und Kundendienst?","Diese Seite dient zum Durchsehen und Vergleichen von Angeboten. Sie nimmt keine Zahlungen an und verwaltet keine Bestellungen, Lagerprüfungen, Pakete oder Erstattungen. Kontaktiere bei einer bestehenden Bestellung Hipobuy über dein Konto mit der Bestellnummer."],["Wie finde und vergleiche ich Produkte?","Suche nach Begriffen, wähle eine Kategorie und nutze die verfügbaren Sortierungen. Öffne die Produktseiten, um Bilder und Originaleinträge zu vergleichen."],["Kann ich mit einem Foto suchen?","Bildsuche und Foto-Uploads sind derzeit nicht verfügbar. Nutze Textsuche und Kategorien, prüfe dann jede Produktseite; ähnlich aussehende Bilder müssen nicht denselben Artikel zeigen."],["Warum gibt es ähnliche Produkte als getrennte Einträge?","Ähnliche Titel oder Cover können von verschiedenen Verkäufern oder Varianten stammen. Vergleiche Produkt-IDs, Galerien und Quelllinks, bevor du sie für dasselbe Angebot hältst."],["Was tun, wenn die Suche keine Ergebnisse liefert?","Versuche weniger Suchwörter oder eine andere Schreibweise und durchsuche die passende Kategorie. Verkäufer können andere Titel verwenden. Ist die Quelle nicht erreichbar, versuche es später erneut. Keine Ergebnisse bedeuten nicht automatisch, dass ein Artikel ausverkauft ist."],["Woher stammen die Bilder im Produktkarussell?","Bei gültiger Weidian-ID zeigt die obere Galerie Verkäuferbilder genau dieses Artikels. Miniaturen ändern nur die Vorschau, nicht die Größe oder Farbe einer Bestellung."],["Sind alle Bilder QC-Fotos?","Die Galerie zeigt Bilder der Quelle. Ohne eindeutige Kennzeichnung nennen wir sie nicht QC-Fotos."],["Warum gibt es nur ein Bild oder keine Verkäufergalerie?","Der Verkäufer bietet eventuell nur ein Bild, das Angebot ist nicht erreichbar oder eine gültige Weidian-ID fehlt. Die Seite zeigt bekannte Gründe und wiederholt keine QC-Bilder als Karussell."],["Wo prüfe ich Größen und Materialien?","Öffne das Originalangebot und die Hipobuy-Kaufseite für den genauen Artikel und die Variante. Prüfe Maße, Materialangaben und Größentabellen. Fotos allein bestimmen weder Passform noch Stoff. Frage fehlende Angaben vor der Bestellung nach."],["Sind Preise und Verfügbarkeit garantiert?","Nein. Prüfe Preis, Variante und Bestand vor der Zahlung erneut."],["Was öffnet der Hipobuy-Kauflink?","Ein geprüfter Artikellink öffnet das passende Produkt bei Hipobuy mit dem angegebenen Einladungscode. Prüfe dort Titel, Varianten und aktuellen Preis."],["Was, wenn der Verkäufer den Artikel ändert oder entfernt?","Preise, Varianten und Bilder können geändert oder Angebote entfernt werden. Prüfe Quelle und Hipobuy-Seite vor dem Kauf erneut; ältere Fotos garantieren keine aktuelle Verfügbarkeit."],["Bestätigt ein Eintrag Echtheit oder Qualität?","Nein. Verkäuferbilder und Quellfotos sind Referenzen, keine Echtheitsprüfung oder Zusage zur Qualität eines späteren Artikels."]],"register":"Bei Hipobuy registrieren","view":"Details ansehen","original":"Quellseite prüfen","buy":"Bei Hipobuy öffnen","source":"Aktuelle Produktangebote","imageTitle":"Bildsuche","imageBody":"Die Bildsuche ist noch nicht verfügbar. Fotos können hier nicht hochgeladen und werden nicht gespeichert.","back":"Zurück zu Artikeln","noResults":"Keine passenden Einträge gefunden.","unavailable":"Die Quelle ist vorübergehend nicht erreichbar.","independent":"Unabhängiger Produktratgeber, nicht von Hipobuy betrieben. Prüfe die Produktdetails vor der Bestellung.","photoNote":"Bilder der Quellanzeige; keine gesonderten QC-Daten erkannt.","sourceNote":"Bilder, Varianten und Preis auf Quelle und Kaufseite prüfen.","page":"Seite","next":"Weiter","previous":"Zurück","sorting":"Sortierung","sortOptions":["Reihenfolge der Quelle","Preis aufsteigend","Preis absteigend"],"faqGroups":["Über diesen Katalog","Produkte finden und vergleichen","Fotos und Produktseiten","Preise, Links und Kauf"],"guideHeadings":["Eine Auswahl finden","Das genaue Angebot prüfen","Vor der Bestellung kontrollieren"]},"fr":{"nav":["Accueil","Tous les articles","Catégories","Recherche par image"],"eyebrow":"NOTES PRODUITS INDÉPENDANTES","title":"Hipobuy Spreadsheet","intro":"Explorez les produits par catégorie, comparez photos et prix, puis vérifiez le produit sur Hipobuy avant de commander.","search":"Rechercher des produits","searchButton":"Rechercher","categories":"Parcourir les catégories","latest":"Nouveautés de la source","browse":"Voir tous les articles","guideTitle":"De la trouvaille à la commande","guide":["Recherchez un mot-clé ou choisissez une des dix catégories. Dans le catalogue complet, triez par nouveautés, prix ou vues et ouvrez plusieurs produits pour les comparer. Vérifiez le titre, la couverture et le prix, sans décider uniquement sur une photo. Essayez moins de mots ou une autre orthographe si la recherche est trop précise.","Sur la fiche produit, examinez la galerie du vendeur et les photos de référence séparées. Consultez l’offre originale pour les tailles, couleurs, matières et variantes. Des photos similaires peuvent provenir de vendeurs différents. Ces références ne constituent pas l’inspection de votre commande ; demandez les détails manquants avant l’achat.","Ouvrez le lien Hipobuy disponible et vérifiez le produit, la taille et la couleur sélectionnés. Les conversions de devise sont indicatives : confirmez le prix actuel et les frais de livraison applicables sur Hipobuy. Avant l’expédition, examinez les photos d’inspection de votre commande. Gérez paiements et assistance depuis votre compte Hipobuy."],"faqTitle":"Questions fréquentes","faq":[["Puis-je télécharger un fichier spreadsheet ?","Il s’agit d’un catalogue en ligne avec catégories et fiches produits. Aucun fichier de tableur n’est proposé au téléchargement."],["Est-ce un spreadsheet officiel Hipobuy ?","Non. Ceci est un guide indépendant. Inscription et achat se font sur Hipobuy."],["D’où viennent les produits ?","Produits, catégories, images et prix proviennent directement d’un catalogue externe. Ce site ne possède pas de base de données produits distincte."],["Gérez-vous les commandes et le service après-vente ?","Ce site sert à consulter et comparer les offres. Il ne reçoit pas de paiements et ne gère ni commandes, inspections, colis ni remboursements. Pour une commande existante, contactez Hipobuy depuis votre compte avec son numéro."],["Comment trouver et comparer des produits ?","Cherchez des termes, choisissez une catégorie et utilisez les tris disponibles. Ouvrez chaque fiche pour comparer ses photos et sa source exacte."],["Puis-je chercher avec une photo ?","La recherche par image et l’envoi de photos ne sont pas disponibles. Utilisez les mots-clés et les catégories, puis vérifiez les fiches : deux images proches ne prouvent pas que les offres sont identiques."],["Pourquoi deux produits similaires ont-ils des fiches distinctes ?","Des titres ou couvertures proches peuvent appartenir à des vendeurs et variantes différents. Comparez les identifiants, les galeries et les liens source avant de les considérer comme la même offre."],["Que faire si la recherche ne donne aucun résultat ?","Essayez moins de mots ou une autre orthographe, puis consultez la catégorie. Le vendeur peut employer un autre titre. Si la source est indisponible, réessayez plus tard ; un résultat vide ne signifie pas que le produit est épuisé."],["D’où viennent les images du carrousel produit ?","Avec un identifiant Weidian valide, la galerie supérieure lit les images du vendeur correspondant. Les vignettes changent seulement l’aperçu, pas la variante commandée."],["Toutes les images sont-elles des photos QC ?","La galerie présente les images de la source. Nous ne les qualifions pas de QC sans indication explicite."],["Pourquoi une seule image ou aucune galerie vendeur ?","Le vendeur peut ne fournir qu’une photo, l’annonce peut être inaccessible ou son identifiant Weidian peut manquer. La page signale la cause connue sans dupliquer les photos QC."],["Où vérifier la taille et les matières ?","Consultez la fiche originale et la page Hipobuy pour le produit et la variante exacts. Vérifiez les mesures, matières et tableaux de tailles. Les photos ne suffisent pas à établir la coupe ou le tissu ; demandez les informations manquantes avant de commander."],["Prix et stock sont-ils garantis ?","Non. Confirmez le prix, la variante et le stock avant de payer."],["Que fait le lien d’achat Hipobuy ?","Un lien produit vérifié ouvre l’article correspondant sur Hipobuy avec le code d’invitation fourni. Vérifiez le titre, la variante et le prix actuel avant de commander."],["Que faire si le vendeur modifie ou retire le produit ?","Le vendeur peut changer prix, options et photos, ou retirer l’annonce. Vérifiez à nouveau la source et la page Hipobuy avant de commander ; une ancienne photo ne garantit rien."],["Une fiche certifie-t-elle l’authenticité ou la qualité ?","Non. Les images du vendeur et de la source sont des références, pas une authentification ni une promesse de qualité pour un futur article."]],"register":"S’inscrire sur Hipobuy","view":"Voir le détail","original":"Voir la source","buy":"Ouvrir sur Hipobuy","source":"Produits mis à jour","imageTitle":"Recherche par image","imageBody":"La recherche par image est indisponible. Le téléversement de photos est désactivé et aucune photo ne sera stockée ici.","back":"Retour aux articles","noResults":"Aucune annonce correspondante.","unavailable":"La source est temporairement indisponible.","independent":"Guide indépendant, non exploité par Hipobuy. Vérifiez les détails du produit avant de commander.","photoNote":"Photos de la source ; aucun dossier QC distinct identifié.","sourceNote":"Vérifiez images, variantes et prix à la source et sur la page d’achat.","page":"Page","next":"Suivant","previous":"Précédent","sorting":"Trier","sortOptions":["Ordre de la source","Prix croissant","Prix décroissant"],"faqGroups":["À propos de ce catalogue","Trouver et comparer","Photos et fiches produits","Prix, liens et achats"],"guideHeadings":["Créer une sélection","Vérifier l’offre exacte","Contrôler avant de commander"]},"es":{"nav":["Inicio","Todos los productos","Categorías","Búsqueda por imagen"],"eyebrow":"NOTAS DE PRODUCTOS INDEPENDIENTES","title":"Hipobuy Spreadsheet","intro":"Explora productos por categoría, compara fotos y precios, y verifica el artículo en Hipobuy antes de comprar.","search":"Buscar productos","searchButton":"Buscar","categories":"Explorar categorías","latest":"Novedades de la fuente","browse":"Ver todos los productos","guideTitle":"Del hallazgo al pedido","guide":["Busca una palabra clave o elige una de las diez categorías. En el catálogo completo, ordena por novedades, precio o visitas y abre varios artículos para compararlos. Comprueba título, portada y precio juntos. Si la búsqueda es demasiado específica, prueba menos palabras u otra ortografía.","En la página del producto, revisa la galería del vendedor y las fotos de referencia separadas. Consulta tallas, colores, materiales y variantes en la ficha original. Imágenes similares pueden pertenecer a vendedores distintos. Las referencias no son la inspección de tu pedido: pregunta por los detalles que falten antes de comprar.","Abre el enlace Hipobuy disponible y confirma producto, talla y color seleccionados. La conversión de moneda es aproximada; comprueba el precio actual y los gastos de envío aplicables en Hipobuy. Antes del envío, revisa las fotos de inspección de tu propio pedido. Gestiona pagos y atención desde tu cuenta Hipobuy."],"faqTitle":"Preguntas frecuentes","faq":[["¿Puedo descargar un archivo de hoja de cálculo?","Es un catálogo en línea con categorías y páginas de producto. No hay un archivo de hoja de cálculo para descargar."],["¿Es un spreadsheet oficial de Hipobuy?","No. Esta es una guía independiente. El registro y la compra se hacen en Hipobuy."],["¿De dónde salen los productos?","Productos, categorías, imágenes y precios se cargan desde un catálogo externo. Este sitio no mantiene una base de datos propia de productos."],["¿Gestionáis pedidos y atención al cliente?","Este sitio permite explorar y comparar ofertas. No acepta pagos ni gestiona compras, inspecciones de almacén, paquetes o reembolsos. Para un pedido existente, contacta con Hipobuy desde tu cuenta e indica el número de pedido."],["¿Cómo encuentro y comparo productos?","Busca términos, elige una categoría y usa los órdenes disponibles. Abre cada ficha para comparar las fotos y el anuncio original exacto."],["¿Puedo buscar subiendo una foto?","La búsqueda por imagen y la subida de fotos aún no están disponibles. Usa texto y categorías, luego revisa cada ficha; imágenes parecidas pueden pertenecer a ofertas distintas."],["¿Por qué hay productos parecidos en fichas separadas?","Títulos o portadas similares pueden proceder de vendedores y variantes diferentes. Compara IDs, galerías y enlaces originales antes de tratarlos como la misma oferta."],["¿Qué hago si la búsqueda no encuentra resultados?","Prueba menos palabras u otra ortografía y explora la categoría correspondiente. El vendedor puede utilizar otro título. Si la fuente no está disponible, vuelve más tarde; una búsqueda vacía no confirma que el producto esté agotado."],["¿De dónde salen las imágenes del carrusel?","Con un ID válido de Weidian, la galería superior muestra imágenes del vendedor de ese artículo. Las miniaturas solo cambian la vista; no seleccionan una variante para el pedido."],["¿Son todas las imágenes fotos QC?","La galería muestra imágenes de la fuente. No las llamamos QC sin una identificación explícita."],["¿Por qué solo hay una imagen o falta la galería?","El vendedor puede publicar una sola foto, el anuncio puede no estar disponible o faltar un ID válido de Weidian. La página explica la causa conocida sin repetir fotos QC."],["¿Dónde compruebo las tallas y los materiales?","Abre la ficha original y la página Hipobuy del producto y la variante exactos. Revisa medidas, materiales y tablas de tallas. Las fotos por sí solas no determinan el ajuste ni el tejido; pregunta por los datos que falten antes de comprar."],["¿Están garantizados el precio y las existencias?","No. Comprueba precio, variante y disponibilidad antes de pagar."],["¿Qué hace el enlace de compra de Hipobuy?","Un enlace verificado abre el producto correspondiente en Hipobuy con el código de invitación indicado. Comprueba título, opciones y precio actual antes de comprar."],["¿Qué pasa si el vendedor modifica o retira el producto?","Puede cambiar precio, opciones y fotos, o retirar el anuncio. Comprueba de nuevo la fuente y la página de Hipobuy antes de comprar; una foto anterior no garantiza disponibilidad."],["¿La ficha garantiza autenticidad o calidad?","No. Las fotos del vendedor y de origen son referencias, no una autenticación ni una garantía de calidad del futuro artículo."]],"register":"Registrarse en Hipobuy","view":"Ver detalles","original":"Ver página original","buy":"Abrir en Hipobuy","source":"Productos actualizados","imageTitle":"Búsqueda por imagen","imageBody":"La búsqueda por imagen aún no está disponible. No se pueden subir fotos y aquí no se almacena ninguna.","back":"Volver a los productos","noResults":"No se encontraron anuncios.","unavailable":"La fuente no está disponible temporalmente.","independent":"Guía independiente, no administrada por Hipobuy. Comprueba los detalles antes de comprar.","photoNote":"Imágenes del anuncio original; no se identificaron registros QC independientes.","sourceNote":"Verifica imágenes, variantes y precio en la fuente y en la página de compra.","page":"Página","next":"Siguiente","previous":"Anterior","sorting":"Ordenar","sortOptions":["Orden de la fuente","Precio ascendente","Precio descendente"],"faqGroups":["Sobre este catálogo","Encontrar y comparar productos","Fotos y fichas de producto","Precios, enlaces y compras"],"guideHeadings":["Crea una selección","Comprueba la oferta exacta","Revisa antes de comprar"]},"it":{"nav":["Home","Tutti i prodotti","Categorie","Ricerca per immagine"],"eyebrow":"NOTE INDIPENDENTI SUI PRODOTTI","title":"Hipobuy Spreadsheet","intro":"Esplora i prodotti per categoria, confronta foto e prezzi e verifica il prodotto su Hipobuy prima di ordinare.","search":"Cerca prodotti","searchButton":"Cerca","categories":"Esplora le categorie","latest":"Novità dalla fonte","browse":"Vedi tutti i prodotti","guideTitle":"Dalla scoperta all’ordine","guide":["Cerca una parola chiave o scegli una delle dieci categorie. Nel catalogo completo puoi ordinare per novità, prezzo o visualizzazioni e aprire più prodotti da confrontare. Valuta insieme titolo, copertina e prezzo. Se la ricerca è troppo precisa, prova meno parole o una grafia diversa.","Nella pagina prodotto guarda la galleria del venditore e le foto di riferimento separate. Controlla taglie, colori, materiali e varianti nella scheda originale. Foto simili possono appartenere a venditori diversi. I riferimenti non sono il controllo di magazzino del tuo ordine: chiedi i dettagli mancanti prima di acquistare.","Apri il link Hipobuy disponibile e verifica prodotto, taglia e colore scelti. La conversione valutaria è indicativa: controlla prezzo attuale e spese di spedizione applicabili su Hipobuy. Prima della spedizione, esamina le foto di controllo del tuo ordine. Gestisci pagamenti, domande e assistenza dal tuo account Hipobuy."],"faqTitle":"Domande frequenti","faq":[["Posso scaricare un file spreadsheet?","Questo è un catalogo online con categorie e pagine prodotto. Non è disponibile un file di foglio di calcolo da scaricare."],["È uno spreadsheet ufficiale Hipobuy?","No. Questa è una guida indipendente. Registrazione e acquisto avvengono su Hipobuy."],["Da dove arrivano i prodotti?","Prodotti, categorie, immagini e prezzi sono caricati da un catalogo esterno. Questo sito non gestisce un database prodotti separato."],["Gestite ordini e assistenza clienti?","Questo sito serve a consultare e confrontare offerte. Non accetta pagamenti e non gestisce acquisti, controlli di magazzino, pacchi o rimborsi. Per un ordine esistente, contatta Hipobuy dal tuo account indicando il numero di ordine."],["Come trovo e confronto i prodotti?","Cerca per termini, scegli una categoria e usa gli ordinamenti disponibili. Apri ogni scheda per confrontare foto e inserzione originale."],["Posso cercare caricando una foto?","La ricerca per immagini e il caricamento di foto non sono ancora disponibili. Usa la ricerca testuale e le categorie, poi controlla ogni scheda: foto simili possono riferirsi a offerte diverse."],["Perché prodotti simili compaiono separatamente?","Titoli o copertine simili possono appartenere a venditori o varianti differenti. Confronta ID, gallerie e link originali prima di considerare identiche due offerte."],["Cosa fare se una ricerca non trova risultati?","Prova meno parole o una grafia diversa, poi esplora la categoria. Il venditore potrebbe usare un altro titolo. Se la fonte non è disponibile, riprova più tardi: una ricerca vuota non conferma che il prodotto sia esaurito."],["Da dove vengono le immagini del carosello?","Con un ID Weidian valido, la galleria superiore mostra le immagini del venditore per quell’articolo. Le miniature cambiano solo l’anteprima, non la variante ordinata."],["Tutte le immagini sono foto QC?","La galleria mostra immagini della fonte. Non le chiamiamo QC senza indicazione esplicita."],["Perché c’è una sola immagine o manca la galleria?","Il venditore potrebbe offrire una sola foto, l’annuncio non essere disponibile o mancare un ID Weidian valido. La pagina indica la causa nota senza duplicare foto QC."],["Dove verifico taglia e materiali?","Apri la scheda originale e la pagina Hipobuy del prodotto e della variante esatti. Cerca misure, materiali e tabelle taglie. Le sole foto non dimostrano vestibilità o tessuto; chiedi i dettagli mancanti prima di ordinare."],["Prezzi e disponibilità sono garantiti?","No. Controlla prezzo, variante e scorte prima di pagare."],["Cosa apre il link di acquisto Hipobuy?","Un link verificato apre il prodotto corrispondente su Hipobuy con il codice invito fornito. Controlla titolo, varianti e prezzo attuale prima di ordinare."],["E se il venditore modifica o rimuove il prodotto?","Prezzi, opzioni e foto possono cambiare o l’annuncio può sparire. Ricontrolla fonte e pagina Hipobuy prima dell’acquisto; una foto precedente non garantisce la disponibilità."],["La scheda certifica autenticità o qualità?","No. Le immagini del venditore e della fonte sono riferimenti, non una verifica di autenticità o una promessa di qualità del futuro articolo."]],"register":"Registrati su Hipobuy","view":"Vedi dettagli","original":"Controlla la fonte","buy":"Apri su Hipobuy","source":"Prodotti aggiornati","imageTitle":"Ricerca per immagine","imageBody":"La ricerca per immagine non è ancora disponibile. Il caricamento delle foto è disattivato e qui non vengono salvate immagini.","back":"Torna ai prodotti","noResults":"Nessun annuncio corrispondente.","unavailable":"La fonte non è temporaneamente disponibile.","independent":"Guida indipendente, non gestita da Hipobuy. Verifica i dettagli prima di ordinare.","photoNote":"Foto della fonte; nessun record QC distinto identificato.","sourceNote":"Controlla immagini, varianti e prezzo sulla fonte e sulla pagina di acquisto.","page":"Pagina","next":"Successiva","previous":"Precedente","sorting":"Ordina","sortOptions":["Ordine della fonte","Prezzo crescente","Prezzo decrescente"],"faqGroups":["Informazioni sul catalogo","Trovare e confrontare prodotti","Foto e schede prodotto","Prezzi, link e acquisti"],"guideHeadings":["Crea una selezione","Controlla l’offerta esatta","Verifica prima di ordinare"]},"pt":{"nav":["Início","Todos os produtos","Categorias","Pesquisa por imagem"],"eyebrow":"NOTAS INDEPENDENTES DE PRODUTOS","title":"Hipobuy Spreadsheet","intro":"Explore produtos por categoria, compare fotos e preços e confirme o artigo na Hipobuy antes de comprar.","search":"Pesquisar produtos","searchButton":"Pesquisar","categories":"Explorar categorias","latest":"Novidades da origem","browse":"Ver todos os produtos","guideTitle":"Da descoberta à encomenda","guide":["Pesquise uma palavra-chave ou escolha uma das dez categorias. No catálogo completo, ordene por novidades, preço ou visualizações e abra vários artigos para comparar. Confira o título, a imagem e o preço em conjunto. Se a pesquisa for demasiado específica, tente menos palavras ou outra grafia.","Na página do produto, veja a galeria do vendedor e as fotos de referência separadas. Consulte tamanhos, cores, materiais e variantes no anúncio original. Fotos semelhantes podem pertencer a vendedores diferentes. As referências não são a inspeção da sua encomenda; peça os detalhes em falta antes de comprar.","Abra o link Hipobuy disponível e confirme artigo, tamanho e cor. A conversão monetária é aproximada: verifique o preço atual e os portes aplicáveis na Hipobuy. Antes do envio, examine as fotos de inspeção da sua própria encomenda. Trate de pagamentos, dúvidas e apoio através da sua conta Hipobuy."],"faqTitle":"Perguntas frequentes","faq":[["Posso descarregar um ficheiro de spreadsheet?","Este é um catálogo online com categorias e páginas de produto. Não existe um ficheiro de folha de cálculo para descarregar."],["Este é um spreadsheet oficial da Hipobuy?","Não. Este é um guia independente. O registo e a compra ocorrem na Hipobuy."],["De onde vêm os produtos?","Produtos, categorias, imagens e preços são carregados de um catálogo externo. Este site não mantém uma base de dados própria de produtos."],["Tratam de encomendas e apoio ao cliente?","Este site serve para consultar e comparar ofertas. Não recebe pagamentos nem gere compras, inspeções de armazém, pacotes ou reembolsos. Para uma encomenda existente, contacte a Hipobuy através da sua conta e indique o número da encomenda."],["Como encontro e comparo produtos?","Pesquise termos, escolha uma categoria e use as opções de ordenação disponíveis. Abra cada página para comparar fotografias e a oferta original."],["Posso pesquisar com uma fotografia?","A pesquisa por imagem e o envio de fotos ainda não estão disponíveis. Use a pesquisa por texto e as categorias, depois confira cada página; imagens semelhantes podem ser de ofertas diferentes."],["Porque aparecem separadas ofertas semelhantes?","Títulos ou capas parecidos podem pertencer a vendedores e variantes distintos. Compare IDs, galerias e links de origem antes de assumir que são a mesma oferta."],["O que fazer quando a pesquisa não tem resultados?","Experimente menos palavras ou outra grafia e consulte a categoria. O vendedor pode usar outro título. Se a fonte estiver indisponível, tente mais tarde; uma pesquisa vazia não confirma falta de stock."],["De onde vêm as imagens do carrossel?","Com um ID Weidian válido, a galeria superior mostra imagens do vendedor desse artigo. As miniaturas só alteram a pré-visualização, não a variante encomendada."],["Todas as imagens são fotos QC?","A galeria mostra imagens da origem. Sem identificação explícita, não as chamamos QC."],["Porque há só uma imagem ou não há galeria?","O vendedor pode ter uma só foto, o anúncio pode estar indisponível ou faltar um ID Weidian válido. A página indica a causa conhecida sem duplicar fotos QC."],["Onde verifico tamanhos e materiais?","Abra o anúncio original e a página Hipobuy do produto e da variante exatos. Consulte medidas, materiais e tabelas de tamanhos. As fotos não comprovam o ajuste nem o tecido; peça os detalhes em falta antes de encomendar."],["Preço e disponibilidade são garantidos?","Não. Confirme preço, variante e stock antes do pagamento."],["O que abre o link de compra Hipobuy?","Um link verificado abre o artigo correspondente na Hipobuy com o código de convite fornecido. Confirme título, opções e preço atual antes de comprar."],["E se o vendedor alterar ou remover o produto?","O vendedor pode mudar preço, opções e fotos, ou retirar a oferta. Volte a confirmar origem e página Hipobuy antes da compra; uma foto antiga não garante disponibilidade."],["A listagem certifica autenticidade ou qualidade?","Não. Imagens do vendedor e da origem são referências, não autenticação nem promessa de qualidade de um artigo futuro."]],"register":"Registar na Hipobuy","view":"Ver detalhes","original":"Ver página de origem","buy":"Abrir na Hipobuy","source":"Produtos atualizados","imageTitle":"Pesquisa por imagem","imageBody":"A pesquisa por imagem ainda não está disponível. O envio de fotos está desativado e nenhuma foto é guardada aqui.","back":"Voltar aos produtos","noResults":"Nenhum anúncio encontrado.","unavailable":"A origem está temporariamente indisponível.","independent":"Guia independente, não operado pela Hipobuy. Confirme os detalhes antes de encomendar.","photoNote":"Imagens da origem; nenhum registo QC separado identificado.","sourceNote":"Confirme imagens, variantes e preço na origem e na página de compra.","page":"Página","next":"Seguinte","previous":"Anterior","sorting":"Ordenar","sortOptions":["Ordem da origem","Preço crescente","Preço decrescente"],"faqGroups":["Sobre este catálogo","Encontrar e comparar produtos","Fotos e páginas de produto","Preços, links e compras"],"guideHeadings":["Faça uma seleção","Confira a oferta exata","Reveja antes de encomendar"]},"pl":{"nav":["Strona główna","Wszystkie produkty","Kategorie","Wyszukiwanie obrazem"],"eyebrow":"NIEZALEŻNY KATALOG PRODUKTÓW","title":"Hipobuy Spreadsheet","intro":"Przeglądaj produkty według kategorii, porównuj zdjęcia i ceny, a przed zamówieniem sprawdź ofertę na Hipobuy.","search":"Szukaj produktów","searchButton":"Szukaj","categories":"Przeglądaj kategorie","latest":"Polecane produkty","browse":"Zobacz wszystkie produkty","guideTitle":"Od znalezienia produktu do zamówienia","guide":["Wpisz słowo kluczowe lub wybierz jedną z dziesięciu kategorii. W pełnym katalogu sortuj według nowości, ceny lub wyświetleń i otwórz kilka ofert do porównania. Sprawdź tytuł, zdjęcie i cenę razem. Jeśli wyszukiwanie jest zbyt wąskie, użyj mniej słów lub innej pisowni.","Na stronie produktu sprawdź galerię sprzedawcy i osobne zdjęcia poglądowe. W oryginalnej ofercie porównaj rozmiary, kolory, materiały i warianty. Podobne zdjęcia mogą pochodzić od różnych sprzedawców. Nie są kontrolą magazynową twojego zamówienia; przed zakupem zapytaj o brakujące szczegóły.","Otwórz dostępny link Hipobuy i sprawdź produkt, wybrany rozmiar oraz kolor. Przeliczenia walut są orientacyjne; potwierdź aktualną cenę i odpowiednie koszty wysyłki na Hipobuy. Przed wysyłką obejrzyj zdjęcia kontroli własnego zamówienia. Płatności i pomoc obsługuj przez swoje konto Hipobuy."],"faqTitle":"Często zadawane pytania","faq":[["Czy mogę pobrać plik arkusza kalkulacyjnego?","To katalog online z kategoriami i osobnymi stronami produktów. Nie ma pliku do pobrania."],["Czy to oficjalny arkusz Hipobuy?","Nie. To niezależny katalog produktów. Rejestracja i zakupy odbywają się na stronie Hipobuy."],["Skąd pochodzą produkty?","Produkty, kategorie, zdjęcia i ceny są pobierane z zewnętrznego katalogu. Ta strona nie ma własnej bazy produktów."],["Czy obsługujecie zamówienia i reklamacje?","Ta strona służy do przeglądania i porównywania ofert. Nie przyjmuje płatności ani nie zarządza zakupami, kontrolą magazynową, paczkami czy zwrotami. W sprawie zamówienia skontaktuj się z Hipobuy ze swojego konta i podaj numer zamówienia."],["Jak znaleźć i porównać produkty?","Wpisz hasło, wybierz kategorię i użyj dostępnego sortowania. Otwórz każdą stronę produktu, by porównać zdjęcia i oryginalną ofertę."],["Czy mogę szukać przez przesłanie zdjęcia?","Wyszukiwanie obrazem i przesyłanie zdjęć nie są jeszcze dostępne. Użyj wyszukiwania tekstowego i kategorii, a następnie sprawdź każdą ofertę; podobne zdjęcia nie oznaczają tego samego produktu."],["Dlaczego podobne produkty mają osobne wpisy?","Podobne tytuły lub okładki mogą dotyczyć innych sprzedawców i wariantów. Porównaj identyfikatory, galerie i linki źródłowe przed uznaniem ofert za identyczne."],["Co zrobić, gdy wyszukiwanie nie daje wyników?","Spróbuj mniej słów lub innej pisowni, a potem przejrzyj kategorię. Sprzedawca może używać innego tytułu. Jeśli źródło jest niedostępne, spróbuj później; brak wyników nie oznacza potwierdzonego braku towaru."],["Skąd pochodzą zdjęcia w karuzeli?","Gdy produkt ma poprawny identyfikator Weidian, górna galeria pokazuje zdjęcia sprzedawcy tego artykułu. Miniatury zmieniają tylko podgląd, a nie wariant zamówienia."],["Czy wszystkie zdjęcia są zdjęciami QC?","Galeria pokazuje obrazy pochodzące ze źródła. Bez wyraźnego oznaczenia nie nazywamy ich zdjęciami QC."],["Dlaczego produkt ma tylko jedno zdjęcie lub nie ma galerii?","Sprzedawca mógł dodać tylko jedno zdjęcie, oferta może być niedostępna albo brakuje poprawnego identyfikatora Weidian. Strona wskazuje znaną przyczynę i nie powiela zdjęć QC."],["Gdzie sprawdzić rozmiary i materiały?","Otwórz oryginalną ofertę oraz stronę Hipobuy dla dokładnego produktu i wariantu. Sprawdź wymiary, opis materiału i tabelę rozmiarów. Same zdjęcia nie potwierdzają dopasowania ani tkaniny; przed zakupem zapytaj o brakujące informacje."],["Czy ceny i dostępność są gwarantowane?","Nie. Sprzedawca może zmienić ofertę. Przed zapłatą sprawdź aktualną cenę, wariant i dostępność."],["Co robi link zakupu Hipobuy?","Zweryfikowany link otwiera właściwy produkt na Hipobuy z podanym kodem zaproszenia. Przed zakupem sprawdź tytuł, wariant i aktualną cenę."],["Co jeśli sprzedawca zmieni lub usunie produkt?","Cena, warianty i zdjęcia mogą się zmienić albo oferta może zniknąć. Przed zakupem sprawdź ponownie źródło i Hipobuy; stare zdjęcie nie gwarantuje dostępności."],["Czy wpis potwierdza autentyczność lub jakość?","Nie. Zdjęcia sprzedawcy i strony źródłowej są materiałem poglądowym, a nie potwierdzeniem autentyczności czy przyszłej jakości."]],"register":"Zarejestruj się w Hipobuy","view":"Zobacz szczegóły","original":"Sprawdź stronę źródłową","buy":"Otwórz w Hipobuy","source":"Aktualna lista produktów","imageTitle":"Wyszukiwanie obrazem","imageBody":"Wyszukiwanie obrazem nie jest jeszcze dostępne. Przesyłanie zdjęć jest wyłączone; zdjęcia nie są tu przechowywane.","back":"Wróć do produktów","noResults":"Nie znaleziono pasujących produktów.","unavailable":"Źródło jest chwilowo niedostępne. Spróbuj ponownie później.","independent":"Niezależny katalog produktów, nieprowadzony przez Hipobuy. Przed zakupem sprawdź szczegóły oferty.","photoNote":"Zdjęcia ze strony źródłowej; nie znaleziono oddzielnych zapisów QC.","sourceNote":"Sprawdź zdjęcia, warianty i cenę na stronie źródłowej oraz na stronie zakupu.","page":"Strona","next":"Następna","previous":"Poprzednia","sorting":"Sortuj","sortOptions":["Kolejność źródłowa","Cena rosnąco","Cena malejąco"],"faqGroups":["O katalogu","Wyszukiwanie i porównywanie","Zdjęcia i strony produktów","Ceny, linki i zakupy"],"guideHeadings":["Wybierz produkty do porównania","Sprawdź dokładną ofertę","Sprawdź przed zamówieniem"]},"da":{"nav":["Forside","Alle varer","Kategorier","Billedsøgning"],"eyebrow":"UAFHÆNGIG PRODUKTOVERSIGT","title":"Hipobuy Spreadsheet","intro":"Gennemse varer efter kategori, sammenlign billeder og priser, og kontrollér varen på Hipobuy før bestilling.","search":"Søg efter varer","searchButton":"Søg","categories":"Gennemse kategorier","latest":"Udvalgte varer","browse":"Se alle varer","guideTitle":"Fra fund til informeret bestilling","guide":["Søg med et produktord eller vælg en af de ti kategorier. I hele kataloget kan du sortere efter nyeste, pris eller visninger og åbne flere varer til sammenligning. Kontrollér titel, billede og pris sammen. Prøv færre ord eller en anden stavemåde, hvis søgningen er for snæver.","Se sælgerens galleri og de separate referencebilleder på produktsiden. Kontrollér størrelser, farver, materialer og varianter i den oprindelige annonce. Lignende billeder kan komme fra forskellige sælgere. Referencerne er ikke lagerkontrol af din ordre; spørg om manglende detaljer før køb.","Åbn det tilgængelige Hipobuy-link og bekræft varen, størrelsen og farven. Valutaomregningen er vejledende; kontrollér aktuel pris og relevante fragtomkostninger hos Hipobuy. Gennemgå din egen ordres kontrolbilleder før afsendelse. Håndtér betaling, spørgsmål og kundeservice via din Hipobuy-konto."],"faqTitle":"Ofte stillede spørgsmål","faq":[["Kan jeg hente et regneark?","Dette er et online katalog med kategorier og produktsider, ikke en fil til download. Åbn hver vare for at se dens oplysninger og kildelink."],["Er siden en officiel Hipobuy-side?","Nej. Det er en uafhængig vareoversigt, mens registrering og køb foregår hos Hipobuy. Et link her er ikke en godkendelse af sælgeren."],["Hvor kommer varerne og kategorierne fra?","Varer, ti kategorier, billeder og priser hentes fra et eksternt katalog. Siden har ikke sin egen produktdatabase; kildesiden kan kontrolleres på hver vare."],["Håndterer I ordrer og kundeservice?","Siden bruges til at gennemse og sammenligne varer. Den modtager ikke betalinger eller håndterer køb, lagerkontrol, pakker eller refunderinger. Kontakt Hipobuy via din konto med ordrenummeret ved spørgsmål om en eksisterende ordre."],["Hvordan finder og sammenligner jeg varer?","Brug tekstsøgning, kategori og de understøttede sorteringer. Åbn hver produktside og sammenlign sælgerbilleder, kildebilleder og links; der er ikke et mærkefilter."],["Kan jeg søge ved at uploade et billede?","Billedsøgning og upload er endnu ikke tilgængelige. Søg med ord eller kategorier, og kontrollér resultaterne; lignende billeder kan tilhøre forskellige sælgere."],["Hvorfor vises lignende varer hver for sig?","Ens titler og omslagsbilleder kan komme fra forskellige sælgere eller varianter. Sammenlign vare-id, galleri og kildelink, før du betragter dem som samme tilbud."],["Hvad gør jeg, hvis søgningen ikke giver resultater?","Prøv færre ord eller en anden stavemåde, og se den relevante kategori. Sælgeren kan bruge en anden titel. Prøv senere, hvis kilden er utilgængelig; ingen resultater bekræfter ikke, at varen er udsolgt."],["Hvor kommer billederne i den øverste karrusel fra?","Med et gyldigt Weidian-id vises sælgerens billeder af netop den vare og eventuelle variantbilleder. Miniaturer ændrer kun visningen, ikke den variant du bestiller."],["Er billederne under varen bekræftede QC-fotos?","Ikke nødvendigvis. De nederste billeder er referencefotos fra den tilsvarende kildeside, som ikke mærker hvert lager-QC-foto. De øverste billeder er sælgerens præsentation."],["Hvorfor har en vare kun ét billede eller intet galleri?","Sælgeren kan have lagt ét billede op, Weidian-id kan mangle, eller siden kan være utilgængelig. Vi gentager ikke referencefotos for at skabe en falsk karrusel."],["Hvor kontrollerer jeg størrelse og materiale?","Åbn den oprindelige sælgerside og Hipobuy-siden for den præcise vare og variant. Se efter mål, materialebeskrivelser og størrelsestabeller. Billeder alene viser ikke pasform eller stof; spørg om manglende oplysninger før køb."],["Er pris eller lagerstatus garanteret?","Nej. Den viste pris kommer fra kilden, og valutavisningen er en omtrentlig omregning. Bekræft variant, lagerstatus og slutpris hos Hipobuy før betaling."],["Hvordan virker Hipobuy-købslinket?","Med et gyldigt Weidian-id åbner knappen den tilsvarende vare hos Hipobuy med invitationskoden. Denne side gennemfører ikke en bestilling; tjek oplysningerne dér."],["Hvad hvis sælgeren ændrer eller fjerner varen?","Pris, varianter og fotos kan ændres, eller tilbuddet kan forsvinde. Kontrollér kildesiden og Hipobuy igen før køb; ældre billeder er ingen lagergaranti."],["Bekræfter en vare ægthed eller kvalitet?","Nej. Billeder og links er referencer, ikke autentificering eller kvalitetstest. Sammenlign den præcise vare og beslut selv på købssiden."]],"register":"Opret konto hos Hipobuy","view":"Se detaljer","original":"Se kildesiden","buy":"Åbn hos Hipobuy","source":"Opdaterede varer","imageTitle":"Billedsøgning","imageBody":"Billedsøgning er endnu ikke tilgængelig. Billeder kan ikke uploades eller gemmes her.","back":"Tilbage til varer","noResults":"Ingen matchende varer fundet.","unavailable":"Kilden er midlertidigt utilgængelig. Prøv igen senere.","independent":"Uafhængig produktoversigt, ikke drevet af Hipobuy. Kontrollér detaljer før bestilling.","photoNote":"Billeder fra kilden; ingen særskilt QC-registrering fundet.","sourceNote":"Kontrollér billeder, varianter og pris hos kilden og på købssiden.","page":"Side","next":"Næste","previous":"Forrige","sorting":"Sortér","sortOptions":["Kildens rækkefølge","Pris: lav til høj","Pris: høj til lav"],"faqGroups":["Om kataloget","Find og sammenlign varer","Billeder og produktsider","Priser, links og køb"],"guideHeadings":["Find varer til sammenligning","Kontrollér den præcise vare","Gennemgå før bestilling"]},"no":{"nav":["Forside","Alle varer","Kategorier","Bildesøk"],"eyebrow":"UAVHENGIG PRODUKTOVERSIKT","title":"Hipobuy Spreadsheet","intro":"Se varer etter kategori, sammenlign bilder og priser, og kontroller varen på Hipobuy før bestilling.","search":"Søk etter varer","searchButton":"Søk","categories":"Se kategorier","latest":"Utvalgte varer","browse":"Se alle varer","guideTitle":"Fra funn til informert bestilling","guide":["Søk med et produktord eller velg en av de ti kategoriene. I hele katalogen kan du sortere etter nyeste, pris eller visninger og åpne flere varer for sammenligning. Sjekk tittel, bilde og pris sammen. Prøv færre ord eller en annen skrivemåte når søket blir for snevert.","Se selgergalleriet og de separate referansebildene på produktsiden. Sjekk størrelser, farger, materialer og varianter i originalannonsen. Lignende bilder kan komme fra forskjellige selgere. Referanser er ikke lagerkontroll av bestillingen din; spør om manglende opplysninger før kjøp.","Åpne tilgjengelig Hipobuy-lenke og bekreft vare, størrelse og farge. Valutaomregningen er omtrentlig; sjekk gjeldende pris og aktuelle fraktkostnader på Hipobuy. Se kontrollbildene for din egen bestilling før sending. Håndter betaling, spørsmål og kundeservice fra Hipobuy-kontoen din."],"faqTitle":"Vanlige spørsmål","faq":[["Kan jeg laste ned et regneark?","Dette er en nettbasert katalog med kategorier og produktsider, ikke en fil til nedlasting. Åpne hver vare for å se detaljer og kilde."],["Er dette et offisielt Hipobuy-nettsted?","Nei. Dette er en uavhengig oversikt; registrering og kjøp skjer på Hipobuy. En oppføring her innebærer ikke at selgeren er godkjent."],["Hvor kommer varer og kategorier fra?","Varer, ti kategorier, bilder og priser hentes fra en ekstern katalog. Nettstedet har ingen egen produktdatabase; kildesiden kan sjekkes per vare."],["Håndterer dere bestillinger og kundeservice?","Siden brukes til å se og sammenligne varer. Den mottar ikke betalinger eller håndterer kjøp, lagerkontroll, pakker eller refusjoner. Kontakt Hipobuy fra kontoen din med ordrenummeret ved spørsmål om en eksisterende bestilling."],["Hvordan finner og sammenligner jeg varer?","Bruk tekstsøk, kategori og tilgjengelig sortering. Åpne produktsidene og sammenlign selgerbilder, kildebilder og lenker; merkefilter finnes ikke."],["Kan jeg søke ved å laste opp et bilde?","Bildesøk og bildeopplasting er ikke tilgjengelig ennå. Søk med ord og kategorier, og sjekk treffene; like bilder kan tilhøre ulike selgere."],["Hvorfor vises lignende varer som egne oppføringer?","Like titler eller omslagsbilder kan komme fra forskjellige selgere og varianter. Sammenlign vare-ID, galleri og kildelenke før du antar at tilbudene er like."],["Hva gjør jeg når søket ikke gir resultater?","Prøv færre ord eller en annen skrivemåte, og se den aktuelle kategorien. Selgeren kan bruke en annen tittel. Prøv senere hvis kilden er utilgjengelig; ingen resultater bekrefter ikke at varen er utsolgt."],["Hvor kommer bildene i karusellen fra?","Med gyldig Weidian-ID viser den øverste karusellen bilder fra selgeren av akkurat denne varen, eventuelt variantbilder. Miniatyrer endrer bare forhåndsvisningen."],["Er bildene under varen bekreftede QC-bilder?","Ikke nødvendigvis. De nederste er referansebilder fra tilsvarende kildeside, som ikke merker hvert lager-QC-bilde. Øverst vises selgerens presentasjonsbilder."],["Hvorfor har en vare bare ett bilde eller ingen karusell?","Selgeren kan ha lagt ut ett bilde, Weidian-ID kan mangle eller siden kan være utilgjengelig. Kildebilder gjentas ikke for å lage en falsk karusell."],["Hvor sjekker jeg størrelse og materiale?","Åpne den opprinnelige selgersiden og Hipobuy-siden for nøyaktig vare og variant. Se etter mål, materialbeskrivelser og størrelsestabeller. Bilder alene fastslår ikke passform eller stoff; spør om manglende detaljer før bestilling."],["Er pris og lagerstatus garantert?","Nei. Kildeprisen kan endres, og valutaomregningen er omtrentelig. Bekreft variant, lagerstatus og sluttpris på Hipobuy før du betaler."],["Hvordan fungerer Hipobuy-kjøpslenken?","Med gyldig Weidian-ID åpner knappen riktig vare på Hipobuy med invitasjonskoden. Dette nettstedet legger ikke inn en bestilling; sjekk detaljene der."],["Hva om selgeren endrer eller fjerner varen?","Pris, varianter og bilder kan endres, eller tilbudet kan forsvinne. Sjekk kilden og Hipobuy igjen før kjøp; gamle bilder garanterer ikke lagerstatus."],["Bekrefter oppføringen ekthet eller kvalitet?","Nei. Bilder og lenker er referanser, ikke autentisering eller kvalitetstesting. Vurder den konkrete varen før du bestemmer deg på kjøpssiden."]],"register":"Registrer deg på Hipobuy","view":"Se detaljer","original":"Sjekk kildesiden","buy":"Åpne på Hipobuy","source":"Oppdaterte varer","imageTitle":"Bildesøk","imageBody":"Bildesøk er ikke tilgjengelig ennå. Bilder kan ikke lastes opp eller lagres her.","back":"Tilbake til varer","noResults":"Ingen varer funnet.","unavailable":"Kilden er midlertidig utilgjengelig. Prøv igjen senere.","independent":"Uavhengig produktoversikt, ikke drevet av Hipobuy. Kontroller detaljene før kjøp.","photoNote":"Bilder fra kilden; ingen separat QC-registrering funnet.","sourceNote":"Kontroller bilder, varianter og pris hos kilden og på kjøpssiden.","page":"Side","next":"Neste","previous":"Forrige","sorting":"Sorter","sortOptions":["Kildens rekkefølge","Pris: lav til høy","Pris: høy til lav"],"faqGroups":["Om katalogen","Finn og sammenlign varer","Bilder og produktsider","Priser, lenker og kjøp"],"guideHeadings":["Finn varer å sammenligne","Kontroller den nøyaktige varen","Gå gjennom før bestilling"]},"sv":{"nav":["Start","Alla varor","Kategorier","Bildsökning"],"eyebrow":"OBEROENDE PRODUKTÖVERSIKT","title":"Hipobuy Spreadsheet","intro":"Bläddra efter kategori, jämför bilder och priser och kontrollera varan på Hipobuy före beställning.","search":"Sök produkter","searchButton":"Sök","categories":"Bläddra bland kategorier","latest":"Utvalda varor","browse":"Visa alla varor","guideTitle":"Från fynd till genomtänkt beställning","guide":["Sök med ett produktord eller välj en av de tio kategorierna. I hela katalogen kan du sortera efter nyaste, pris eller visningar och öppna flera varor att jämföra. Kontrollera titel, bild och pris tillsammans. Prova färre ord eller annan stavning om sökningen blir för snäv.","Se säljarens galleri och de separata referensbilderna på produktsidan. Kontrollera storlekar, färger, material och varianter i originalannonsen. Liknande bilder kan komma från olika säljare. Referenser är inte lagerkontroll av din beställning; fråga om saknade uppgifter före köp.","Öppna tillgänglig Hipobuy-länk och bekräfta varan, storleken och färgen. Valutaomräkningen är ungefärlig; kontrollera aktuellt pris och tillämplig frakt hos Hipobuy. Granska kontrollbilderna för din egen beställning före leverans. Hantera betalning, frågor och support från ditt Hipobuy-konto."],"faqTitle":"Vanliga frågor","faq":[["Kan jag ladda ned en kalkylbladsfil?","Det här är en webbkatalog med kategorier och produktsidor, ingen fil för nedladdning. Öppna varje vara för att se information och källänk."],["Är detta Hipobuys officiella webbplats?","Nej. Det är en oberoende översikt; registrering och köp görs på Hipobuy. En produkt här betyder inte att säljaren är godkänd."],["Varifrån kommer varor och kategorier?","Varor, tio kategorier, bilder och priser hämtas från en extern katalog. Webbplatsen har ingen egen produktdatabas; varje källa kan kontrolleras."],["Hanterar ni beställningar och kundservice?","Sidan används för att bläddra och jämföra erbjudanden. Den tar inte emot betalningar och hanterar inte köp, lagerkontroller, paket eller återbetalningar. Kontakta Hipobuy från ditt konto med ordernumret för frågor om en befintlig beställning."],["Hur hittar och jämför jag varor?","Använd textsökning, kategori och tillgänglig sortering. Öppna sidorna och jämför säljarbilder, källbilder och länkar; något varumärkesfilter finns inte."],["Kan jag söka genom att ladda upp en bild?","Bildsökning och bilduppladdning finns inte ännu. Sök med ord eller kategorier och kontrollera träffarna; liknande bilder kan komma från olika säljare."],["Varför finns liknande varor som separata poster?","Liknande titlar eller omslag kan tillhöra olika säljare och varianter. Jämför produkt-ID, galleri och källänk innan du behandlar dem som samma erbjudande."],["Vad gör jag om sökningen inte ger resultat?","Prova färre ord eller en annan stavning och bläddra i rätt kategori. Säljaren kan använda en annan titel. Försök senare om källan är otillgänglig; inga resultat bekräftar inte att varan är slutsåld."],["Varifrån kommer bilderna i karusellen?","Med giltigt Weidian-ID visar den övre karusellen bilder för just den säljarvaran och eventuella variantbilder. Miniatyrerna ändrar bara förhandsvisningen."],["Är bilderna under produkten bekräftade QC-bilder?","Inte nödvändigtvis. De nedre bilderna är referensbilder från motsvarande källsida, som inte märker varje lager-QC-bild. Överst finns säljarens presentationsbilder."],["Varför har en vara bara en bild eller inget galleri?","Säljaren kan ha publicerat en bild, Weidian-ID kan saknas eller sidan vara otillgänglig. Referensbilder dupliceras inte för att skapa en falsk karusell."],["Var kontrollerar jag storlek och material?","Öppna säljarens originalannons och Hipobuy-sidan för exakt vara och variant. Kontrollera mått, materialbeskrivningar och storlekstabeller. Bilder ensamma fastställer inte passform eller tyg; fråga om saknade uppgifter före köp."],["Är pris och lagerstatus garanterade?","Nej. Källpriset kan ändras, och valutaomräkningen är ungefärlig. Bekräfta variant, lagerstatus och slutpris på Hipobuy före betalning."],["Hur fungerar Hipobuy-köplänken?","Med giltigt Weidian-ID öppnar knappen rätt vara på Hipobuy med inbjudningskoden. Den här sidan lägger ingen order; kontrollera uppgifterna där."],["Vad händer om säljaren ändrar eller tar bort varan?","Pris, varianter och bilder kan ändras eller erbjudandet försvinna. Kontrollera källa och Hipobuy igen före köp; äldre bilder garanterar inte lagerstatus."],["Bekräftar en produkt äkthet eller kvalitet?","Nej. Bilder och länkar är referenser, inte autentisering eller kvalitetstest. Bedöm den exakta varan innan du bestämmer dig på köpsidan."]],"register":"Registrera dig hos Hipobuy","view":"Visa detaljer","original":"Kontrollera källsidan","buy":"Öppna hos Hipobuy","source":"Aktuella produktlistor","imageTitle":"Bildsökning","imageBody":"Bildsökning är ännu inte tillgänglig. Bilder kan inte laddas upp eller sparas här.","back":"Tillbaka till varor","noResults":"Inga matchande varor hittades.","unavailable":"Källan är tillfälligt otillgänglig. Försök igen senare.","independent":"Oberoende produktöversikt, inte driven av Hipobuy. Kontrollera detaljerna före köp.","photoNote":"Bilder från källan; inga separata QC-poster hittades.","sourceNote":"Kontrollera bilder, varianter och pris hos källan och på köpsidan.","page":"Sida","next":"Nästa","previous":"Föregående","sorting":"Sortera","sortOptions":["Källans ordning","Pris: lågt till högt","Pris: högt till lågt"],"faqGroups":["Om katalogen","Hitta och jämför varor","Bilder och produktsidor","Priser, länkar och köp"],"guideHeadings":["Hitta varor att jämföra","Kontrollera exakt erbjudande","Granska före beställning"]},"ko":{"nav":["홈","전체 상품","카테고리","이미지 검색"],"eyebrow":"독립 상품 안내","title":"Hipobuy Spreadsheet","intro":"카테고리별로 상품을 보고 사진과 가격을 비교한 뒤 Hipobuy에서 주문 전 다시 확인하세요.","search":"상품 검색","searchButton":"검색","categories":"카테고리 보기","latest":"추천 상품","browse":"전체 상품 보기","guideTitle":"상품 탐색부터 주문 확인까지","guide":["상품 키워드로 검색하거나 열 가지 카테고리에서 원하는 종류를 선택하세요. 전체 목록에서는 최신순, 가격순, 조회수순으로 정렬하고 여러 상품을 열어 비교할 수 있습니다. 대표 사진만 보지 말고 상품명과 가격도 함께 확인하세요. 결과가 적으면 검색어를 줄이거나 다른 표기를 사용하세요.","상세 페이지의 판매자 사진과 별도로 표시된 원본 참고 사진을 살펴보세요. 판매자 원본 페이지에서 사이즈, 색상, 소재와 옵션을 확인하세요. 비슷한 사진이라도 판매자가 다를 수 있습니다. 참고 사진은 내 주문의 창고 검수 기록이 아니므로 빠진 정보는 구매 전에 문의하세요.","제공되는 Hipobuy 링크를 열고 상품과 선택한 사이즈·색상이 맞는지 다시 확인하세요. 통화 환산은 참고용이므로 Hipobuy에서 현재 가격과 적용되는 배송비를 확인하세요. 발송 전에 내 주문의 검수 사진을 살펴보고 결제, 주문 문의, 사후 지원은 Hipobuy 계정에서 처리하세요."],"faqTitle":"자주 묻는 질문","faq":[["스프레드시트 파일을 다운로드할 수 있나요?","이곳은 카테고리와 개별 상세 페이지로 구성된 온라인 상품 목록입니다. 다운로드할 파일은 없으며 각 상품에서 사진과 원본 기록을 볼 수 있습니다."],["Hipobuy 공식 사이트인가요?","아닙니다. 이곳은 독립 상품 안내 사이트이며 가입과 구매는 Hipobuy에서 진행됩니다. 상품이 목록에 있다고 해서 판매자가 공식 인증된 것은 아닙니다."],["상품과 카테고리는 어디서 가져오나요?","상품, 10개 카테고리, 이미지와 가격은 외부 목록에서 읽어옵니다. 별도의 상품 데이터베이스를 운영하지 않으며 각 상품의 원본 기록을 확인할 수 있습니다."],["주문이나 고객 지원도 처리하나요?","이 사이트는 상품을 탐색하고 비교하는 용도입니다. 결제를 받거나 구매, 창고 검수, 배송, 환불을 관리하지 않습니다. 기존 주문 문의는 Hipobuy 계정에서 주문 번호와 함께 고객센터에 전달하세요."],["상품을 어떻게 찾고 비교하나요?","키워드 검색, 카테고리, 제공되는 정렬 기능을 사용하세요. 상품별 판매자 사진과 원본 사진 및 링크를 비교할 수 있으며 브랜드 필터는 없습니다."],["사진을 업로드해 검색할 수 있나요?","이미지 검색과 사진 업로드는 아직 사용할 수 없습니다. 텍스트 검색과 카테고리를 이용하고, 비슷한 사진이라도 다른 판매자의 상품인지 확인하세요."],["비슷한 상품이 왜 별도 항목으로 나오나요?","비슷한 제목과 대표 사진이라도 판매자나 옵션이 다를 수 있습니다. 같은 상품으로 판단하기 전에 상품 ID, 갤러리와 원본 링크를 비교하세요."],["검색 결과가 없으면 어떻게 하나요?","검색어를 줄이거나 다른 표기를 사용한 뒤 해당 카테고리를 살펴보세요. 판매자가 다른 상품명을 사용할 수 있습니다. 원본을 불러올 수 없다면 나중에 다시 시도하세요. 결과가 없다고 품절이 확인된 것은 아닙니다."],["위쪽 상품 슬라이드 사진은 어디서 오나요?","유효한 Weidian ID가 있으면 해당 판매 상품의 원본 사진과 가능한 옵션 사진을 보여줍니다. 작은 사진을 누르면 미리보기만 바뀌며 주문 옵션은 선택되지 않습니다."],["상품 아래 사진은 확인된 창고 QC인가요?","반드시 그렇지는 않습니다. 아래 사진은 동일한 원본 상품 페이지의 참고 사진이며 원본은 창고 QC 여부를 사진마다 표시하지 않습니다. 위쪽은 판매자 사진입니다."],["사진이 한 장이거나 슬라이드가 없는 이유는 무엇인가요?","판매자가 한 장만 올렸거나 Weidian ID가 누락되었거나 원본 페이지가 열리지 않을 수 있습니다. 참고 사진을 복제해서 가짜 슬라이드를 만들지 않습니다."],["사이즈와 소재는 어디에서 확인하나요?","정확한 상품과 옵션의 판매자 원본 페이지 및 Hipobuy 구매 페이지에서 치수, 소재 설명, 사이즈표를 확인하세요. 사진만으로 착용감이나 원단을 판단할 수 없습니다. 빠진 정보는 주문 전에 문의하세요."],["가격과 재고가 보장되나요?","아닙니다. 원본 가격과 재고는 바뀔 수 있고 선택한 통화 가격은 참고 환율을 적용한 대략적인 값입니다. 결제 전에 Hipobuy의 옵션과 최종 금액을 확인하세요."],["Hipobuy 구매 링크는 어떻게 작동하나요?","유효한 Weidian ID가 있으면 버튼이 초대 코드와 함께 Hipobuy의 해당 상품을 엽니다. 이 사이트에서는 주문하지 않으므로 이동 후 정보를 다시 확인하세요."],["판매자가 상품을 바꾸거나 내리면 어떻게 하나요?","판매자는 가격, 옵션과 사진을 바꾸거나 상품을 삭제할 수 있습니다. 구매 전에 원본과 Hipobuy 페이지를 다시 확인하고 오래된 사진만 믿지 마세요."],["목록이 정품이나 품질을 보증하나요?","아닙니다. 사진과 링크는 참고 자료이며 감정이나 품질 검사가 아닙니다. 정확한 판매 상품을 확인한 뒤 구매 사이트에서 결정하세요."]],"register":"Hipobuy 가입","view":"상세 보기","original":"원본 페이지 확인","buy":"Hipobuy에서 열기","source":"업데이트된 상품 목록","imageTitle":"이미지 검색","imageBody":"이미지 검색은 아직 제공되지 않습니다. 이 사이트에서는 사진을 업로드하거나 저장할 수 없습니다.","back":"상품 목록으로","noResults":"일치하는 상품이 없습니다.","unavailable":"원본 데이터를 일시적으로 불러올 수 없습니다. 잠시 후 다시 시도하세요.","independent":"Hipobuy에서 운영하지 않는 독립 상품 안내 사이트입니다. 주문 전에 상품 정보를 확인하세요.","photoNote":"원본 페이지의 사진이며 별도의 QC 기록은 확인되지 않았습니다.","sourceNote":"원본 페이지와 구매 페이지에서 사진, 옵션, 가격을 다시 확인하세요.","page":"페이지","next":"다음","previous":"이전","sorting":"정렬","sortOptions":["원본 순서","가격 낮은 순","가격 높은 순"],"faqGroups":["상품 목록 소개","상품 검색과 비교","사진과 상품 상세","가격·링크·구매"],"guideHeadings":["비교할 상품 찾기","정확한 상품과 사진 확인","주문과 발송 전 점검"]}},"products":[],"categories":[],"categoryProducts":{},"homeIds":[],"details":{},"generatedAt":"2026-09-29T07:06:07.513Z","currencies":[{"country":"United States","code":"USD","symbol":"$"},{"country":"Brazil","code":"BRL","symbol":"R$"},{"country":"China","code":"CNY","symbol":"¥"},{"country":"Denmark","code":"DKK","symbol":"kr"},{"country":"France","code":"EUR","symbol":"€"},{"country":"Mexico","code":"MXN","symbol":"MX$"},{"country":"New Zealand","code":"NZD","symbol":"NZ$"},{"country":"Norway","code":"NOK","symbol":"kr"},{"country":"Poland","code":"PLN","symbol":"zł"},{"country":"Sweden","code":"SEK","symbol":"kr"},{"country":"Switzerland","code":"CHF","symbol":"Fr."},{"country":"South Korea","code":"KRW","symbol":"₩"},{"country":"Australia","code":"AUD","symbol":"A$"},{"country":"United Kingdom","code":"GBP","symbol":"£"},{"country":"Canada","code":"CAD","symbol":"C$"}]};</script>
