<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">OOPBuy shipping timeline illustration</title>
  <desc id="desc">A parcel moving from order and warehouse quality control to an international flight and delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4f9"/><stop offset="1" stop-color="#f5bfd7"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4b9a"/><stop offset="1" stop-color="#ed0870"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#7b254b" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="750" rx="36" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="190" fill="#fff" opacity=".45"/>
  <path d="M120 560C330 435 470 520 650 390s300-105 440-205" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" opacity=".8"/>
  <g filter="url(#shadow)">
    <rect x="105" y="130" width="345" height="390" rx="30" fill="#fff"/>
    <rect x="145" y="178" width="265" height="66" rx="16" fill="#11131a"/>
    <circle cx="181" cy="211" r="12" fill="#ff1683"/>
    <rect x="210" y="198" width="148" height="12" rx="6" fill="#fff" opacity=".9"/>
    <rect x="210" y="220" width="105" height="9" rx="5" fill="#fff" opacity=".5"/>
    <path d="M180 307h195v150H180z" fill="url(#box)"/>
    <path d="M180 307l98-54 97 54-97 56z" fill="#ff8abb"/>
    <path d="M278 363v94" stroke="#b90050" stroke-width="10"/>
    <path d="M228 332l98-55" stroke="#fff" stroke-width="8" opacity=".8"/>
  </g>
  <g transform="translate(505 164)" filter="url(#shadow)">
    <circle cx="160" cy="160" r="148" fill="#11131a"/>
    <circle cx="160" cy="160" r="112" fill="#fff"/>
    <path d="M160 92v76l58 38" fill="none" stroke="#f40875" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="160" cy="160" r="13" fill="#11131a"/>
    <path d="M160 35v22M160 263v22M35 160h22M263 160h22" stroke="#11131a" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g transform="translate(790 330)" fill="none" stroke="#11131a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 126l250-76-65 64 70 24-25 35-85-12-62 86-31-8 35-91-74 11z" fill="#fff" stroke-width="11" filter="url(#shadow)"/>
    <path d="M188 125l47-11" stroke="#f40875" stroke-width="11"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-weight="800" fill="#11131a">
    <text x="108" y="620" font-size="28">ORDER</text><text x="540" y="620" font-size="28">WAREHOUSE</text><text x="925" y="620" font-size="28">DELIVERY</text>
    <text x="108" y="655" font-size="18" fill="#7c5366">Seller processing</text><text x="540" y="655" font-size="18" fill="#7c5366">QC and packing</text><text x="925" y="655" font-size="18" fill="#7c5366">Route transit</text>
  </g>
</svg>
