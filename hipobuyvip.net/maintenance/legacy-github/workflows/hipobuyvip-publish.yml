name: Publish HipoBuyVIP guide

on:
  push:
    branches: [main]
    paths:
      - 'hipobuyvip.net/articles/hipobuy-*.html'
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event_name == 'push' || startsWith(github.event.issue.title, 'Publish HipoBuyVIP ')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply latest HipoBuyVIP guide manifest
        run: python3 hipobuyvip.net/.automation/publish_latest.py
      - name: Commit generated index updates
        run: |
          set -euo pipefail
          if git diff --quiet -- hipobuyvip.net/index.html hipobuyvip.net/articles/index.html hipobuyvip.net/sitemap.xml; then
            echo "Indexes already current."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hipobuyvip.net/index.html hipobuyvip.net/articles/index.html hipobuyvip.net/sitemap.xml
          git commit -m "Publish latest HipoBuyVIP buyer guide"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
