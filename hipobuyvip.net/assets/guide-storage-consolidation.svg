<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">HipoBuy warehouse storage and consolidation guide</title>
<desc id="desc">Blue editorial illustration showing a 90-day calendar, warehouse boxes, quality checks and international parcel shipping.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eaf5ff"/>
    <stop offset=".52" stop-color="#cfe8ff"/>
    <stop offset="1" stop-color="#9fcbff"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#eff7ff"/>
  </linearGradient>
  <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c88a45"/>
    <stop offset="1" stop-color="#955b25"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2f83ff"/>
    <stop offset="1" stop-color="#0d56c9"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0a2b63" flood-opacity=".18"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a2b63" flood-opacity=".12"/>
  </filter>
</defs>

<rect width="1200" height="675" rx="32" fill="url(#bg)"/>
<circle cx="1055" cy="95" r="190" fill="#fff" opacity=".36"/>
<circle cx="125" cy="600" r="230" fill="#fff" opacity=".27"/>

<!-- route -->
<path d="M128 190 C330 92 515 120 665 195 S955 300 1080 185" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 18" opacity=".85"/>
<g fill="#176cff" stroke="#fff" stroke-width="5" filter="url(#soft)">
  <path d="M128 168c-20 0-36 16-36 36 0 28 36 63 36 63s36-35 36-63c0-20-16-36-36-36z"/><circle cx="128" cy="204" r="11" fill="#fff" stroke="none"/>
  <path d="M1080 160c-20 0-36 16-36 36 0 28 36 63 36 63s36-35 36-63c0-20-16-36-36-36z"/><circle cx="1080" cy="196" r="11" fill="#fff" stroke="none"/>
</g>

<!-- plane -->
<g transform="translate(820 77) rotate(8)" filter="url(#soft)">
  <path d="M0 38 118 0l28 10-78 46 70 23-18 14-87-17-36 25-18-6 22-34-39-14 12-11 52 2z" fill="#fff"/>
  <path d="M68 56 138 79l-18 14-64-13z" fill="#176cff" opacity=".85"/>
</g>

<!-- left editorial panel -->
<g filter="url(#shadow)">
  <rect x="74" y="92" width="442" height="493" rx="30" fill="url(#panel)" stroke="#fff" stroke-width="3"/>
</g>
<rect x="108" y="126" width="174" height="40" rx="20" fill="#e3f0ff"/>
<circle cx="132" cy="146" r="7" fill="#176cff"/>
<text x="150" y="152" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.2" fill="#176cff">WAREHOUSE STRATEGY</text>
<text x="108" y="224" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="900" fill="#0a2b63">90-Day</text>
<text x="108" y="278" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="900" fill="#0a2b63">Storage Plan</text>
<text x="108" y="326" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#607392">Inspect. Consolidate. Ship.</text>
<g transform="translate(108 375)">
  <rect width="348" height="150" rx="22" fill="#f7fbff" stroke="#d4e7fb" stroke-width="2"/>
  <g transform="translate(28 24)">
    <rect width="74" height="78" rx="14" fill="url(#blue)"/>
    <rect x="12" y="12" width="50" height="11" rx="5.5" fill="#fff" opacity=".95"/>
    <text x="37" y="65" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="900" fill="#fff">90</text>
  </g>
  <g transform="translate(130 27)" font-family="Inter,Arial,sans-serif">
    <circle cx="10" cy="12" r="10" fill="#dff6ec"/><path d="m5 12 4 4 7-9" fill="none" stroke="#149864" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="31" y="18" font-size="18" font-weight="800" fill="#173b70">QC decisions</text>
    <circle cx="10" cy="53" r="10" fill="#e7f1ff"/><path d="M5 53h10M10 48v10" stroke="#176cff" stroke-width="3" stroke-linecap="round"/>
    <text x="31" y="59" font-size="18" font-weight="800" fill="#173b70">Compatible packing</text>
    <circle cx="10" cy="94" r="10" fill="#fff0df"/><path d="M4 94h12M7 89l-3 5 3 5M13 89l3 5-3 5" fill="none" stroke="#d17921" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="31" y="100" font-size="18" font-weight="800" fill="#173b70">Parcel deadline</text>
  </g>
</g>

<!-- warehouse ground -->
<ellipse cx="848" cy="566" rx="287" ry="54" fill="#739ed2" opacity=".25"/>

<!-- boxes -->
<g filter="url(#shadow)">
  <g transform="translate(605 305)">
    <path d="M0 88 118 28l141 52-119 66z" fill="#dfad70"/>
    <path d="M0 88v151l140 63V146z" fill="url(#box)"/>
    <path d="M140 146v156l119-70V80z" fill="#a86a2f"/>
    <path d="m118 28 141 52-51 30-142-54z" fill="#f0c38d"/>
    <path d="M127 142 68 115v151l59 27z" fill="#e0a35f" opacity=".66"/>
    <text x="69" y="205" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="900" fill="#fff" transform="skewY(24)">HipoBuyVIP</text>
  </g>
  <g transform="translate(840 363)">
    <path d="M0 54 89 12l103 38-90 49z" fill="#eac08e"/>
    <path d="M0 54v105l102 45V99z" fill="#b97837"/>
    <path d="M102 99v105l90-52V50z" fill="#975b28"/>
    <path d="m89 12 103 38-38 22-103-39z" fill="#f4d3a9"/>
  </g>
</g>

<!-- QC card -->
<g transform="translate(895 250) rotate(5)" filter="url(#soft)">
  <rect width="210" height="122" rx="22" fill="#fff" stroke="#d5e7fa" stroke-width="3"/>
  <rect x="20" y="21" width="70" height="78" rx="14" fill="#eaf4ff"/>
  <path d="M35 76c12-27 31-34 43-21 6 6 3 18-6 25-12 9-26 6-37-4z" fill="#176cff" opacity=".84"/>
  <circle cx="121" cy="44" r="16" fill="#dff6ec"/>
  <path d="m112 44 7 7 13-16" fill="none" stroke="#149864" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="108" y="76" width="76" height="9" rx="4.5" fill="#c9dbef"/>
  <rect x="108" y="93" width="51" height="8" rx="4" fill="#e0ebf7"/>
</g>

<!-- small parcel icon -->
<g transform="translate(1036 474)" filter="url(#soft)">
  <circle cx="54" cy="54" r="54" fill="url(#blue)"/>
  <path d="m24 47 30-17 30 17-30 17z" fill="#fff"/>
  <path d="M24 47v31l30 17V64zM54 64v31l30-17V47z" fill="#dbeaff"/>
  <path d="M39 39 69 56" stroke="#176cff" stroke-width="4" opacity=".55"/>
</g>
</svg>