<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">HipoBuy reverse purchasing control-point workflow guide</title>
<desc id="desc">Blue editorial illustration showing a Chinese marketplace link moving through purchasing, warehouse QC, parcel consolidation and international delivery.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eaf5ff"/>
    <stop offset=".52" stop-color="#cfe8ff"/>
    <stop offset="1" stop-color="#9fcbff"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#eff7ff"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2f83ff"/>
    <stop offset="1" stop-color="#0d56c9"/>
  </linearGradient>
  <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dca15c"/>
    <stop offset="1" stop-color="#9b6129"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0a2b63" flood-opacity=".18"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a2b63" flood-opacity=".12"/>
  </filter>
</defs>

<rect width="1200" height="675" rx="32" fill="url(#bg)"/>
<circle cx="1060" cy="88" r="188" fill="#fff" opacity=".34"/>
<circle cx="130" cy="610" r="220" fill="#fff" opacity=".25"/>

<!-- left editorial panel -->
<g filter="url(#shadow)">
  <rect x="74" y="92" width="440" height="493" rx="30" fill="url(#panel)" stroke="#fff" stroke-width="3"/>
</g>
<rect x="108" y="126" width="196" height="40" rx="20" fill="#e3f0ff"/>
<circle cx="132" cy="146" r="7" fill="#176cff"/>
<text x="150" y="152" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.2" fill="#176cff">REVERSE PURCHASING</text>
<text x="108" y="224" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="900" fill="#0a2b63">Control Every</text>
<text x="108" y="278" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="900" fill="#0a2b63">Handoff</text>
<text x="108" y="326" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#607392">Link → QC → Parcel → Delivery</text>

<g transform="translate(108 374)">
  <rect width="348" height="151" rx="22" fill="#f7fbff" stroke="#d4e7fb" stroke-width="2"/>
  <g transform="translate(24 28)">
    <circle cx="12" cy="12" r="11" fill="#e7f1ff"/>
    <path d="M7 12h10M12 7v10" stroke="#176cff" stroke-width="3" stroke-linecap="round"/>
    <text x="34" y="18" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#173b70">Verify the source</text>
    <circle cx="12" cy="53" r="11" fill="#dff6ec"/>
    <path d="m6 53 4 4 8-10" fill="none" stroke="#149864" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="59" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#173b70">Inspect what arrived</text>
    <circle cx="12" cy="94" r="11" fill="#fff0df"/>
    <path d="M5 94h14M9 89l-4 5 4 5M15 89l4 5-4 5" fill="none" stroke="#d17921" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="100" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#173b70">Ship the real parcel</text>
  </g>
</g>

<!-- process route -->
<path d="M582 166 C710 105 824 111 918 167 S1030 282 1072 346" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 18" opacity=".9"/>
<path d="M611 505 C740 575 934 589 1065 507" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="5 18" opacity=".72"/>

<!-- source listing card -->
<g transform="translate(560 108) rotate(-4)" filter="url(#soft)">
  <rect width="224" height="150" rx="24" fill="#fff" stroke="#d4e6fa" stroke-width="3"/>
  <rect x="20" y="20" width="78" height="88" rx="16" fill="#eaf4ff"/>
  <path d="M38 53h42M38 68h31M38 83h36" stroke="#176cff" stroke-width="6" stroke-linecap="round"/>
  <rect x="117" y="28" width="78" height="13" rx="6.5" fill="#b9d2ee"/>
  <rect x="117" y="53" width="61" height="10" rx="5" fill="#d9e7f5"/>
  <rect x="117" y="74" width="72" height="10" rx="5" fill="#d9e7f5"/>
  <rect x="117" y="95" width="48" height="10" rx="5" fill="#d9e7f5"/>
  <rect x="20" y="122" width="174" height="10" rx="5" fill="#edf4fb"/>
</g>

<!-- buyer / order checkpoint -->
<g transform="translate(828 118)" filter="url(#soft)">
  <circle cx="78" cy="78" r="78" fill="url(#blue)"/>
  <circle cx="78" cy="57" r="25" fill="#fff"/>
  <path d="M35 130c5-29 22-45 43-45s38 16 43 45" fill="#dceaff"/>
  <path d="M45 31h66" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".72"/>
  <circle cx="118" cy="118" r="26" fill="#fff"/>
  <path d="m106 118 8 8 16-19" fill="none" stroke="#149864" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- QC warehouse card -->
<g transform="translate(655 328) rotate(2)" filter="url(#shadow)">
  <rect width="292" height="190" rx="28" fill="#fff" stroke="#d5e7fa" stroke-width="3"/>
  <path d="M30 75 91 42l66 29-63 36z" fill="#eac18f"/>
  <path d="M30 75v66l64 28v-62z" fill="url(#box)"/>
  <path d="M94 107v62l63-36V71z" fill="#9b6129"/>
  <circle cx="218" cy="72" r="35" fill="#e9f3ff"/>
  <circle cx="212" cy="66" r="20" fill="none" stroke="#176cff" stroke-width="6"/>
  <path d="m226 80 18 18" stroke="#176cff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="226" cy="139" r="24" fill="#dff6ec"/>
  <path d="m215 139 8 8 15-18" fill="none" stroke="#149864" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="174" y="119" width="18" height="8" rx="4" fill="#d5e5f5"/>
  <rect x="174" y="136" width="26" height="8" rx="4" fill="#d5e5f5"/>
  <rect x="174" y="153" width="34" height="8" rx="4" fill="#d5e5f5"/>
</g>

<!-- parcel + globe -->
<g transform="translate(956 348)" filter="url(#soft)">
  <circle cx="90" cy="90" r="90" fill="#fff" opacity=".95"/>
  <circle cx="90" cy="90" r="65" fill="#e8f3ff" stroke="#176cff" stroke-width="4"/>
  <path d="M25 90h130M90 25c25 27 38 49 38 65s-13 39-38 65M90 25C65 52 52 74 52 90s13 38 38 65" fill="none" stroke="#176cff" stroke-width="4" opacity=".8"/>
  <path d="M40 56c33 18 67 18 100 0M40 124c33-18 67-18 100 0" fill="none" stroke="#176cff" stroke-width="4" opacity=".55"/>
  <g transform="translate(-29 87)">
    <path d="M0 38 99 6l24 9-66 38 60 20-16 12-74-15-30 21-16-6 19-28-33-12 10-10 44 3z" fill="#0d5dde"/>
  </g>
</g>

<!-- checkpoint labels -->
<g font-family="Inter,Arial,sans-serif" font-weight="850" fill="#0a2b63">
  <g transform="translate(555 279)">
    <rect width="198" height="40" rx="20" fill="#fff" opacity=".88"/>
    <circle cx="24" cy="20" r="7" fill="#176cff"/>
    <text x="42" y="26" font-size="15">1 · SOURCE LISTING</text>
  </g>
  <g transform="translate(816 287)">
    <rect width="176" height="40" rx="20" fill="#fff" opacity=".88"/>
    <circle cx="24" cy="20" r="7" fill="#176cff"/>
    <text x="42" y="26" font-size="15">2 · PURCHASE</text>
  </g>
  <g transform="translate(625 547)">
    <rect width="160" height="40" rx="20" fill="#fff" opacity=".88"/>
    <circle cx="24" cy="20" r="7" fill="#176cff"/>
    <text x="42" y="26" font-size="15">3 · QC</text>
  </g>
  <g transform="translate(886 559)">
    <rect width="227" height="40" rx="20" fill="#fff" opacity=".88"/>
    <circle cx="24" cy="20" r="7" fill="#176cff"/>
    <text x="42" y="26" font-size="15">4 · PARCEL &amp; ROUTE</text>
  </g>
</g>
</svg>
