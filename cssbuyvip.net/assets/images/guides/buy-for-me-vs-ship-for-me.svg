  <text x="945" y="398" font-size="40" font-weight="800" fill="#143d24">SHIP FOR ME</text>
  <text x="868" y="450" font-size="25" fill="#42584a">You place the order; CSSBuy receives and forwards it.</text>
  <g transform="translate(870 486)">
    <rect x="0" y="0" width="150" height="96" rx="18" fill="#fff" stroke="#cae7cc" stroke-width="2"/><text x="75" y="42" font-size="22" text-anchor="middle" font-weight="700" fill="#1c4e2b">SELLER</text><text x="75" y="70" font-size="18" text-anchor="middle" fill="#55705e">your checkout</text>
    <path d="M160 48h58" stroke="#4da84b" stroke-width="6" stroke-linecap="round"/><path d="m205 35 18 13-18 13" fill="none" stroke="#4da84b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="228" y="0" width="150" height="96" rx="18" fill="#fff" stroke="#cae7cc" stroke-width="2"/><text x="303" y="42" font-size="22" text-anchor="middle" font-weight="700" fill="#1c4e2b">DOMESTIC</text><text x="303" y="70" font-size="18" text-anchor="middle" fill="#55705e">parcel to CSSBuy</text>
    <path d="M388 48h58" stroke="#4da84b" stroke-width="6" stroke-linecap="round"/><path d="m433 35 18 13-18 13" fill="none" stroke="#4da84b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="456" y="0" width="150" height="96" rx="18" fill="#e8f6e8" stroke="#86c88c" stroke-width="2"/><text x="531" y="42" font-size="22" text-anchor="middle" font-weight="800" fill="#247d34">WAREHOUSE</text><text x="531" y="70" font-size="18" text-anchor="middle" fill="#55705e">receive + forward</text>
  </g>
  <text x="870" y="625" font-size="20" fill="#587062">Best when you already control the seller relationship and domestic payment.</text>

  <rect x="95" y="704" width="1410" height="96" rx="24" fill="#173f25"/>
  <text x="137" y="744" font-size="22" font-weight="700" fill="#bfe6c3">COMMON WAREHOUSE STAGE</text>
  <g font-size="24" font-weight="700" fill="#fff"><text x="138" y="777">QC Photos</text><text x="402" y="777">Storage</text><text x="642" y="777">Consolidation</text><text x="956" y="777">Packing</text><text x="1195" y="777">International Shipping</text></g>
  <g fill="#63c353"><circle cx="351" cy="768" r="6"/><circle cx="586" cy="768" r="6"/><circle cx="899" cy="768" r="6"/><circle cx="1140" cy="768" r="6"/></g>
</g>
</svg>