<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CSSBuy Parcel Delivery Guide 2026</title>
<desc id="desc">Green and white CSSBuy buyer guide artwork showing a sealed parcel, opening video, item manifest and My Parcel after-sales note.</desc>
<defs>
  <linearGradient id="bgDelivery" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ef"/><stop offset="1" stop-color="#dff2e2"/></linearGradient>
  <linearGradient id="greenDelivery" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56b63b"/><stop offset="1" stop-color="#278c35"/></linearGradient>
  <filter id="shadowDelivery" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173e28" flood-opacity=".14"/></filter>
</defs>
<rect width="1600" height="900" rx="36" fill="url(#bgDelivery)"/>
<circle cx="1455" cy="92" r="185" fill="#fff" opacity=".42"/><circle cx="115" cy="830" r="170" fill="#fff" opacity=".32"/>
<rect x="54" y="52" width="1492" height="796" rx="34" fill="#fff" filter="url(#shadowDelivery)"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="100" y="126" font-size="54" font-weight="800" fill="#0d3b22">CSSBuy</text>
  <rect x="342" y="84" width="330" height="54" rx="27" fill="url(#greenDelivery)"/><text x="507" y="121" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">DELIVERY GUIDE 2026</text>
  <text x="100" y="222" font-size="68" font-weight="900" fill="#10291a">Evidence-First Arrival Audit</text>
  <text x="100" y="272" font-size="30" fill="#486052">Connect the sealed parcel to every item before the evidence disappears</text>

  <g transform="translate(95 335)">
    <rect x="0" y="0" width="330" height="330" rx="28" fill="#f6fbf6" stroke="#98d29b" stroke-width="3"/>
    <circle cx="50" cy="50" r="25" fill="#3fa13b"/><text x="50" y="59" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">1</text>
    <text x="90" y="59" font-size="27" font-weight="800" fill="#173f25">SEALED BOX</text>
    <path d="M82 150l83-45 83 45-83 46z" fill="#b5dfb6" stroke="#2f8f39" stroke-width="4"/><path d="M82 150v91l83 47v-92zm166 0v91l-83 47v-92" fill="#dff0df" stroke="#2f8f39" stroke-width="4"/><path d="M165 105v91" stroke="#2f8f39" stroke-width="4"/>
    <rect x="182" y="159" width="49" height="35" rx="5" fill="#fff" stroke="#6daf72" stroke-width="3"/>
    <text x="165" y="314" text-anchor="middle" font-size="20" font-weight="700" fill="#486052">Label • seams • corners</text>
  </g>

  <g transform="translate(455 335)">
    <rect x="0" y="0" width="330" height="330" rx="28" fill="#eef8ef" stroke="#98d29b" stroke-width="3"/>
    <circle cx="50" cy="50" r="25" fill="#3fa13b"/><text x="50" y="59" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">2</text>
    <text x="90" y="59" font-size="27" font-weight="800" fill="#173f25">OPENING</text>
    <rect x="85" y="102" width="160" height="190" rx="22" fill="#173f25"/><rect x="98" y="122" width="134" height="143" rx="10" fill="#dff0df"/>
    <circle cx="165" cy="194" r="37" fill="#3fa13b"/><path d="M154 174l31 20-31 20z" fill="#fff"/>
    <circle cx="165" cy="278" r="7" fill="#78db63"/>
    <text x="165" y="314" text-anchor="middle" font-size="20" font-weight="700" fill="#486052">One continuous video</text>
  </g>

  <g transform="translate(815 335)">
    <rect x="0" y="0" width="330" height="330" rx="28" fill="#f6fbf6" stroke="#98d29b" stroke-width="3"/>
    <circle cx="50" cy="50" r="25" fill="#3fa13b"/><text x="50" y="59" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">3</text>
    <text x="90" y="59" font-size="27" font-weight="800" fill="#173f25">MANIFEST</text>
    <rect x="70" y="102" width="190" height="184" rx="16" fill="#fff" stroke="#6daf72" stroke-width="4"/>
    <g stroke="#3fa13b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M94 141l8 8 15-18"/><path d="M94 183l8 8 15-18"/><path d="M94 225l8 8 15-18"/></g>
    <g stroke="#9fc9a2" stroke-width="5" stroke-linecap="round"><path d="M133 141h93"/><path d="M133 183h93"/><path d="M133 225h93"/></g>
    <text x="165" y="314" text-anchor="middle" font-size="20" font-weight="700" fill="#486052">Present • damaged • missing</text>
  </g>

  <g transform="translate(1175 335)">
    <rect x="0" y="0" width="330" height="330" rx="28" fill="#eaf6eb" stroke="#8cca91" stroke-width="3"/>
    <circle cx="50" cy="50" r="25" fill="#3fa13b"/><text x="50" y="59" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">4</text>
    <text x="90" y="59" font-size="27" font-weight="800" fill="#173f25">ADD NOTE</text>
    <path d="M73 115h184a20 20 0 0120 20v100a20 20 0 01-20 20h-93l-45 38 9-38H73a20 20 0 01-20-20V135a20 20 0 0120-20z" fill="#fff" stroke="#3fa13b" stroke-width="4"/>
    <g stroke="#9fc9a2" stroke-width="6" stroke-linecap="round"><path d="M88 157h145"/><path d="M88 190h118"/><path d="M88 223h92"/></g>
    <text x="165" y="314" text-anchor="middle" font-size="20" font-weight="700" fill="#486052">Use the relevant My Parcel</text>
  </g>

  <rect x="95" y="714" width="1410" height="86" rx="24" fill="#173f25"/>
  <g font-size="21" font-weight="700" fill="#fff"><text x="140" y="765">Match Tracking</text><text x="450" y="765">Record Condition</text><text x="790" y="765">Count Every Unit</text><text x="1130" y="765">Preserve Packaging</text><text x="1400" y="765">Report</text></g>
  <g fill="#63c353"><circle cx="385" cy="757" r="6"/><circle cx="720" cy="757" r="6"/><circle cx="1060" cy="757" r="6"/><circle cx="1355" cy="757" r="6"/></g>
</g>
</svg>
