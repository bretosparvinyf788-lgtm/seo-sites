<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CSSBuy First Order Guide 2026</title>
<desc id="desc">Green and white buyer guide cover showing a first-order checklist, shopping cart, warehouse QC and international parcel flow with fifteen mistakes to avoid.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ef"/><stop offset="1" stop-color="#dff2e2"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62bf45"/><stop offset="1" stop-color="#288b38"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173e28" flood-opacity=".14"/></filter>
</defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/>
<circle cx="1440" cy="92" r="190" fill="#fff" opacity=".45"/><circle cx="110" cy="825" r="170" fill="#fff" opacity=".34"/>
<rect x="54" y="52" width="1492" height="796" rx="34" fill="#fff" filter="url(#shadow)"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="100" y="126" font-size="54" font-weight="800" fill="#0d3b22">CSSBuy</text>
  <rect x="345" y="84" width="310" height="54" rx="27" fill="url(#green)"/><text x="500" y="121" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">BEGINNER GUIDE 2026</text>
  <text x="100" y="222" font-size="70" font-weight="900" fill="#10291a">First Order Playbook</text>
  <text x="100" y="278" font-size="32" fill="#486052">15 mistakes new buyers should avoid before the first parcel ships</text>

  <g transform="translate(95 345)">
    <rect x="0" y="0" width="640" height="330" rx="30" fill="#f6fbf6" stroke="#98d29b" stroke-width="3"/>
    <text x="40" y="58" font-size="28" font-weight="800" fill="#1c4e2b">FIRST-ORDER CHECKLIST</text>
    <g transform="translate(42 92)" font-size="24" fill="#173f25" font-weight="700">
      <circle cx="22" cy="20" r="18" fill="#3fa13b"/><text x="22" y="28" text-anchor="middle" fill="#fff">1</text><text x="58" y="29">Confirm exact size, colour and quantity</text>
      <circle cx="22" cy="78" r="18" fill="#3fa13b"/><text x="22" y="86" text-anchor="middle" fill="#fff">2</text><text x="58" y="87">Record item price + China freight</text>
      <circle cx="22" cy="136" r="18" fill="#3fa13b"/><text x="22" y="144" text-anchor="middle" fill="#fff">3</text><text x="58" y="145">Watch seller dispatch and tracking</text>
      <circle cx="22" cy="194" r="18" fill="#3fa13b"/><text x="22" y="202" text-anchor="middle" fill="#fff">4</text><text x="58" y="203">Review warehouse QC before shipping</text>
    </g>
    <rect x="405" y="238" width="190" height="55" rx="20" fill="#173f25"/><text x="500" y="274" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">15 TO AVOID</text>
  </g>

  <g transform="translate(790 340)">
    <rect x="0" y="0" width="640" height="350" rx="30" fill="#eaf6eb" stroke="#8cca91" stroke-width="3"/>
    <path d="M90 95h95l35 120H105z" fill="#fff" stroke="#2f8f39" stroke-width="5"/><circle cx="125" cy="246" r="19" fill="#2f8f39"/><circle cx="205" cy="246" r="19" fill="#2f8f39"/><path d="M105 105l-18-46H48" fill="none" stroke="#2f8f39" stroke-width="6" stroke-linecap="round"/>
    <rect x="255" y="60" width="138" height="108" rx="16" fill="#fff" stroke="#2f8f39" stroke-width="4"/><path d="M275 96l20 20 41-45" fill="none" stroke="#3fa13b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="324" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#486052">QC</text>
    <rect x="455" y="60" width="135" height="118" rx="14" fill="#d6b17a" stroke="#876438" stroke-width="4"/><path d="M455 98h135M523 60v118" stroke="#876438" stroke-width="4"/>
    <path d="M160 292 C250 245, 330 245, 420 292" fill="none" stroke="#61b65a" stroke-width="5" stroke-dasharray="12 12"/><path d="M420 292 C500 330, 565 305, 600 255" fill="none" stroke="#61b65a" stroke-width="5" stroke-dasharray="12 12"/>
    <text x="320" y="325" text-anchor="middle" font-size="24" font-weight="800" fill="#173f25">BUY → QC → PACK → SHIP</text>
  </g>

  <rect x="95" y="724" width="1410" height="78" rx="24" fill="#173f25"/>
  <g font-size="22" font-weight="700" fill="#fff"><text x="145" y="773">Small Test Order</text><text x="435" y="773">Exact Variant</text><text x="710" y="773">Fast QC Review</text><text x="1010" y="773">Route Check</text><text x="1270" y="773">Controlled Parcel</text></g>
  <g fill="#63c353"><circle cx="385" cy="765" r="6"/><circle cx="655" cy="765" r="6"/><circle cx="960" cy="765" r="6"/><circle cx="1225" cy="765" r="6"/></g>
</g>
</svg>
