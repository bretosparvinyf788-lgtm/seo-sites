<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CSSBuy True Cost Guide 2026</title>
<desc id="desc">Green and white CSSBuy buyer guide artwork showing product cost, domestic shipping, warehouse planning, international freight and destination costs.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ef"/><stop offset="1" stop-color="#dff2e2"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56b63b"/><stop offset="1" stop-color="#278c35"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173e28" flood-opacity=".14"/></filter>
</defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/>
<circle cx="1450" cy="95" r="185" fill="#fff" opacity=".42"/><circle cx="120" cy="825" r="170" fill="#fff" opacity=".32"/>
<rect x="54" y="52" width="1492" height="796" rx="34" fill="#fff" filter="url(#shadow)"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="100" y="126" font-size="54" font-weight="800" fill="#0d3b22">CSSBuy</text>
  <rect x="342" y="84" width="236" height="54" rx="27" fill="url(#green)"/><text x="460" y="121" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">BUYER GUIDE 2026</text>
  <text x="100" y="222" font-size="68" font-weight="900" fill="#10291a">True Cost Blueprint</text>
  <text x="100" y="272" font-size="30" fill="#486052">Budget a reverse purchase before the seller checkout becomes irreversible</text>

  <rect x="95" y="330" width="860" height="345" rx="28" fill="#f6fbf6" stroke="#98d29b" stroke-width="3"/>
  <text x="132" y="382" font-size="28" font-weight="800" fill="#1c4e2b">THE FIVE-NUMBER PURCHASE RECORD</text>

  <g transform="translate(132 418)">
    <circle cx="30" cy="28" r="28" fill="#3fa13b"/><text x="30" y="38" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">1</text><text x="82" y="37" font-size="25" font-weight="700" fill="#173f25">Seller item cost in RMB</text>
    <circle cx="30" cy="88" r="28" fill="#3fa13b"/><text x="30" y="98" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">2</text><text x="82" y="97" font-size="25" font-weight="700" fill="#173f25">Chinese domestic delivery</text>
    <circle cx="30" cy="148" r="28" fill="#3fa13b"/><text x="30" y="158" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">3</text><text x="82" y="157" font-size="25" font-weight="700" fill="#173f25">Working international-freight estimate</text>
    <circle cx="30" cy="208" r="28" fill="#3fa13b"/><text x="30" y="218" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">4</text><text x="82" y="217" font-size="25" font-weight="700" fill="#173f25">Warehouse and packing allowance</text>
    <circle cx="30" cy="268" r="28" fill="#3fa13b"/><text x="30" y="278" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">5</text><text x="82" y="277" font-size="25" font-weight="700" fill="#173f25">Destination-side reserve where applicable</text>
  </g>

  <g transform="translate(1015 330)">
    <rect x="0" y="0" width="430" height="345" rx="28" fill="#eaf6eb" stroke="#8cca91" stroke-width="3"/>
    <rect x="65" y="48" width="300" height="72" rx="18" fill="#173f25"/><text x="215" y="94" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">TRUE COST</text>
    <rect x="88" y="150" width="254" height="136" rx="22" fill="#fff" stroke="#b9ddbd" stroke-width="3"/>
    <g fill="#286f36"><circle cx="130" cy="190" r="18"/><circle cx="215" cy="190" r="18"/><circle cx="300" cy="190" r="18"/><circle cx="130" cy="245" r="18"/><circle cx="215" cy="245" r="18"/><circle cx="300" cy="245" r="18"/></g>
    <g font-size="20" text-anchor="middle" font-weight="800" fill="#fff"><text x="130" y="197">¥</text><text x="215" y="197">kg</text><text x="300" y="197">m³</text><text x="130" y="252">+</text><text x="215" y="252">%</text><text x="300" y="252">=</text></g>
  </g>

  <rect x="95" y="714" width="1410" height="86" rx="24" fill="#173f25"/>
  <g font-size="22" font-weight="700" fill="#fff"><text x="140" y="765">Seller Price</text><text x="390" y="765">China Freight</text><text x="670" y="765">Warehouse Choices</text><text x="1010" y="765">Intl Shipping</text><text x="1280" y="765">Destination</text></g>
  <g fill="#63c353"><circle cx="340" cy="757" r="6"/><circle cx="620" cy="757" r="6"/><circle cx="960" cy="757" r="6"/><circle cx="1230" cy="757" r="6"/></g>
</g>
</svg>