  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#50473e"><text x="120" y="486">SUBMITTED</text><text x="311" y="354">DISPATCHED</text><text x="515" y="444">EXPORT</text><text x="710" y="320">CUSTOMS</text><text x="867" y="475">DELIVERY</text></g>
  <rect x="936" y="310" width="130" height="205" rx="18" fill="#f4eadb" stroke="#dfc9a8" stroke-width="3"/>
  <path d="M970 355h63M970 394h63M970 433h42" stroke="#a76308" stroke-width="10" stroke-linecap="round"/>
  <circle cx="1035" cy="470" r="22" fill="#378541"/><path d="m1024 470 8 8 16-19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
