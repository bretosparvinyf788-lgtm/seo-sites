<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">CSSBuy tracking diagnostic guide</title>
  <desc id="desc">A parcel route with scan checkpoints and a diagnostic panel.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6ead8"/><stop offset="1" stop-color="#fffdfa"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="80" y="76" width="1040" height="523" rx="34" fill="#fffefa" stroke="#dfc9a8" stroke-width="4"/>
  <text x="130" y="155" fill="#a76308" font-family="Arial,sans-serif" font-size="24" font-weight="700">CSSBUY PARCEL CONTROL</text>
  <text x="130" y="225" fill="#181512" font-family="Georgia,serif" font-size="56" font-weight="700">Tracking Not Updating?</text>
  <text x="130" y="276" fill="#6b645b" font-family="Arial,sans-serif" font-size="25">Read the last scan, identify the owner, then choose the next action.</text>
