<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CSSBuy Expert Buy Manual Order Guide 2026</title>
<desc id="desc">Green and white CSSBuy buyer guide artwork showing a structured manual order brief for Yupoo, WeChat, Weidian and unreadable product listings.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ef"/><stop offset="1" stop-color="#dff2e2"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56b63b"/><stop offset="1" stop-color="#278c35"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173e28" flood-opacity=".14"/></filter>
</defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/>
<circle cx="1450" cy="95" r="185" fill="#fff" opacity=".42"/><circle cx="120" cy="825" r="170" fill="#fff" opacity=".32"/>
<rect x="54" y="52" width="1492" height="796" rx="34" fill="#fff" filter="url(#shadow)"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="100" y="126" font-size="54" font-weight="800" fill="#0d3b22">CSSBuy</text>
  <rect x="342" y="84" width="250" height="54" rx="27" fill="url(#green)"/><text x="467" y="121" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">EXPERT BUY 2026</text>
  <text x="100" y="222" font-size="68" font-weight="900" fill="#10291a">Manual Order Playbook</text>
  <text x="100" y="272" font-size="30" fill="#486052">Turn scattered seller messages into one purchase brief CSSBuy can follow</text>

  <rect x="95" y="330" width="865" height="345" rx="28" fill="#f6fbf6" stroke="#98d29b" stroke-width="3"/>
  <text x="132" y="382" font-size="28" font-weight="800" fill="#1c4e2b">THE ORDER BRIEF</text>
  <g transform="translate(132 420)">
    <rect x="0" y="0" width="760" height="46" rx="13" fill="#e5f4e6"/><text x="24" y="31" font-size="23" font-weight="800" fill="#1d4f2c">1. SOURCE</text><text x="220" y="31" font-size="22" fill="#3f5d49">Yupoo / WeChat / Weidian / unreadable listing</text>
    <rect x="0" y="58" width="760" height="46" rx="13" fill="#eef8ef"/><text x="24" y="89" font-size="23" font-weight="800" fill="#1d4f2c">2. ITEM</text><text x="220" y="89" font-size="22" fill="#3f5d49">Exact title, seller code and visual reference</text>
    <rect x="0" y="116" width="760" height="46" rx="13" fill="#e5f4e6"/><text x="24" y="147" font-size="23" font-weight="800" fill="#1d4f2c">3. VARIANT</text><text x="220" y="147" font-size="22" fill="#3f5d49">Version + colour + size + quantity</text>
    <rect x="0" y="174" width="760" height="46" rx="13" fill="#eef8ef"/><text x="24" y="205" font-size="23" font-weight="800" fill="#1d4f2c">4. MONEY</text><text x="220" y="205" font-size="22" fill="#3f5d49">Unit price + China domestic freight</text>
    <rect x="0" y="232" width="760" height="46" rx="13" fill="#e5f4e6"/><text x="24" y="263" font-size="23" font-weight="800" fill="#1d4f2c">5. TERMS</text><text x="220" y="263" font-size="22" fill="#3f5d49">Returns, substitutions and seller confirmation</text>
  </g>

  <g transform="translate(1020 330)">
    <rect x="0" y="0" width="425" height="345" rx="28" fill="#eaf6eb" stroke="#8cca91" stroke-width="3"/>
    <rect x="58" y="42" width="309" height="68" rx="18" fill="#173f25"/><text x="212" y="85" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">EXPERT BUY</text>
    <rect x="82" y="136" width="260" height="145" rx="22" fill="#fff" stroke="#b9ddbd" stroke-width="3"/>
    <circle cx="122" cy="176" r="17" fill="#3fa13b"/><path d="M113 176l7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="154" y="183" font-size="21" font-weight="700" fill="#173f25">No guessing</text>
    <circle cx="122" cy="222" r="17" fill="#3fa13b"/><path d="M113 222l7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="154" y="229" font-size="21" font-weight="700" fill="#173f25">One final variant</text>
    <circle cx="122" cy="268" r="17" fill="#3fa13b"/><path d="M113 268l7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="154" y="275" font-size="21" font-weight="700" fill="#173f25">Seller terms saved</text>
  </g>

  <rect x="95" y="714" width="1410" height="86" rx="24" fill="#173f25"/>
  <g font-size="21" font-weight="700" fill="#fff">
    <text x="140" y="765">Yupoo</text><text x="390" y="765">WeChat</text><text x="645" y="765">Weidian</text><text x="900" y="765">Failed Parser</text><text x="1205" y="765">My Order • Add Note</text>
  </g>
  <g fill="#63c353"><circle cx="325" cy="757" r="6"/><circle cx="585" cy="757" r="6"/><circle cx="835" cy="757" r="6"/><circle cx="1148" cy="757" r="6"/></g>
</g>
</svg>