<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CSSBuy Order Status Guide 2026</title>
<desc id="desc">Green and white CSSBuy buyer guide artwork showing payment, agent purchase, seller dispatch and warehouse receiving stages.</desc>
<defs>
  <linearGradient id="bgStatus" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ef"/><stop offset="1" stop-color="#dff2e2"/></linearGradient>
  <linearGradient id="greenStatus" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56b63b"/><stop offset="1" stop-color="#278c35"/></linearGradient>
  <filter id="shadowStatus" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173e28" flood-opacity=".14"/></filter>
</defs>
<rect width="1600" height="900" rx="36" fill="url(#bgStatus)"/>
<circle cx="1455" cy="92" r="185" fill="#fff" opacity=".42"/><circle cx="115" cy="830" r="170" fill="#fff" opacity=".32"/>
<rect x="54" y="52" width="1492" height="796" rx="34" fill="#fff" filter="url(#shadowStatus)"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="100" y="126" font-size="54" font-weight="800" fill="#0d3b22">CSSBuy</text>
  <rect x="342" y="84" width="360" height="54" rx="27" fill="url(#greenStatus)"/><text x="522" y="121" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">ORDER GUIDE 2026</text>
  <text x="100" y="222" font-size="68" font-weight="900" fill="#10291a">From Purchased to In Warehouse</text>
  <text x="100" y="272" font-size="30" fill="#486052">Identify the owner, evidence and next action at every order stage</text>

  <g transform="translate(95 335)">
    <rect width="330" height="330" rx="28" fill="#f6fbf6" stroke="#98d29b" stroke-width="3"/>
    <circle cx="50" cy="50" r="25" fill="#3fa13b"/><text x="50" y="59" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">1</text>
    <text x="90" y="59" font-size="27" font-weight="800" fill="#173f25">PAID</text>
    <rect x="74" y="115" width="182" height="148" rx="20" fill="#fff" stroke="#6daf72" stroke-width="4"/>
    <rect x="91" y="142" width="148" height="28" rx="6" fill="#dff0df"/>
    <circle cx="112" cy="214" r="18" fill="#3fa13b"/><path d="M103 214l7 8 13-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M144 214h78" stroke="#9fc9a2" stroke-width="6" stroke-linecap="round"/>
    <text x="165" y="314" text-anchor="middle" font-size="20" font-weight="700" fill="#486052">Check every order field</text>
  </g>

  <g transform="translate(455 335)">
    <rect width="330" height="330" rx="28" fill="#eef8ef" stroke="#98d29b" stroke-width="3"/>
    <circle cx="50" cy="50" r="25" fill="#3fa13b"/><text x="50" y="59" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">2</text>
    <text x="90" y="59" font-size="27" font-weight="800" fill="#173f25">PURCHASED</text>
    <path d="M82 139h166l-17 113H103z" fill="#fff" stroke="#3fa13b" stroke-width="4"/>
    <path d="M114 139l18-37h66l18 37" fill="none" stroke="#3fa13b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="134" cy="273" r="13" fill="#173f25"/><circle cx="209" cy="273" r="13" fill="#173f25"/>
    <path d="M132 182h67M132 214h90" stroke="#9fc9a2" stroke-width="6" stroke-linecap="round"/>
    <text x="165" y="314" text-anchor="middle" font-size="20" font-weight="700" fill="#486052">Seller owns the next move</text>
  </g>

  <g transform="translate(815 335)">
    <rect width="330" height="330" rx="28" fill="#f6fbf6" stroke="#98d29b" stroke-width="3"/>
    <circle cx="50" cy="50" r="25" fill="#3fa13b"/><text x="50" y="59" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">3</text>
    <text x="90" y="59" font-size="27" font-weight="800" fill="#173f25">SHIPPED</text>
    <rect x="60" y="164" width="147" height="91" rx="12" fill="#dff0df" stroke="#3fa13b" stroke-width="4"/>
    <path d="M207 185h48l34 43v27h-82z" fill="#fff" stroke="#3fa13b" stroke-width="4"/>
    <circle cx="111" cy="263" r="19" fill="#173f25"/><circle cx="246" cy="263" r="19" fill="#173f25"/>
    <path d="M83 130h133M109 103h82" stroke="#9fc9a2" stroke-width="7" stroke-linecap="round"/>
    <text x="165" y="314" text-anchor="middle" font-size="20" font-weight="700" fill="#486052">Follow carrier evidence</text>
  </g>

  <g transform="translate(1175 335)">
    <rect width="330" height="330" rx="28" fill="#eaf6eb" stroke="#8cca91" stroke-width="3"/>
    <circle cx="50" cy="50" r="25" fill="#3fa13b"/><text x="50" y="59" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">4</text>
    <text x="90" y="59" font-size="27" font-weight="800" fill="#173f25">WAREHOUSE</text>
    <path d="M61 151l104-57 104 57v121H61z" fill="#fff" stroke="#3fa13b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M61 151h208M93 151v121M237 151v121" stroke="#6daf72" stroke-width="4"/>
    <rect x="125" y="194" width="80" height="78" fill="#dff0df" stroke="#3fa13b" stroke-width="4"/>
    <path d="M125 218h80M165 194v78" stroke="#3fa13b" stroke-width="3"/>
    <text x="165" y="314" text-anchor="middle" font-size="20" font-weight="700" fill="#486052">Inspect before release</text>
  </g>

  <rect x="95" y="714" width="1410" height="86" rx="24" fill="#173f25"/>
  <g font-size="21" font-weight="700" fill="#fff"><text x="140" y="765">Fix the Record</text><text x="450" y="765">Name the Owner</text><text x="790" y="765">Read the Evidence</text><text x="1135" y="765">Set a Review Time</text><text x="1415" y="765">Act</text></g>
  <g fill="#63c353"><circle cx="390" cy="757" r="6"/><circle cx="725" cy="757" r="6"/><circle cx="1060" cy="757" r="6"/><circle cx="1370" cy="757" r="6"/></g>
</g>
</svg>

