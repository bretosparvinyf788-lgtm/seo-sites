name: Apply LitBuy hydration fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-litbuy-hydration-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install delta utility
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Apply and validate hydration fix
        run: |
          test "$(sha256sum litbuyvip.org/index.html | cut -d' ' -f1)" = "e717d7e198e925d25f5e930e0ff306bbb5b3c6f9f227f8819538dfeeb1b0aa2e"
          zstd -d --patch-from=litbuyvip.org/index.html litbuyvip.org/.scheduled/2026-08-12-hydration/index.delta.zst -o /tmp/litbuy-index.html
          test "$(sha256sum /tmp/litbuy-index.html | cut -d' ' -f1)" = "630a96c42d960cbe719065669aeaf2837fbd8412aeb0739ba9b6bdb5b018ea4c"
          mv /tmp/litbuy-index.html litbuyvip.org/index.html
          python - <<'PY'
          import json, re
          from pathlib import Path
          source = Path("litbuyvip.org/index.html").read_text()
          article, _ = json.JSONDecoder().raw_decode(source, source.index("wu=[") + 4)
          body = article["intro"] + " " + " ".join(p for section in article["sections"] for p in section["paragraphs"])
          assert len(re.findall(r"\b[\w’'-]+\b", body)) == 1762
          assert not re.search(r"https?://|www\.|\.com\b|\.org\b", body, re.I)
          assert "window.__LITBUY_ENTRY_PATH__=location.pathname" in source
          assert 'history.replaceState(null,"","/"+location.search+location.hash)' in source
          assert "let R=window.__LITBUY_ENTRY_PATH__||location.pathname" in source
          assert source.count("litbuy-parcel-preflight-audit") == 6
          PY

      - name: Commit hydration fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add litbuyvip.org/index.html
          git rm -r litbuyvip.org/.scheduled/2026-08-12-hydration
          git rm .github/workflows/apply-litbuy-hydration-fix.yml
          git commit -m "Stabilize LitBuy guide hydration"
          git pull --rebase origin main
          git push origin main
