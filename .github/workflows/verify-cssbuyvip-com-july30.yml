name: Diagnose cssbuyvip.com August 3 Production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-cssbuyvip-com-july30.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch cache-busted production pages
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          article='https://cssbuyvip.com/guides/cssbuy-delivery-day-evidence-protocol-2026/?verify='"$stamp"
          home='https://cssbuyvip.com/?verify='"$stamp"
          archive='https://cssbuyvip.com/all-seo-articles/?verify='"$stamp"
          sitemap='https://cssbuyvip.com/sitemap.xml?verify='"$stamp"
          for pair in "article:$article" "home:$home" "archive:$archive" "sitemap:$sitemap"; do
            name=${pair%%:*}
            url=${pair#*:}
            code=$(curl -L -sS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -D "/tmp/$name.headers" -o "/tmp/$name.body" -w '%{http_code}' --max-time 30 "$url" || true)
            echo "${name}_http=$code"
            echo "--- ${name} headers ---"
            grep -Ei '^(date|age|cache-control|cf-cache-status|cf-ray|etag|last-modified|server|content-type):' "/tmp/$name.headers" || true
          done
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          article = Path('/tmp/article.body').read_text(encoding='utf-8', errors='ignore')
          home = Path('/tmp/home.body').read_text(encoding='utf-8', errors='ignore')
          archive = Path('/tmp/archive.body').read_text(encoding='utf-8', errors='ignore')
          sitemap = Path('/tmp/sitemap.body').read_text(encoding='utf-8', errors='ignore')
          def title(html):
              m = re.search(r'<title>(.*?)</title>', html, re.I|re.S)
              return m.group(1).strip() if m else None
          latest = re.search(r'<section id="articles" class="panel">([\s\S]*?)</section>', home, re.I)
          latest_html = latest.group(1) if latest else ''
          data = {
            'article_title': title(article),
            'article_has_new_h1': 'CSSBuy Delivery-Day Evidence Protocol: Inspect, Record and Resolve Parcel Problems' in article,
            'article_details_count': article.count('<details>'),
            'article_length': len(article),
            'home_latest_slugs': re.findall(r'href="/guides/([^/"]+)/"', latest_html),
            'archive_has_new_slug': 'cssbuy-delivery-day-evidence-protocol-2026' in archive,
            'sitemap_has_new_slug': 'cssbuy-delivery-day-evidence-protocol-2026' in sitemap,
          }
          print('CACHE_BUST_DIAGNOSTIC=' + json.dumps(data, sort_keys=True))
          if not all([
            data['article_has_new_h1'],
            data['article_details_count'] == 12,
            data['archive_has_new_slug'],
            data['sitemap_has_new_slug'],
            data['home_latest_slugs'] == ['cssbuy-delivery-day-evidence-protocol-2026','cssbuy-restricted-item-route-filter-2026','cssbuy-ship-for-me-intake-manifest-2026'],
          ]):
            raise SystemExit('Production remains on an older deployment')
          print('PRODUCTION_STATUS=PASSED')
          PY
