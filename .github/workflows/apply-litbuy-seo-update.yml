name: Apply LitBuy SEO update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-litbuy-seo-update.yml

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install delta utility
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Apply and validate LitBuy update
        run: |
          test "$(sha256sum litbuyvip.org/index.html | cut -d' ' -f1)" = "2e9fe5d259d7be22abc76c158d515f5532ca3dcb858e344a39f714b16358c193"
          zstd -d --patch-from=litbuyvip.org/index.html litbuyvip.org/.scheduled/2026-08-12/index.delta.zst -o /tmp/litbuy-index.html
          test "$(sha256sum /tmp/litbuy-index.html | cut -d' ' -f1)" = "c84f4655c8bac6e3ce1b186802fc5ed39f365d05902a0f50941dc3dd0a46a9be"
          mv /tmp/litbuy-index.html litbuyvip.org/index.html
          cp litbuyvip.org/.scheduled/2026-08-12/sitemap.xml litbuyvip.org/sitemap.xml
          mkdir -p litbuyvip.org/assets
          cp litbuyvip.org/.scheduled/2026-08-12/cover.webp litbuyvip.org/assets/litbuy-parcel-preflight-audit.webp
          python - <<'PY'
          import json, re
          from pathlib import Path
          source = Path("litbuyvip.org/index.html").read_text()
          article, _ = json.JSONDecoder().raw_decode(source, source.index("wu=[") + 4)
          body = article["intro"] + " " + " ".join(p for section in article["sections"] for p in section["paragraphs"])
          words = re.findall(r"\b[\w’'-]+\b", body)
          assert article["slug"] == "litbuy-parcel-preflight-audit"
          assert len(words) == 1762
          assert not re.search(r"https?://|www\.|\.com\b|\.org\b", body, re.I)
          assert "children:wu.slice(0,3).map" in source
          assert source.count("litbuy-parcel-preflight-audit") == 6
          assert Path("litbuyvip.org/assets/litbuy-parcel-preflight-audit.webp").stat().st_size == 72700
          PY

      - name: Commit published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add litbuyvip.org/index.html litbuyvip.org/sitemap.xml litbuyvip.org/assets/litbuy-parcel-preflight-audit.webp
          git rm -r litbuyvip.org/.scheduled/2026-08-12
          git rm .github/workflows/apply-litbuy-seo-update.yml
          git commit -m "Publish LitBuy parcel preflight guide"
          git pull --rebase origin main
          git push origin main
