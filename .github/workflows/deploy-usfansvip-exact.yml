name: Deploy USFansVIP folder

on:
  pull_request:
    branches: [main]
    paths:
      - '.usfansvip-logo/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Update only usfansvip.shop
        shell: bash
        run: |
          set -euo pipefail
          cat .usfansvip-logo/logo.part* | base64 --decode > /tmp/usfans-logo-512.png
          echo '30142ed349e73f5df5a2c3bee3fbc240df294075809d2a42eda43e484e560dea  /tmp/usfans-logo-512.png' | sha256sum -c -
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          root = Path('usfansvip.shop')
          assets = root / 'assets'
          assets.mkdir(parents=True, exist_ok=True)
          logo_src = Path('/tmp/usfans-logo-512.png')

          css = '''
          .site-logo{
            width:42px;
            height:42px;
            display:block;
            object-fit:contain;
            border-radius:14px;
            flex:0 0 42px;
          }
          @media(max-width:680px){
            .site-logo{width:36px;height:36px;flex-basis:36px;border-radius:12px}
          }
          '''
          favicon_links = '<link href="/assets/favicon.ico" rel="icon"/><link href="/assets/favicon-32.png" rel="icon" type="image/png"/><link href="/assets/apple-touch-icon.png" rel="apple-touch-icon"/>'
          old_mark = '<span class="brand-mark">UV</span>'
          new_mark = '<img alt="USFansVIP logo" class="site-logo" height="42" src="/assets/usfans-logo-128.png" width="42"/>'
          languages = {'ar','de','es','fr','ja','ko','pt','zh'}

          html_files = sorted(root.rglob('*.html'))
          if len(html_files) != 46:
              raise SystemExit(f'Expected 46 HTML files, found {len(html_files)}')

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              if '.site-logo{' not in text:
                  text = text.replace('</style>', css + '</style>', 1)
              if '/assets/favicon.ico' not in text:
                  text = text.replace('</head>', favicon_links + '</head>', 1)
              rel = path.relative_to(root)
              is_home = rel == Path('index.html') or (len(rel.parts) == 2 and rel.name == 'index.html' and rel.parts[0] in languages)
              if is_home:
                  if old_mark in text:
                      text = text.replace(old_mark, new_mark, 1)
                  if new_mark not in text:
                      raise SystemExit(f'Logo marker missing in {path}')
              path.write_text(text, encoding='utf-8')

          shutil.copyfile(logo_src, assets / 'usfans-logo-512.png')
          base = Image.open(logo_src).convert('RGBA')
          sizes = {
              'usfans-logo-128.png': (128,128),
              'favicon-16.png': (16,16),
              'favicon-32.png': (32,32),
              'favicon-48.png': (48,48),
              'favicon-64.png': (64,64),
              'favicon-180.png': (180,180),
              'apple-touch-icon.png': (180,180),
              'favicon-192.png': (192,192),
              'favicon-512.png': (512,512),
          }
          for name, size in sizes.items():
              base.resize(size, Image.Resampling.LANCZOS).save(assets / name, optimize=True)
          base.save(assets / 'favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64)])

          if sum('/assets/favicon.ico' in p.read_text(encoding='utf-8') for p in html_files) != 46:
              raise SystemExit('Not all HTML pages contain favicon links')
          homepages = [root/'index.html'] + [root/lang/'index.html' for lang in sorted(languages)]
          if not all('/assets/usfans-logo-128.png' in p.read_text(encoding='utf-8') for p in homepages):
              raise SystemExit('Not all homepages contain the logo')
          if len([p for p in root.rglob('*') if p.is_file()]) != 62:
              raise SystemExit('Final site file count is not 62')
          PY
          rm -rf .usfansvip-logo
          rm -f .github/workflows/deploy-usfansvip-exact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A usfansvip.shop .usfansvip-logo .github/workflows/deploy-usfansvip-exact.yml
          git commit -m 'Deploy USFansVIP multilingual site with updated logo'
          git push origin HEAD:main
