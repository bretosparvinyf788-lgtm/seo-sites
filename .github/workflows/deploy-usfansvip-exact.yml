name: Deploy USFansVIP folder

on:
  pull_request:
    branches: [main]
    paths:
      - '.usfansvip-logo/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Build and verify usfansvip.shop
        shell: bash
        run: |
          set -euo pipefail
          cat .usfansvip-logo/logo.part* | base64 --decode > /tmp/usfans-logo-128.png
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          root = Path('usfansvip.shop')
          assets = root / 'assets'
          assets.mkdir(parents=True, exist_ok=True)
          logo = Path('/tmp/usfans-logo-128.png')
          image = Image.open(logo).convert('RGBA')
          if image.size != (128, 128):
              raise SystemExit(f'Unexpected logo size: {image.size}')

          css = '''
          .site-logo{
            width:42px;height:42px;display:block;object-fit:contain;
            border-radius:14px;flex:0 0 42px;
          }
          @media(max-width:680px){
            .site-logo{width:36px;height:36px;flex-basis:36px;border-radius:12px}
          }
          '''
          icons = '<link href="/assets/favicon.ico" rel="icon"/><link href="/assets/favicon-32.png" rel="icon" type="image/png"/><link href="/assets/apple-touch-icon.png" rel="apple-touch-icon"/>'
          old_logo = '<span class="brand-mark">UV</span>'
          new_logo = '<img alt="USFansVIP logo" class="site-logo" height="42" src="/assets/usfans-logo-128.png" width="42"/>'
          languages = ('ar','de','es','fr','ja','ko','pt','zh')
          html = sorted(root.rglob('*.html'))
          if len(html) != 46:
              raise SystemExit(f'Expected 46 HTML files, found {len(html)}')

          for path in html:
              text = path.read_text(encoding='utf-8')
              if '.site-logo{' not in text:
                  if '</style>' not in text:
                      raise SystemExit(f'Missing </style>: {path}')
                  text = text.replace('</style>', css + '</style>', 1)
              if '/assets/favicon.ico' not in text:
                  if '</head>' not in text:
                      raise SystemExit(f'Missing </head>: {path}')
                  text = text.replace('</head>', icons + '</head>', 1)
              rel = path.relative_to(root)
              is_home = rel == Path('index.html') or (len(rel.parts) == 2 and rel.name == 'index.html' and rel.parts[0] in languages)
              if is_home and old_logo in text:
                  text = text.replace(old_logo, new_logo, 1)
              path.write_text(text, encoding='utf-8')

          shutil.copyfile(logo, assets / 'usfans-logo-128.png')
          sizes = {
              'usfans-logo-512.png': (512,512),
              'favicon-16.png': (16,16), 'favicon-32.png': (32,32),
              'favicon-48.png': (48,48), 'favicon-64.png': (64,64),
              'favicon-180.png': (180,180), 'apple-touch-icon.png': (180,180),
              'favicon-192.png': (192,192), 'favicon-512.png': (512,512),
          }
          for name, size in sizes.items():
              image.resize(size, Image.Resampling.LANCZOS).save(assets / name, optimize=True)
          image.save(assets / 'favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64)])

          homepages = [root / 'index.html', *[root / lang / 'index.html' for lang in languages]]
          checks = {
              'html_count': len(html) == 46,
              'all_favicons': all('/assets/favicon.ico' in p.read_text(encoding='utf-8') for p in html),
              'all_home_logos': all('/assets/usfans-logo-128.png' in p.read_text(encoding='utf-8') for p in homepages),
              'logo_128': (assets / 'usfans-logo-128.png').is_file(),
              'logo_512': (assets / 'usfans-logo-512.png').is_file(),
              'favicon': (assets / 'favicon.ico').is_file(),
              'sitemap': (root / 'sitemap.xml').is_file(),
              'robots': (root / 'robots.txt').is_file(),
          }
          print('FINAL_FILE_COUNT', sum(1 for p in root.rglob('*') if p.is_file()))
          for key, value in checks.items():
              print(key, value)
          failed = [key for key, value in checks.items() if not value]
          if failed:
              raise SystemExit('Verification failed: ' + ', '.join(failed))
          print('USFANSVIP_SITE_VERIFICATION=PASSED')
          PY

      - name: Commit only usfansvip.shop
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .usfansvip-logo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A usfansvip.shop .usfansvip-logo
          git commit -m 'Deploy USFansVIP multilingual site with updated logo'
          git push origin HEAD:main
