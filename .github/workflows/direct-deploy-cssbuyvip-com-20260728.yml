name: Direct deploy cssbuyvip.com July 28 guide

on:
  push:
    branches: [main]
    paths:
      - '.github/cssbuy-direct-deploy-20260728.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-deploy-cssbuyvip-com-20260728
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve Cloudflare credentials and project
        id: cloudflare
        env:
          TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.CF_API_TOKEN }}
          ACCOUNT_PRIMARY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_FALLBACK: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="$TOKEN_PRIMARY"
          [ -n "$TOKEN" ] || TOKEN="$TOKEN_FALLBACK"
          ACCOUNT="$ACCOUNT_PRIMARY"
          [ -n "$ACCOUNT" ] || ACCOUNT="$ACCOUNT_FALLBACK"
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Pages API credentials are not available in repository secrets."
            exit 0
          fi
          RESPONSE=$(curl -fsS -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects")
          PROJECT=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; data=json.load(sys.stdin); matches=[]
for p in data.get("result",[]):
    domains=[str(x).lower() for x in p.get("domains",[])]
    if "cssbuyvip.com" in domains:
        matches.append(p.get("name"))
if len(matches)!=1:
    raise SystemExit("Expected exactly one Pages project for cssbuyvip.com; found: "+repr(matches))
print(matches[0])')
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "Resolved Cloudflare Pages project: $PROJECT"

      - name: Deploy current cssbuyvip.com directory to production
        id: deploy
        if: steps.cloudflare.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account }}
          PROJECT_NAME: ${{ steps.cloudflare.outputs.project }}
        run: |
          npx --yes wrangler@latest pages deploy cssbuyvip.com --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true

      - name: Verify production after direct deployment
        id: verify
        if: steps.cloudflare.outputs.available == 'true'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import html as html_lib
          import re
          import time
          import urllib.request
          from pathlib import Path

          slug = 'cssbuy-ship-for-me-intake-manifest-2026'
          link = f'/guides/{slug}/'
          article_url = 'https://cssbuyvip.com' + link
          pages_urls = {
              'article': article_url,
              'home': 'https://cssbuyvip.com/',
              'archive': 'https://cssbuyvip.com/all-seo-articles/',
              'sitemap': 'https://cssbuyvip.com/sitemap.xml',
          }
          expected_title = 'CSSBuy Ship For Me Guide 2026 | Tracking & Warehouse Intake'

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  'User-Agent':'CSSBuyVip-Production-Check/3.0',
                  'Cache-Control':'no-cache',
                  'Pragma':'no-cache',
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.status, response.read().decode('utf-8','replace')

          def words(page):
              match=re.search(r'<article\b[^>]*>([\s\S]*?)</article>',page,re.I)
              text=match.group(1) if match else ''
              text=re.sub(r'<script\b[\s\S]*?</script>',' ',text,flags=re.I)
              text=re.sub(r'<style\b[\s\S]*?</style>',' ',text,flags=re.I)
              text=re.sub(r'<[^>]+>',' ',text)
              return len(re.findall(r"\b[\w’'-]+\b",html_lib.unescape(text)))

          final=[]
          passed=None
          for attempt in range(1,25):
              errors=[]; pages={}; stamp='?direct=20260728-'+str(attempt)
              for name,url in pages_urls.items():
                  try:
                      status,body=fetch(url+stamp); pages[name]=body
                      if status!=200: errors.append(f'{name} HTTP {status}')
                  except Exception as exc: errors.append(f'{name} fetch error: {exc}')
              article=pages.get('article',''); home=pages.get('home',''); archive=pages.get('archive',''); sitemap=pages.get('sitemap','')
              count=words(article)
              if f'<title>{expected_title}</title>' not in article: errors.append('article title mismatch')
              if 'CSSBuy Ship For Me Intake Manifest' not in article: errors.append('article body marker missing')
              if article.count('<details>')<12 or 'CSSBuy Ship For Me FAQ' not in article: errors.append('FAQ incomplete')
              if not 1500<=count<=2000: errors.append(f'visible word count {count}')
              forbidden=('Official sources checked','<h2>Sources</h2>','<h2>References</h2>','资料来源','核实来源','source-box')
              if any(x in article for x in forbidden): errors.append('public source/reference block detected')
              if 'Best CSSBuy Spreadsheet for QC-ready finds' in article: errors.append('homepage fallback detected')
              if home.count('<a class="article"')!=3: errors.append('homepage latest count is not 3')
              if home.find(link)==-1 or home.find(link)>home.find('/guides/cssbuy-buy-for-me-vs-ship-for-me-2026/'): errors.append('homepage newest link/order invalid')
              if archive.find(link)==-1 or archive.find(link)>archive.find('/guides/cssbuy-buy-for-me-vs-ship-for-me-2026/'): errors.append('archive newest link/order invalid')
              if 'https://cssbuyvip.com'+link not in sitemap: errors.append('sitemap missing final URL')
              if not errors:
                  passed=(attempt,count); break
              final=errors; print('Attempt',attempt,'failed:','; '.join(errors)); time.sleep(15)

          report=Path('cssbuyvip.com/verification/2026-07-28-deploy.txt'); report.parent.mkdir(parents=True,exist_ok=True)
          if passed:
              attempt,count=passed
              report.write_text(
                  'PASS\n'
                  f'Article URL: {article_url}\n'
                  'Article HTTP: 200\n'
                  f'Visible article words: {count}\n'
                  'FAQ entries: 12 or more\n'
                  'Homepage HTTP: 200 and exactly 3 latest cards\n'
                  'Archive HTTP: 200\n'
                  'Sitemap HTTP: 200\n'
                  'Final permanent URL is present newest-first on homepage and archive and is listed in sitemap.\n'
                  'No homepage fallback or public source/reference block detected.\n'
                  f'Passed on polling attempt: {attempt}\n',encoding='utf-8')
          else:
              report.write_text('FAIL\n'+'\n'.join(final)+'\n',encoding='utf-8'); raise SystemExit(1)
          print(report.read_text())
          PY

      - name: Record blocked deployment when credentials are missing
        if: steps.cloudflare.outputs.available != 'true'
        run: |
          mkdir -p cssbuyvip.com/verification
          cat > cssbuyvip.com/verification/2026-07-28-deploy.txt <<'EOF'
          BLOCKED
          Cloudflare Pages API credentials were not available in GitHub repository secrets under CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID or CF_API_TOKEN/CF_ACCOUNT_ID.
          GitHub contains the final static article, homepage, archive, sitemap and redirects, but production deployment cannot be forced from this workflow without Cloudflare credentials.
          EOF

      - name: Commit deployment verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cssbuyvip.com/verification/2026-07-28-deploy.txt
          if git diff --cached --quiet; then
            echo "Deployment report unchanged"
          else
            git commit -m "Record CSSBuy July 28 direct deployment result"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi

      - name: Fail if production verification did not pass
        if: steps.cloudflare.outputs.available == 'true' && steps.verify.outcome == 'failure'
        run: exit 1
