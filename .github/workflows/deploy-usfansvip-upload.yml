name: Deploy USFansVIP uploaded site

on:
  push:
    branches: [main]
    paths:
      - '.usfansvip-upload/**'

permissions:
  contents: write

jobs:
  deploy-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Rebuild uploaded site
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow==12.2.0
          cat .usfansvip-upload/logo.part* | base64 --decode > /tmp/usfans-logo-512.png
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json, shutil

          root = Path('usfansvip.shop')
          logo_src = Path('/tmp/usfans-logo-512.png')
          assets = root / 'assets'
          assets.mkdir(parents=True, exist_ok=True)

          css = '''
          .site-logo{
            width:42px;
            height:42px;
            display:block;
            object-fit:contain;
            border-radius:14px;
            flex:0 0 42px;
          }
          @media(max-width:680px){
            .site-logo{width:36px;height:36px;flex-basis:36px;border-radius:12px}
          }
          '''
          favicons = '<link href="/assets/favicon.ico" rel="icon"/><link href="/assets/favicon-32.png" rel="icon" type="image/png"/><link href="/assets/apple-touch-icon.png" rel="apple-touch-icon"/>'
          old_mark = '<span class="brand-mark">UV</span>'
          new_mark = '<img alt="USFansVIP logo" class="site-logo" height="42" src="/assets/usfans-logo-128.png" width="42"/>'

          html_files = sorted(root.rglob('*.html'))
          if len(html_files) != 46:
              raise SystemExit(f'Expected 46 HTML files, found {len(html_files)}')

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              if '.site-logo{' not in text:
                  if '</style>' not in text:
                      raise SystemExit(f'Missing </style> in {path}')
                  text = text.replace('</style>', css + '</style>', 1)
              if '/assets/favicon.ico' not in text:
                  if '</head>' not in text:
                      raise SystemExit(f'Missing </head> in {path}')
                  text = text.replace('</head>', favicons + '</head>', 1)
              rel = path.relative_to(root)
              if rel == Path('index.html') or (len(rel.parts) == 2 and rel.name == 'index.html' and rel.parts[0] in {'ar','de','es','fr','ja','ko','pt','zh'}):
                  if old_mark in text:
                      text = text.replace(old_mark, new_mark, 1)
                  elif new_mark not in text:
                      raise SystemExit(f'Missing homepage brand marker in {path}')
              path.write_text(text, encoding='utf-8')

          base = Image.open(logo_src).convert('RGBA')
          base.save(assets / 'usfans-logo-512.png', optimize=True)
          sizes = {
              'usfans-logo-128.png': (128,128),
              'favicon-16.png': (16,16),
              'favicon-32.png': (32,32),
              'favicon-48.png': (48,48),
              'favicon-64.png': (64,64),
              'favicon-180.png': (180,180),
              'apple-touch-icon.png': (180,180),
              'favicon-192.png': (192,192),
              'favicon-512.png': (512,512),
          }
          for name, size in sizes.items():
              base.resize(size, Image.Resampling.LANCZOS).save(assets / name, optimize=True)
          base.save(assets / 'favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64)])

          for marker in root.glob('.upload-test-marker*'):
              marker.unlink()

