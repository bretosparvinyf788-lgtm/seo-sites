          actual = {}
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  actual[str(p.relative_to(root))] = hashlib.sha256(p.read_bytes()).hexdigest()
          missing = sorted(set(manifest)-set(actual))
          extra = sorted(set(actual)-set(manifest))
          bad = sorted(k for k in set(manifest)&set(actual) if manifest[k] != actual[k])
          if missing or extra or bad:
              print('MISSING', missing)
              print('EXTRA', extra)
              print('HASH_MISMATCH', bad)
              raise SystemExit('Generated site does not exactly match uploaded package')
          print(f'VERIFIED_FILES={len(actual)}')
          PY
          rm -rf .usfansvip-upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A usfansvip.shop .usfansvip-upload
          git commit -m 'Deploy USFansVIP multilingual site with updated logo'
          git push origin HEAD:main
