name: CSSBuyVIP navigation hotfix v5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write navigation spacing into homepage HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cssbuyvip.net/index.html')
          html = path.read_text(encoding='utf-8')
          start = html.find('<nav class="desktop-nav"')
          end = html.find('</nav>', start)
          if start == -1 or end == -1:
              raise SystemExit('Desktop navigation not found')
          end += len('</nav>')

          nav = '''<nav class="desktop-nav" aria-label="Primary navigation" style="display:flex!important;align-items:center!important;justify-content:center!important;gap:22px!important;white-space:nowrap!important;flex-shrink:0!important">
      <a class="nav-link" href="w2c/" data-i18n="nav.w2c" style="display:inline-block!important;margin:0!important;padding:8px 0!important;white-space:nowrap!important">W2C Finds</a>
      <a class="nav-link" href="qc-guide/" data-i18n="nav.qc" style="display:inline-block!important;margin:0!important;padding:8px 0!important;white-space:nowrap!important">QC Guide</a>
      <a class="nav-link" href="shipping-guide/" data-i18n="nav.shipping" style="display:inline-block!important;margin:0!important;padding:8px 0!important;white-space:nowrap!important">Shipping</a>
      <a class="nav-link" href="buyer-guides/" data-i18n="nav.guides" style="display:inline-block!important;margin:0!important;padding:8px 0!important;white-space:nowrap!important">Buyer Guides</a>
      <a class="nav-link" href="index.html#faq" data-i18n="nav.faq" style="display:inline-block!important;margin:0!important;padding:8px 0!important;white-space:nowrap!important">FAQ</a>
    </nav>'''

          html = html[:start] + nav + html[end:]
          html = html.replace('content="2026-07-30-category-links-v2"', 'content="2026-07-30-nav-hotfix-v5"', 1)
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit repaired navigation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cssbuyvip.net/index.html
          if git diff --cached --quiet; then
            echo "Navigation already repaired"
          else
            git commit -m "Fix CSSBuyVIP navigation spacing directly in HTML"
            git push
          fi
