name: Sync latest CSSBuy VIP source
on:
  push:
    branches: [main]
    paths: ['.source-sync/cssbuyvip/**', '.github/workflows/cssbuyvip-source-sync.yml']
permissions:
  contents: write
concurrency:
  group: cssbuyvip-source-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify and restore complete source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil, tarfile, tempfile, os
          parts=sorted(Path('.source-sync/cssbuyvip').glob('part-*'))
          assert len(parts)==37, 'Missing source chunks'
          archive=Path(os.environ['RUNNER_TEMP'])/'cssbuyvip-source.tar.gz'
          with archive.open('wb') as output:
              for part in parts: output.write(part.read_bytes())
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='44c6ea909aab892f57426b653c59b0ffa8b702afec0bf805077855ba38265df6', 'Archive checksum mismatch'
          destination=Path(tempfile.mkdtemp(prefix='cssbuyvip-',dir=os.environ['RUNNER_TEMP']))
          with tarfile.open(archive) as source: source.extractall(destination,filter='data')
          assert sum(p.is_file() for p in destination.rglob('*'))==9721, 'Source count mismatch'
          assert (destination/'dist/index.html').is_file()
          assert (destination/'verify_site.py').is_file()
          target=Path('cssbuyvip.com')
          if target.exists(): shutil.rmtree(target)
          shutil.move(str(destination),target)
          PY
      - name: Build and verify all product routes
        working-directory: cssbuyvip.com
        run: |
          python build.py
          node --check dist/app.js
          node --check dist/visual-search.js
          python verify_site.py
      - name: Commit complete replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- cssbuyvip.com
          tree="$(git write-tree)"
          test "$(git rev-parse "$tree:cssbuyvip.com")" = "db44ec6f0ea671feea697c5467fbf9716278cd3b"
          git rm -r -- .source-sync/cssbuyvip
          git rm -- .github/workflows/cssbuyvip-source-sync.yml
          git commit -m "Replace cssbuyvip.com with verified latest complete site"
          git push origin HEAD:main
