name: Sugargoo issue live verification

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  verify-production:
    if: startsWith(github.event.issue.title, 'Sugargoo live verify 2026-07-31')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and validate production pages
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/sugargoo-live
          CACHE="issue-${GITHUB_RUN_ID}-$(date +%s)"
          ARTICLE='https://sugargoovip.shop/guide-sugargoo-diy-order-status.html'
          HOME='https://sugargoovip.shop/'
          GUIDES='https://sugargoovip.shop/guides.html'
          SITEMAP='https://sugargoovip.shop/sitemap.xml'
          ROBOTS='https://sugargoovip.shop/robots.txt'

          ARTICLE_STATUS=$(curl -L --connect-timeout 15 --max-time 45 -sS -o /tmp/sugargoo-live/article.html -w '%{http_code}' "${ARTICLE}?${CACHE}")
          HOME_STATUS=$(curl -L --connect-timeout 15 --max-time 45 -sS -o /tmp/sugargoo-live/home.html -w '%{http_code}' "${HOME}?${CACHE}")
          GUIDES_STATUS=$(curl -L --connect-timeout 15 --max-time 45 -sS -o /tmp/sugargoo-live/guides.html -w '%{http_code}' "${GUIDES}?${CACHE}")
          SITEMAP_STATUS=$(curl -L --connect-timeout 15 --max-time 45 -sS -o /tmp/sugargoo-live/sitemap.xml -w '%{http_code}' "${SITEMAP}?${CACHE}")
          ROBOTS_STATUS=$(curl -L --connect-timeout 15 --max-time 45 -sS -o /tmp/sugargoo-live/robots.txt -w '%{http_code}' "${ROBOTS}?${CACHE}")
          export ARTICLE_STATUS HOME_STATUS GUIDES_STATUS SITEMAP_STATUS ROBOTS_STATUS

          python3 - <<'PY'
import json, os
from datetime import datetime, timezone
from pathlib import Path
root=Path('/tmp/sugargoo-live')
def read(name):
    p=root/name
    return p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
article=read('article.html'); home=read('home.html'); guides=read('guides.html'); sitemap=read('sitemap.xml'); robots=read('robots.txt')
slug='guide-sugargoo-diy-order-status.html'
title='Sugargoo DIY Order & Order Status Guide 2026: Control the Purchase Before Warehouse'
latest_start=home.find('<section aria-labelledby="latest-guides-title"')
latest_end=home.find('<section class="finder',latest_start) if latest_start>=0 else -1
latest=home[latest_start:latest_end] if latest_start>=0 and latest_end>latest_start else ''
latest_slugs=[slug,'guide-sugargoo-packing-center-parcel.html','guide-sugargoo-returns-exchanges.html']
all_slugs=[slug,'guide-sugargoo-packing-center-parcel.html','guide-sugargoo-returns-exchanges.html','guide-shipping-cost.html','guide-qc-photos.html','guide-w2c-workflow.html']
positions=[latest.find(x) for x in latest_slugs]
archive_positions=[guides.find(x) for x in all_slugs]
checks={
 'article_title': title in article,
 'article_canonical': f'https://sugargoovip.shop/{slug}' in article,
 'article_body': 'Start with an order brief, not a shopping link' in article and 'Turn each order into a reusable record' in article,
 'article_word_count': '1,597 words' in article,
 'article_faq': 'Frequently asked questions' in article and article.count('<details>')>=8,
 'article_not_home_fallback': 'Sugargoo Spreadsheet 2026' not in article,
 'homepage_has_new_article': slug in latest,
 'homepage_exactly_three_cards': latest.count('class="latest-guide-card')==3,
 'homepage_newest_first': all(p>=0 for p in positions) and positions==sorted(positions),
 'homepage_excludes_older_articles': all(x not in latest for x in ['guide-shipping-cost.html','guide-qc-photos.html','guide-w2c-workflow.html']),
 'guides_has_all_articles': all(x in guides for x in all_slugs),
 'guides_exactly_six_cards': guides.count('<article>')==6,
 'guides_newest_first': all(p>=0 for p in archive_positions) and archive_positions==sorted(archive_positions),
 'sitemap_has_article': slug in sitemap,
 'robots_has_sitemap': 'sitemap.xml' in robots.lower(),
}
http_status={
 'article':os.environ.get('ARTICLE_STATUS','000'),
 'homepage':os.environ.get('HOME_STATUS','000'),
 'guides':os.environ.get('GUIDES_STATUS','000'),
 'sitemap':os.environ.get('SITEMAP_STATUS','000'),
 'robots':os.environ.get('ROBOTS_STATUS','000'),
}
passed=all(v=='200' for v in http_status.values()) and all(checks.values())
report={
 'status':'passed' if passed else 'failed',
 'verified_at':datetime.now(timezone.utc).isoformat(),
 'article':f'https://sugargoovip.shop/{slug}',
 'http_status':http_status,
 'checks':checks,
 'lengths':{'article':len(article),'homepage':len(home),'guides':len(guides),'sitemap':len(sitemap),'robots':len(robots)},
}
Path('sugargoovip.shop/live-verification.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
print(json.dumps(report,indent=2))
Path('/tmp/sugargoo-live/status.txt').write_text(report['status'],encoding='utf-8')
PY
          echo "status=$(cat /tmp/sugargoo-live/status.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit verification report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sugargoovip.shop/live-verification.json
          git commit -m 'Record July 31 Sugargoo production verification [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Comment verification result
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.verify.outputs.status }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Sugargoo production verification: **${status.toUpperCase()}**. See \`sugargoovip.shop/live-verification.json\` for HTTP and content checks.`
            });

      - name: Fail when checks did not pass
        if: steps.verify.outputs.status != 'passed'
        run: exit 1
