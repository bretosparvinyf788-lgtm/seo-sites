name: Sugargoo corrected payment guide publish

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: sugargoo-corrected-payment-publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.issue.title, 'Sugargoo corrected publish 2026-08-03')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate production archive
        id: generate
        shell: bash
        run: |
          set +e
          python3 sugargoovip.shop/publish_job.py > /tmp/publish.log 2>&1
          code=$?
          cat /tmp/publish.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ]

      - name: Commit production archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sugargoovip.shop/site.tar.gz sugargoovip.shop/inspection
          if ! git diff --cached --quiet; then
            git commit -m 'Publish August 3 Sugargoo payment and coupon guide'
            for n in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              [ "$n" = 5 ] && exit 1
              sleep 3
            done
          fi

      - name: Verify deployed pages
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/sugargoo-live
          status=failed
          checks='{}'
          article_status=000
          home_status=000
          guides_status=000
          sitemap_status=000
          robots_status=000
          for attempt in $(seq 1 42); do
            q="run-${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            article_status=$(curl -L --connect-timeout 15 --max-time 45 -sS -o /tmp/sugargoo-live/article.html -w '%{http_code}' "https://sugargoovip.shop/guide-sugargoo-payment-coupons-budget.html?${q}" || echo 000)
            home_status=$(curl -L --connect-timeout 15 --max-time 45 -sS -o /tmp/sugargoo-live/home.html -w '%{http_code}' "https://sugargoovip.shop/?${q}" || echo 000)
            guides_status=$(curl -L --connect-timeout 15 --max-time 45 -sS -o /tmp/sugargoo-live/guides.html -w '%{http_code}' "https://sugargoovip.shop/guides.html?${q}" || echo 000)
            sitemap_status=$(curl -L --connect-timeout 15 --max-time 45 -sS -o /tmp/sugargoo-live/sitemap.xml -w '%{http_code}' "https://sugargoovip.shop/sitemap.xml?${q}" || echo 000)
            robots_status=$(curl -L --connect-timeout 15 --max-time 45 -sS -o /tmp/sugargoo-live/robots.txt -w '%{http_code}' "https://sugargoovip.shop/robots.txt?${q}" || echo 000)
            checks=$(python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/sugargoo-live')
          def read(name):
              p=root/name
              return p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
          article=read('article.html'); home=read('home.html'); guides=read('guides.html'); sitemap=read('sitemap.xml'); robots=read('robots.txt')
          slug='guide-sugargoo-payment-coupons-budget.html'
          title='Sugargoo Payment & Coupon Guide 2026: Control the Two-Stage Checkout Without Budget Surprises'
          latest=[slug,'guide-sugargoo-diy-order-status.html','guide-sugargoo-packing-center-parcel.html']
          all_slugs=latest+['guide-sugargoo-returns-exchanges.html','guide-shipping-cost.html','guide-qc-photos.html','guide-w2c-workflow.html']
          start=home.find('<section aria-labelledby="latest-guides-title"')
          end=home.find('<section class="finder',start) if start>=0 else -1
          section=home[start:end] if start>=0 and end>start else ''
          lp=[section.find(x) for x in latest]
          gp=[guides.find(x) for x in all_slugs]
          result={
            'article_title':title in article,
            'article_canonical':f'https://sugargoovip.shop/{slug}' in article,
            'article_body':'One haul creates two checkouts, not one' in article and 'Run a final audit at both payment gates' in article,
            'article_word_count':'1,514 words' in article,
            'article_faq':'Frequently asked questions' in article and article.count('<details>')>=8,
            'article_not_home_fallback':'<h1>Sugargoo Spreadsheet 2026</h1>' not in article,
            'homepage_three_latest':section.count('class="latest-guide-card')==3 and all(p>=0 for p in lp) and lp==sorted(lp),
            'homepage_excludes_older':all(x not in section for x in all_slugs[3:]),
            'guides_all_seven':guides.count('<article>')==7 and all(p>=0 for p in gp) and gp==sorted(gp),
            'sitemap_article':slug in sitemap,
            'robots_sitemap':'sitemap.xml' in robots.lower(),
          }
          print(json.dumps(result,separators=(',',':')))
          PY
          )
            if [ "$article_status" = 200 ] && [ "$home_status" = 200 ] && [ "$guides_status" = 200 ] && [ "$sitemap_status" = 200 ] && [ "$robots_status" = 200 ] && python3 - "$checks" <<'PY'
          import json,sys
          raise SystemExit(0 if all(json.loads(sys.argv[1]).values()) else 1)
          PY
            then
              status=passed
              break
            fi
            sleep 10
          done
          export status checks article_status home_status guides_status sitemap_status robots_status attempt
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          report={
            'status':os.environ['status'],
            'verified_at':datetime.now(timezone.utc).isoformat(),
            'attempts':int(os.environ['attempt']),
            'article':'https://sugargoovip.shop/guide-sugargoo-payment-coupons-budget.html',
            'title':'Sugargoo Payment & Coupon Guide 2026: Control the Two-Stage Checkout Without Budget Surprises',
            'http_status':{
              'article':os.environ['article_status'],'homepage':os.environ['home_status'],'guides':os.environ['guides_status'],'sitemap':os.environ['sitemap_status'],'robots':os.environ['robots_status']},
            'checks':json.loads(os.environ['checks'])}
          Path('sugargoovip.shop/live-verification.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ "$status" = passed ]

      - name: Commit verification report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f sugargoovip.shop/live-verification.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sugargoovip.shop/live-verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record August 3 Sugargoo publication verification [skip ci]'
            for n in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              [ "$n" = 5 ] && exit 1
              sleep 3
            done
          fi

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const generated='${{ steps.generate.outcome }}';
            const verified='${{ steps.verify.outputs.status }}';
            const ok=generated==='success' && verified==='passed';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:ok?'Sugargoo publication: **PASSED**. The archive was published and every production HTTP/content check passed.':'Sugargoo publication: **FAILED**. Check the workflow log and live-verification.json.'});
