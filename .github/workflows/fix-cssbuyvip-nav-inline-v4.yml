name: Fix CSSBuyVIP navigation inline v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cssbuyvip-nav-inline-v4.yml'

permissions:
  contents: write

jobs:
  fix-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply robust desktop navigation spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('cssbuyvip.net/index.html')
          html = path.read_text(encoding='utf-8')

          old_nav = '<nav class="desktop-nav"><a class="nav-link" href="w2c/" data-i18n="nav.w2c">W2C Finds</a><a class="nav-link" href="qc-guide/" data-i18n="nav.qc">QC Guide</a><a class="nav-link" href="shipping-guide/" data-i18n="nav.shipping">Shipping</a><a class="nav-link" href="buyer-guides/" data-i18n="nav.guides">Buyer Guides</a><a class="nav-link" href="index.html#faq" data-i18n="nav.faq">FAQ</a></nav>'
          new_nav = '''<nav class="desktop-nav" aria-label="Primary navigation" style="display:flex;align-items:center;justify-content:center;gap:18px;white-space:nowrap;flex-shrink:0">
      <a class="nav-link" href="w2c/" data-i18n="nav.w2c" style="display:inline-flex;align-items:center;padding:8px 2px;white-space:nowrap">W2C Finds</a>
      <a class="nav-link" href="qc-guide/" data-i18n="nav.qc" style="display:inline-flex;align-items:center;padding:8px 2px;white-space:nowrap">QC Guide</a>
      <a class="nav-link" href="shipping-guide/" data-i18n="nav.shipping" style="display:inline-flex;align-items:center;padding:8px 2px;white-space:nowrap">Shipping</a>
      <a class="nav-link" href="buyer-guides/" data-i18n="nav.guides" style="display:inline-flex;align-items:center;padding:8px 2px;white-space:nowrap">Buyer Guides</a>
      <a class="nav-link" href="index.html#faq" data-i18n="nav.faq" style="display:inline-flex;align-items:center;padding:8px 2px;white-space:nowrap">FAQ</a>
    </nav>'''

          if old_nav in html:
              html = html.replace(old_nav, new_nav, 1)
          else:
              html = re.sub(r'<nav class="desktop-nav"[^>]*>.*?</nav>', new_nav, html, count=1, flags=re.S)

          hotfix = '''
<style id="desktop-nav-spacing-hotfix-v4">
@media (min-width:1121px){
  .site-header .desktop-nav{display:flex!important;align-items:center!important;justify-content:center!important;gap:18px!important;white-space:nowrap!important;flex-shrink:0!important}
  .site-header .desktop-nav .nav-link{display:inline-flex!important;align-items:center!important;padding:8px 2px!important;margin:0!important;white-space:nowrap!important;line-height:1.2!important}
}
@media (max-width:1240px) and (min-width:1121px){
  .site-header .desktop-nav{gap:12px!important}
  .site-header .desktop-nav .nav-link{font-size:11px!important;padding-left:1px!important;padding-right:1px!important}
}
</style>'''
          if 'desktop-nav-spacing-hotfix-v4' not in html:
              html = html.replace('</head>', hotfix + '\n</head>', 1)

          html = re.sub(r'assets/css/style\.css\?v=[^"\']+', 'assets/css/style.css?v=20260730-nav4', html)
          html = re.sub(r'assets/js/main\.js\?v=[^"\']+', 'assets/js/main.js?v=20260730-nav4', html)
          html = re.sub(r'<meta name="cssbuyvip-build" content="[^"]+">', '<meta name="cssbuyvip-build" content="2026-07-30-nav-spacing-v4">', html, count=1)

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cssbuyvip.net/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Apply robust CSSBuyVIP navigation spacing hotfix"
            git push
          fi
