name: Publish Hipobuy August 3 guide

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == 'Publish Hipobuy August 3 2026 guide'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch and validate Hipobuy publication
        run: python .github/scripts/publish_hipobuy_20260803.py

      - name: Commit minimal production update
        run: |
          set -euo pipefail
          git diff --check
          git diff --quiet -- hipobuyvip.shop/index.html && { echo "Expected homepage change was not produced"; exit 1; }
          git diff --quiet -- hipobuyvip.shop/_worker.js && { echo "Expected worker change was not produced"; exit 1; }
          git diff --quiet -- hipobuyvip.shop/sitemap.xml && { echo "Expected sitemap change was not produced"; exit 1; }
          rm -f .github/scripts/publish_hipobuy_20260803.py
          rm -f .github/workflows/publish-hipobuy-20260803.yml
          rm -f hipobuyvip.shop/.publish/hipobuy-2026-08-03.flag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Feature August 3 Hipobuy guide on homepage"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Comment on completion
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Hipobuy August 3 publication completed and validated.'
            });