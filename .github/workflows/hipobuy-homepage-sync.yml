name: Hipobuy homepage article sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Run Hipobuy homepage article sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Insert newest guide safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hipobuyvip.shop/index.html')
          text = path.read_text(encoding='utf-8')
          slug = 'hipobuy-parcel-scenario-planning-shipping-estimate-2026'

          start_marker = '<!-- Latest 3 buyer guides only. Keep this section capped at three cards; the full ordered list lives in #guide-hub below. -->'
          end_marker = '        <!-- More complete category cards -->'
          if start_marker not in text or end_marker not in text:
              raise SystemExit('Homepage guide markers not found; refusing to rewrite.')

          latest_block = '''<!-- Latest 3 buyer guides only. Keep this section capped at three cards; the full ordered list lives in #guide-hub below. -->
        <section class="latest-guides" id="blog">
            <div class="section-header">
                <div>
                    <div class="eyebrow">Editorial Guides</div>
                    <h2>Latest Buyer Guides &amp; Reviews</h2>
                    <p>Practical reads for reverse-purchasing more safely, cutting wasted shipping spend, and making better Hipobuy parcel decisions.</p>
                </div>
                <a class="section-link" href="#guide-hub">View All Buyer Guides →</a>
            </div>
            <div class="guide-grid">
                <article class="guide-card" data-filter-text="hipobuy shipping estimate parcel compact protected split warehouse consolidation">
                    <div class="thumb">
                        <span class="guide-badge">Shipping</span>
                        <span class="thumb-icon">📦</span>
                        <span>Scenario Planner</span>
                    </div>
                    <div class="guide-card-body">
                        <div class="guide-meta"><span>Parcel Planning</span><span>July 30, 2026</span></div>
                        <h3><a href="/guides/hipobuy-parcel-scenario-planning-shipping-estimate-2026/">Hipobuy Parcel Scenario Planning 2026</a></h3>
                        <p>Compare compact, protected, and split parcel plans with approved warehouse inventory, live route quotes, coupon checks, and a traceable checkout record.</p>
                    </div>
                </article>
                <article class="guide-card" data-filter-text="hipobuy return exchange seller evidence warehouse release">
                    <div class="thumb">
                        <span class="guide-badge">Returns</span>
                        <span class="thumb-icon">↩️</span>
                        <span>Decision Desk</span>
                    </div>
                    <div class="guide-card-body">
                        <div class="guide-meta"><span>Return &amp; Exchange</span><span>July 28, 2026</span></div>
                        <h3><a href="/guides/hipobuy-return-exchange-evidence-warehouse-release-workflow-2026/">Hipobuy Return &amp; Exchange Decision Desk 2026</a></h3>
                        <p>Build a claim-ready QC evidence pack, compare exchange and return paths, reconcile refunds, and keep unresolved goods out of an international parcel.</p>
                    </div>
                </article>
                <article class="guide-card" data-filter-text="hipobuy w2c link taobao 1688 variant seller warehouse exception">
                    <div class="thumb">
                        <span class="guide-badge">W2C Links</span>
                        <span class="thumb-icon">🔗</span>
                        <span>Order Control</span>
                    </div>
                    <div class="guide-card-body">
                        <div class="guide-meta"><span>W2C Workflow</span><span>July 24, 2026</span></div>
                        <h3><a href="/guides/hipobuy-w2c-link-variant-seller-warehouse-exception-workflow-2026/">Hipobuy W2C Link Control 2026</a></h3>
                        <p>Turn unstable marketplace links into controlled purchase records with locked variants, seller questions, payment checks, QC gates, and parcel release rules.</p>
                    </div>
                </article>
            </div>
        </section>

'''
          before, rest = text.split(start_marker, 1)
          _, after = rest.split(end_marker, 1)
          text = before + latest_block + end_marker + after

          hub_marker = '<!-- Full buyer guide hub. Keep every published guide here, newest first, with no three-card limit. -->'
          hub_pos = text.find(hub_marker)
          if hub_pos < 0:
              raise SystemExit('All Buyer Guides marker not found; refusing to rewrite.')
          grid_marker = '            <div class="category-grid">'
          grid_pos = text.find(grid_marker, hub_pos)
          if grid_pos < 0:
              raise SystemExit('All Buyer Guides grid not found; refusing to rewrite.')
          card = '''
                <a class="category-card" href="/guides/hipobuy-parcel-scenario-planning-shipping-estimate-2026/">
                    <div class="category-icon">📦</div>
                    <h3>Parcel Scenario Planning 2026</h3>
                    <p>Compare compact, protected, and split shipping plans with warehouse evidence and live route quotes.</p>
                    <span class="category-cta">Read guide →</span>
                </a>'''
          tail = text[grid_pos:]
          if slug not in tail:
              insert_at = grid_pos + len(grid_marker)
              text = text[:insert_at] + card + text[insert_at:]

          if text.count('/guides/' + slug + '/') != 2:
              raise SystemExit('Expected exactly two homepage references for the new guide.')
          latest_segment = text[text.find(start_marker):text.find(end_marker)]
          if latest_segment.count('<article class="guide-card"') != 3:
              raise SystemExit('Latest Guides is not capped at exactly three cards.')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit minimal homepage update and remove one-time workflow
        run: |
          rm -f .github/workflows/hipobuy-homepage-sync.yml
          git config user.name "seo-sites automation"
          git config user.email "actions@users.noreply.github.com"
          git add hipobuyvip.shop/index.html .github/workflows/hipobuy-homepage-sync.yml
          git commit -m "Feature July 30 Hipobuy guide on homepage"
          git push
