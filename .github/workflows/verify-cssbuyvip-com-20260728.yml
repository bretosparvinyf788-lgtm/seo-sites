name: Verify cssbuyvip.com July 28 article

on:
  push:
    branches: [main]
    paths:
      - '.github/cssbuy-live-verify-20260728.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for Cloudflare and verify production pages
        id: verify
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import html as html_lib
          import re
          import time
          import urllib.request
          from pathlib import Path

          article_url = 'https://cssbuyvip.com/guides/cssbuy-ship-for-me-inbound-manifest-2026/'
          home_url = 'https://cssbuyvip.com/'
          archive_url = 'https://cssbuyvip.com/all-seo-articles/'
          sitemap_url = 'https://cssbuyvip.com/sitemap.xml'
          slug = 'cssbuy-ship-for-me-inbound-manifest-2026'
          expected_title = 'CSSBuy Ship For Me Guide 2026 | Tracking & Warehouse Intake'

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent':'CSSBuyVip-Production-Check/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.status, response.headers.get('content-type',''), response.read().decode('utf-8','replace')

          def article_words(page):
              match = re.search(r'<article\b[^>]*>([\s\S]*?)</article>', page, re.I)
              text = match.group(1) if match else ''
              text = re.sub(r'<script\b[\s\S]*?</script>', ' ', text, flags=re.I)
              text = re.sub(r'<style\b[\s\S]*?</style>', ' ', text, flags=re.I)
              text = re.sub(r'<[^>]+>', ' ', text)
              text = html_lib.unescape(text)
              return len(re.findall(r"\b[\w’'-]+\b", text))

          last_errors = []
          result = None
          for attempt in range(1, 19):
              errors = []
              pages = {}
              for name, url in [('article',article_url),('home',home_url),('archive',archive_url),('sitemap',sitemap_url)]:
                  try:
                      status, ctype, body = fetch(url + ('?verify=20260728' if name != 'sitemap' else '?verify=20260728'))
                      pages[name] = body
                      if status != 200:
                          errors.append(f'{name} HTTP {status}')
                  except Exception as exc:
                      errors.append(f'{name} fetch error: {exc}')

              article = pages.get('article','')
              home = pages.get('home','')
              archive = pages.get('archive','')
              sitemap = pages.get('sitemap','')
              wc = article_words(article)

              if f'<title>{expected_title}</title>' not in article:
                  errors.append('article title mismatch')
              if 'CSSBuy Ship For Me Intake Manifest' not in article:
                  errors.append('article H1/content marker missing')
              if 'CSSBuy Ship For Me FAQ' not in article or article.count('<details>') < 12:
                  errors.append('FAQ incomplete')
              if not 1500 <= wc <= 2000:
                  errors.append(f'article visible word count {wc} outside 1500-2000')
              forbidden = ['Official sources checked','<h2>Sources</h2>','<h2>References</h2>','资料来源','核实来源','source-box']
              if any(token in article for token in forbidden):
                  errors.append('public source block detected')
              if article and ('Best CSSBuy Spreadsheet for QC-ready finds' in article or '<title>CSSBuy VIP | Spacious' in article):
                  errors.append('article is homepage fallback')

              link = f'/guides/{slug}/'
              if link not in home:
                  errors.append('homepage missing article link')
              if home.count('<a class="article"') != 3:
                  errors.append(f'homepage latest card count is {home.count(chr(60)+"a class=\"article\"")}')
              if home.find(link) == -1 or home.find(link) > home.find('/guides/cssbuy-buy-for-me-vs-ship-for-me-2026/'):
                  errors.append('homepage newest order incorrect')
              if link not in archive:
                  errors.append('archive missing article link')
              if archive.find(link) == -1 or archive.find(link) > archive.find('/guides/cssbuy-buy-for-me-vs-ship-for-me-2026/'):
                  errors.append('archive newest order incorrect')
              if f'https://cssbuyvip.com{link}' not in sitemap:
                  errors.append('sitemap missing article URL')

              if not errors:
                  result = (attempt, wc, pages)
                  last_errors = []
                  break
              last_errors = errors
              time.sleep(20)

          report = Path('cssbuyvip.com/verification/2026-07-28.txt')
          report.parent.mkdir(parents=True, exist_ok=True)
          if result:
              attempt, wc, pages = result
              report.write_text(
                  'PASS\n'
                  f'Article URL: {article_url}\n'
                  f'Article HTTP: 200\n'
                  f'Visible article words: {wc}\n'
                  'FAQ entries: 12 or more\n'
                  'Homepage HTTP: 200\n'
                  'Homepage latest cards: 3\n'
                  'Archive HTTP: 200\n'
                  'Sitemap HTTP: 200\n'
                  'Homepage, archive and sitemap contain the new permanent URL.\n'
                  'No public source/reference block detected.\n'
                  f'Passed on polling attempt: {attempt}\n', encoding='utf-8')
              print(report.read_text())
          else:
              report.write_text('FAIL\n' + '\n'.join(last_errors) + '\n', encoding='utf-8')
              print(report.read_text())
              raise SystemExit(1)
          PY

      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cssbuyvip.com/verification/2026-07-28.txt
          if git diff --cached --quiet; then
            echo "Verification report unchanged"
          else
            git commit -m "Record cssbuyvip.com July 28 production verification"
            git push origin HEAD:main
          fi

      - name: Fail workflow if verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
