name: Deploy superbuyvip.com

on:
  push:
    branches:
      - main
    paths:
      - "superbuyvip.com/**"
      - ".github/workflows/deploy-superbuyvip-com.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-superbuyvip-com
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy superbuyvip.com to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: superbuyvip.com
      PROJECT_NAME: superbuyvip-com
      SITE_DIR: superbuyvip.com
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare Pages project
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          response="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME")"
          matched="$(jq -r --arg domain "$DOMAIN" \
            '.success == true and any(.result.domains[]?; . == $domain)' \
            <<<"$response")"
          if [ "$matched" != "true" ]; then
            echo "Pages project $PROJECT_NAME does not serve $DOMAIN" >&2
            exit 1
          fi
          test -f "$SITE_DIR/index.html"

      - name: Deploy production
        run: >-
          npx --yes wrangler@4 pages deploy
          "$SITE_DIR"
          --project-name="$PROJECT_NAME"
          --branch=main
          --commit-hash="$GITHUB_SHA"
