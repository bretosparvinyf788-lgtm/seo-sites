name: Run HipoBuyVIP first-batch repair

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.issue.title == 'Run HipoBuyVIP first-batch repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and verify homepage repair
        shell: bash
        run: |
          python .github/scripts/repair_hipobuyvip_first_batch.py
          rm -f hipobuyvip.net/_worker.js
          test -f hipobuyvip.net/articles/index.html
          test -f hipobuyvip.net/articles/how-to-use-hipobuy-spreadsheet-2026.html
          test -f hipobuyvip.net/articles/are-hipobuy-qc-photos-free.html
          test -f hipobuyvip.net/articles/how-hipobuy-shipping-cost-works.html
          test -f hipobuyvip.net/contact/index.html
          test -f hipobuyvip.net/privacy-policy/index.html
          test -f hipobuyvip.net/terms/index.html
          test -f hipobuyvip.net/disclaimer/index.html

      - name: Commit repair and remove temporary automation
        shell: bash
        run: |
          rm -f .github/workflows/fix-hipobuyvip-first-batch.yml
          rm -f .github/workflows/run-hipobuyvip-first-batch-on-issue.yml
          rm -f .github/scripts/repair_hipobuyvip_first_batch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix HipoBuyVIP first-batch homepage links and calculator'
          git push origin HEAD:main
