name: Repair HipoBuyVIP image assets

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: github.event.issue.title == 'Run HipoBuyVIP image asset repair v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Flatten generated assets and rewrite references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          import shutil

          root = Path('hipobuyvip.net')
          generated = root / 'assets' / 'generated'
          stable = root / 'assets'
          stable.mkdir(parents=True, exist_ok=True)

          if not generated.is_dir():
              raise SystemExit('Missing hipobuyvip.net/assets/generated directory')

          copied = 0
          for source in generated.rglob('*'):
              if not source.is_file():
                  continue
              destination = stable / source.name
              if not destination.exists() or destination.read_bytes() != source.read_bytes():
                  shutil.copy2(source, destination)
                  copied += 1

          text_suffixes = {'.html', '.css', '.js', '.json', '.xml', '.txt', '.webmanifest'}
          changed_files = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              original = path.read_text(encoding='utf-8', errors='ignore')
              updated = original.replace('assets/generated/', 'assets/')
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed_files.append(str(path))

          headers = root / '_headers'
          if headers.exists():
              original = headers.read_text(encoding='utf-8')
              updated = re.sub(r'\n/assets/generated/\*\n(?:  .+\n?)+', '\n', original, flags=re.M)
              if updated != original:
                  headers.write_text(updated.rstrip() + '\n', encoding='utf-8')
                  changed_files.append(str(headers))

          image_pattern = re.compile(r'''<(?:img|source)\b[^>]*?\b(?:src|srcset)=["']([^"']+)["']''', re.I)
          icon_pattern = re.compile(r'''<link\b[^>]*?\brel=["'][^"']*(?:icon|manifest)[^"']*["'][^>]*?\bhref=["']([^"']+)["']''', re.I)
          css_pattern = re.compile(r'''url\(["']?([^"')]+)''', re.I)
          missing = []

          def resolve(page, reference):
              reference = reference.strip().split()[0]
              if not reference or reference.startswith(('data:', '#')):
                  return None
              parsed = urlsplit(reference)
              if parsed.scheme or parsed.netloc:
                  return None
              clean = parsed.path
              if not clean:
                  return None
              if clean.startswith('/'):
                  return root / clean.lstrip('/')
              return (page.parent / clean).resolve()

          for page in root.rglob('*'):
              if not page.is_file() or page.suffix.lower() not in {'.html', '.css'}:
                  continue
              text = page.read_text(encoding='utf-8', errors='ignore')
              refs = image_pattern.findall(text) + icon_pattern.findall(text) + css_pattern.findall(text)
              for reference in refs:
                  target = resolve(page, reference)
                  if target is None:
                      continue
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      continue
                  if not target.exists():
                      missing.append((str(page), reference))

          report = root / 'asset-audit.txt'
          lines = [
              'HipoBuyVIP asset repair audit',
              f'Copied assets: {copied}',
              f'Rewritten text files: {len(set(changed_files))}',
              f'Unresolved image/icon references: {len(missing)}',
          ]
          lines.extend(f'{page} -> {reference}' for page, reference in missing)
          report.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          marker = root / 'ASSET-REPAIR-NOTE.txt'
          if marker.exists():
              marker.unlink()

          remaining = []
          for path in root.rglob('*'):
              if path.is_file() and path.suffix.lower() in text_suffixes:
                  if 'assets/generated/' in path.read_text(encoding='utf-8', errors='ignore'):
                      remaining.append(str(path))
          if remaining:
              raise SystemExit('Generated asset references remain: ' + ', '.join(remaining))

          print('\n'.join(lines))
          if missing:
              print('Unresolved entries were recorded in hipobuyvip.net/asset-audit.txt')
          PY

      - name: Commit repaired assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hipobuyvip.net
          git rm .github/workflows/repair-hipobuyvip-assets.yml
          git commit -m "Fix HipoBuyVIP missing image assets"
          git push origin HEAD:main
