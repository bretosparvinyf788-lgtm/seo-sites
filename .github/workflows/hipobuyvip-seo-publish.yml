name: Publish HipoBuyVIP SEO Article

on:
  push:
    branches:
      - main
    paths:
      - automation/hipobuyvip/publish.py
      - automation/hipobuyvip/trigger.txt
  pull_request:
    branches:
      - main
    paths:
      - automation/hipobuyvip/publish.py
      - automation/hipobuyvip/trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hipobuyvip-seo-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply HipoBuyVIP article update
        run: python automation/hipobuyvip/publish.py

      - name: Commit published files
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "HipoBuyVIP SEO Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add hipobuyvip.net
          if git diff --cached --quiet; then
            echo "No publication changes detected."
          else
            git commit -m "Publish HipoBuyVIP warehouse storage guide"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
