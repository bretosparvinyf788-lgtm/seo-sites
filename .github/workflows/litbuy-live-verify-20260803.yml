name: LitBuy live verification 2026-08-03

on:
  push:
    branches: [main]
    paths:
      - "litbuyvip.shop/.verification/run-20260803.flag"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check deployed LitBuy endpoints
        shell: bash
        run: |
          set -u
          mkdir -p litbuyvip.shop/.verification /tmp/litbuy-verify
          check_url() {
            name="$1"; url="$2"
            code="$(curl -sSL --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 -o "/tmp/litbuy-verify/$name" -w '%{http_code}' "$url" || true)"
            printf '%s' "$code" > "/tmp/litbuy-verify/$name.code"
          }
          check_url article "https://litbuyvip.shop/guides/litbuy-rehearsal-parcel-shipping-decision-2026.html"
          check_url guides "https://litbuyvip.shop/guides/"
          check_url sitemap "https://litbuyvip.shop/sitemap.xml"
          check_url homepage "https://litbuyvip.shop/"

          article_code="$(cat /tmp/litbuy-verify/article.code)"
          guides_code="$(cat /tmp/litbuy-verify/guides.code)"
          sitemap_code="$(cat /tmp/litbuy-verify/sitemap.code)"
          homepage_code="$(cat /tmp/litbuy-verify/homepage.code)"
          article_title=false; grep -Fq "How to Use LitBuy Rehearsal Parcel Before Shipping" /tmp/litbuy-verify/article && article_title=true
          guides_new=false; grep -Fq "litbuy-rehearsal-parcel-shipping-decision-2026.html" /tmp/litbuy-verify/guides && guides_new=true
          sitemap_new=false; grep -Fq "litbuy-rehearsal-parcel-shipping-decision-2026.html" /tmp/litbuy-verify/sitemap && sitemap_new=true
          asset_path="$(grep -oE '/assets/latest-guides\.js\?v=[A-Za-z0-9]+' /tmp/litbuy-verify/homepage | tail -n1 || true)"
          asset_code="000"; latest_count="0"; latest_exact=false
          if [ -n "$asset_path" ]; then
            asset_code="$(curl -sSL --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 -o /tmp/litbuy-verify/asset -w '%{http_code}' "https://litbuyvip.shop${asset_path}" || true)"
            latest_count="$(grep -o "url:'/guides/" /tmp/litbuy-verify/asset | wc -l | tr -d ' ')"
            if [ "$latest_count" = "3" ] && \
               grep -Fq "/guides/litbuy-rehearsal-parcel-shipping-decision-2026.html" /tmp/litbuy-verify/asset && \
               grep -Fq "/guides/litbuy-parcel-planning-chargeable-weight-2026.html" /tmp/litbuy-verify/asset && \
               grep -Fq "/guides/litbuy-reverse-purchasing-workflow-2026.html" /tmp/litbuy-verify/asset; then
              latest_exact=true
            fi
          fi
          all_verified=false
          if [ "$article_code" = "200" ] && [ "$guides_code" = "200" ] && [ "$sitemap_code" = "200" ] && [ "$homepage_code" = "200" ] && [ "$asset_code" = "200" ] && [ "$article_title" = true ] && [ "$guides_new" = true ] && [ "$sitemap_new" = true ] && [ "$latest_exact" = true ]; then
            all_verified=true
          fi
          {
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "article_http=$article_code"
            echo "article_title_verified=$article_title"
            echo "guides_http=$guides_code"
            echo "guides_new_article_verified=$guides_new"
            echo "sitemap_http=$sitemap_code"
            echo "sitemap_new_url_verified=$sitemap_new"
            echo "homepage_http=$homepage_code"
            echo "asset_path=$asset_path"
            echo "asset_http=$asset_code"
            echo "homepage_latest_guides_count=$latest_count"
            echo "homepage_latest_guides_exact_newest_three=$latest_exact"
            echo "all_live_checks_passed=$all_verified"
          } > litbuyvip.shop/.verification/litbuy-2026-08-03.txt
      - name: Commit verification report
        shell: bash
        run: |
          set -euo pipefail
          rm -f litbuyvip.shop/.verification/run-20260803.flag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A litbuyvip.shop/.verification
          git commit -m "Verify live LitBuy August 3 publication"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
