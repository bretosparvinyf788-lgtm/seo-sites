name: Deploy superbuyvip.net

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "superbuyvip.net/**"
      - ".github/workflows/deploy-superbuyvip-net.yml"

permissions:
  contents: read

concurrency:
  group: deploy-superbuyvip-net
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy superbuyvip.net to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate deployment
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f superbuyvip.net/index.html

      - name: Deploy to Cloudflare Pages
        run: >-
          npx --yes wrangler@4 pages deploy
          superbuyvip.net
          --project-name=superbuyvip-net
          --branch=main
          --commit-hash="$GITHUB_SHA"
