name: Temporary Superbuy live publication check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-superbuy-live-check.yml

permissions:
  contents: write

jobs:
  verify-live-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify homepage, article and sitemap
        shell: bash
        run: |
          set +e
          mkdir -p .verification
          homepage_ok=false
          article_ok=false
          sitemap_ok=false
          homepage_code=0
          article_code=0
          sitemap_code=0

          for attempt in $(seq 1 12); do
            homepage_code=$(curl -L -sS -o /tmp/superbuy-home.html -w '%{http_code}' --max-time 25 https://superbuyvip.shop/)
            article_code=$(curl -L -sS -o /tmp/superbuy-article.html -w '%{http_code}' --max-time 25 https://superbuyvip.shop/guides/superbuy-warehouse-storage-strategy-2026/)
            sitemap_code=$(curl -L -sS -o /tmp/superbuy-sitemap.xml -w '%{http_code}' --max-time 25 https://superbuyvip.shop/sitemap.xml)

            grep -q 'Superbuy Warehouse Strategy 2026' /tmp/superbuy-home.html && grep -q '/guides/superbuy-warehouse-storage-strategy-2026/' /tmp/superbuy-home.html && homepage_ok=true
            grep -q 'Superbuy Warehouse Strategy 2026: Storage Deadlines, QC Decisions &amp; Smarter Consolidation\|Superbuy Warehouse Strategy 2026: Storage Deadlines, QC Decisions & Smarter Consolidation' /tmp/superbuy-article.html && article_ok=true
            grep -q 'https://superbuyvip.shop/guides/superbuy-warehouse-storage-strategy-2026/' /tmp/superbuy-sitemap.xml && sitemap_ok=true

            if [ "$homepage_ok" = true ] && [ "$article_ok" = true ] && [ "$sitemap_ok" = true ]; then
              break
            fi
            sleep 10
          done

          cat > .verification/superbuy-live-check.json <<EOF
          {
            "checked_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "homepage_http": ${homepage_code},
            "homepage_contains_new_guide": ${homepage_ok},
            "article_http": ${article_code},
            "article_contains_expected_title": ${article_ok},
            "sitemap_http": ${sitemap_code},
            "sitemap_contains_new_url": ${sitemap_ok}
          }
          EOF

      - name: Commit check result and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .verification/superbuy-live-check.json
          git rm .github/workflows/temp-superbuy-live-check.yml
          git commit -m "Record Superbuy live publication verification"
          git push origin main
