name: Fix CSSBuyVIP category links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cssbuyvip-category-links.yml'

permissions:
  contents: write

jobs:
  fix-category-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch category links and click area
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('cssbuyvip.net/index.html')
          css_path = Path('cssbuyvip.net/assets/css/style.css')

          html = html_path.read_text(encoding='utf-8')
          html = re.sub(
              r'(<a class="category-card card" href="[^"]+") target="_blank" rel="noopener"',
              r'\1 rel="noopener"',
              html,
          )
          marker = '<meta name="cssbuyvip-build" content="2026-07-30-category-links-v2">'
          if marker not in html:
              html = html.replace(
                  '<meta name="viewport" content="width=device-width,initial-scale=1">',
                  '<meta name="viewport" content="width=device-width,initial-scale=1">\n' + marker,
                  1,
              )
          html_path.write_text(html, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          old = '.category-card{padding:20px 16px 19px;transition:.22s}'
          new = '.category-card{display:block;position:relative;z-index:2;padding:20px 16px 19px;transition:.22s;cursor:pointer;pointer-events:auto!important}'
          if old in css:
              css = css.replace(old, new, 1)
          elif new not in css:
              css += '\n' + new + '\n'
          rule = '.category-card>*{pointer-events:none}'
          if rule not in css:
              css += '\n' + rule + '\n'
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cssbuyvip.net/index.html cssbuyvip.net/assets/css/style.css
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix CSSBuyVIP category card navigation"
            git push
          fi
