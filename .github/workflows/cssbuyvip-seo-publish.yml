name: Publish CSSBuyVIP SEO Article

on:
  push:
    branches:
      - main
    paths:
      - automation/cssbuyvip/publish.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cssbuyvip-seo-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CSSBuyVIP article update
        run: python automation/cssbuyvip/publish.py

      - name: Commit published files
        run: |
          git config user.name "CSSBuyVIP SEO Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add cssbuyvip.net
          if git diff --cached --quiet; then
            echo "No publication changes detected."
          else
            git commit -m "Publish CSSBuyVIP reverse purchasing guide"
            git push origin main
          fi
