name: Temporary Superbuy post-deployment check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-superbuy-postdeploy-check.yml

permissions:
  contents: write

jobs:
  verify-live-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify homepage, archive, article and sitemap
        shell: bash
        run: |
          set +e
          mkdir -p .verification
          sleep 15

          homepage_ok=false
          archive_ok=false
          article_ok=false
          sitemap_ok=false
          homepage_code=0
          archive_code=0
          article_code=0
          sitemap_code=0

          for attempt in $(seq 1 6); do
            homepage_code=$(curl -L -sS -o /tmp/superbuy-home.html -w '%{http_code}' --max-time 30 https://superbuyvip.shop/)
            archive_code=$(curl -L -sS -o /tmp/superbuy-guides.html -w '%{http_code}' --max-time 30 https://superbuyvip.shop/guides/)
            article_code=$(curl -L -sS -o /tmp/superbuy-article.html -w '%{http_code}' --max-time 30 https://superbuyvip.shop/guides/superbuy-warehouse-storage-strategy-2026/)
            sitemap_code=$(curl -L -sS -o /tmp/superbuy-sitemap.xml -w '%{http_code}' --max-time 30 https://superbuyvip.shop/sitemap.xml)

            grep -q 'Superbuy Warehouse Strategy 2026' /tmp/superbuy-home.html && grep -q '/guides/superbuy-warehouse-storage-strategy-2026/' /tmp/superbuy-home.html && homepage_ok=true
            grep -q 'Superbuy Warehouse Strategy 2026' /tmp/superbuy-guides.html && grep -q 'Superbuy Shipping Guide 2026' /tmp/superbuy-guides.html && grep -q 'Superbuy QC Photos Guide 2026' /tmp/superbuy-guides.html && grep -q 'Superbuy W2C Guide 2026' /tmp/superbuy-guides.html && archive_ok=true
            grep -q 'Superbuy Warehouse Strategy 2026: Storage Deadlines, QC Decisions' /tmp/superbuy-article.html && grep -q '1,741 words' /tmp/superbuy-article.html && article_ok=true
            grep -q 'https://superbuyvip.shop/guides/superbuy-warehouse-storage-strategy-2026/' /tmp/superbuy-sitemap.xml && sitemap_ok=true

            if [ "$homepage_ok" = true ] && [ "$archive_ok" = true ] && [ "$article_ok" = true ] && [ "$sitemap_ok" = true ]; then
              break
            fi
            sleep 10
          done

          cat > .verification/superbuy-live-check.json <<EOF
          {
            "checked_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "homepage_http": ${homepage_code},
            "homepage_contains_new_guide": ${homepage_ok},
            "archive_http": ${archive_code},
            "archive_contains_all_guides": ${archive_ok},
            "article_http": ${article_code},
            "article_contains_expected_content": ${article_ok},
            "sitemap_http": ${sitemap_code},
            "sitemap_contains_new_url": ${sitemap_ok}
          }
          EOF

          if [ "$homepage_ok" != true ] || [ "$archive_ok" != true ] || [ "$article_ok" != true ] || [ "$sitemap_ok" != true ]; then
            exit 1
          fi

      - name: Commit verification and remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .verification/superbuy-live-check.json
          git rm .github/workflows/temp-superbuy-postdeploy-check.yml
          git commit -m "Record Superbuy weekly live verification"
          git push origin main
