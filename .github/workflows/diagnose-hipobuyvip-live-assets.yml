name: Diagnose HipoBuyVIP live assets

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  diagnose:
    if: github.event.issue.title == 'Run HipoBuyVIP live asset diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Probe production HTML and image responses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import hashlib
          import re
          import time

          base = 'https://hipobuyvip.net'
          paths = [
              '/',
              '/assets/e1cf08f4a01263e0.png',
              '/assets/af6e653f7fc61b9f.jpg',
              '/assets/46622da6456ec6cb.webp',
              '/assets/88b48672060c890a.png',
              '/assets/f95852b5aa9496e2.png',
              '/assets/generated/e1cf08f4a01263e0.png',
          ]
          lines = ['HipoBuyVIP live asset diagnostic', f'Probe epoch: {int(time.time())}', '']
          homepage = b''

          for path in paths:
              url = base + path + ('?asset_probe=20260806' if path != '/' else '?html_probe=20260806')
              req = Request(url, headers={
                  'User-Agent': 'HipoBuyVIP-Asset-Diagnostic/1.0',
                  'Accept': '*/*',
                  'Cache-Control': 'no-cache',
              })
              try:
                  with urlopen(req, timeout=30) as response:
                      body = response.read()
                      status = response.status
                      headers = {k.lower(): v for k, v in response.headers.items()}
              except HTTPError as exc:
                  body = exc.read()
                  status = exc.code
                  headers = {k.lower(): v for k, v in exc.headers.items()}
              except URLError as exc:
                  lines.extend([f'URL: {url}', f'ERROR: {exc}', ''])
                  continue

              if path == '/':
                  homepage = body
              signature = body[:16].hex()
              looks_html = body.lstrip().lower().startswith((b'<!doctype html', b'<html'))
              lines.extend([
                  f'URL: {url}',
                  f'Status: {status}',
                  f'Content-Type: {headers.get("content-type", "")}',
                  f'Content-Length header: {headers.get("content-length", "")}',
                  f'Bytes received: {len(body)}',
                  f'SHA256: {hashlib.sha256(body).hexdigest()}',
                  f'First 16 bytes: {signature}',
                  f'Looks like HTML: {looks_html}',
                  f'CF-Cache-Status: {headers.get("cf-cache-status", "")}',
                  f'Age: {headers.get("age", "")}',
                  f'ETag: {headers.get("etag", "")}',
                  f'Last-Modified: {headers.get("last-modified", "")}',
                  f'CF-Ray: {headers.get("cf-ray", "")}',
                  '',
              ])

          if homepage:
              text = homepage.decode('utf-8', errors='replace')
              refs = sorted(set(re.findall(r'(?:src|href)=["\']([^"\']+\.(?:png|jpe?g|webp|svg))(?:\?[^"\']*)?["\']', text, re.I)))
              lines.append('Image/icon references found in live homepage:')
              lines.extend(f'- {ref}' for ref in refs)
              lines.append('')
              lines.append(f'Live homepage contains assets/generated/: {"assets/generated/" in text}')
              lines.append(f'Live homepage contains assets/e1cf08f4a01263e0.png: {"assets/e1cf08f4a01263e0.png" in text}')
              lines.append(f'Live homepage contains current calculator label: {"HipoBuy Chargeable Weight Calculator" in text}')

          report = Path('hipobuyvip.net/live-asset-diagnostic.txt')
          report.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(report.read_text(encoding='utf-8'))
          PY

      - name: Commit diagnostic report and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hipobuyvip.net/live-asset-diagnostic.txt
          git rm .github/workflows/diagnose-hipobuyvip-live-assets.yml
          git commit -m "Record HipoBuyVIP live asset diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
