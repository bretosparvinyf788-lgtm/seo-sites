name: Apply LitBuy direct-route fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-litbuy-direct-route-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install delta utility
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Apply and validate direct-route fix
        run: |
          test "$(sha256sum litbuyvip.org/index.html | cut -d' ' -f1)" = "c84f4655c8bac6e3ce1b186802fc5ed39f365d05902a0f50941dc3dd0a46a9be"
          zstd -d --patch-from=litbuyvip.org/index.html litbuyvip.org/.scheduled/2026-08-12-route/index.delta.zst -o /tmp/litbuy-index.html
          test "$(sha256sum /tmp/litbuy-index.html | cut -d' ' -f1)" = "e717d7e198e925d25f5e930e0ff306bbb5b3c6f9f227f8819538dfeeb1b0aa2e"
          mv /tmp/litbuy-index.html litbuyvip.org/index.html
          python - <<'PY'
          import json, re
          from pathlib import Path
          source = Path("litbuyvip.org/index.html").read_text()
          article, _ = json.JSONDecoder().raw_decode(source, source.index("wu=[") + 4)
          body = article["intro"] + " " + " ".join(p for section in article["sections"] for p in section["paragraphs"])
          assert len(re.findall(r"\b[\w’'-]+\b", body)) == 1762
          assert not re.search(r"https?://|www\.|\.com\b|\.org\b", body, re.I)
          assert '[M,U]=(0,Ot.useState)("home")' in source
          assert '[V,q]=(0,Ot.useState)(wu[0])' in source
          assert 'return k(),window.addEventListener("popstate",k)' in source
          assert source.count("litbuy-parcel-preflight-audit") == 6
          PY

      - name: Commit route fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add litbuyvip.org/index.html
          git rm -r litbuyvip.org/.scheduled/2026-08-12-route
          git rm .github/workflows/apply-litbuy-direct-route-fix.yml
          git commit -m "Fix LitBuy guide direct routes"
          git pull --rebase origin main
          git push origin main
