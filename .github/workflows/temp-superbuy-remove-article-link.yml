name: Temporary Superbuy article body cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-superbuy-remove-article-link.yml

permissions:
  contents: write

jobs:
  clean-article-body:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove navigation link from article content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('superbuyvip.shop/guides/superbuy-warehouse-storage-strategy-2026/index.html')
          text = path.read_text(encoding='utf-8')
          target = '        <a class="back" href="/#/guides">← Back to all buyer guides</a>\n'
          if target not in text:
              raise SystemExit('article-body link was not found')
          text = text.replace(target, '', 1)
          article = text.split('<article class="article">', 1)[1].split('</article>', 1)[0]
          if '<a ' in article:
              raise SystemExit('article content still contains a link')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add superbuyvip.shop/guides/superbuy-warehouse-storage-strategy-2026/index.html
          git rm .github/workflows/temp-superbuy-remove-article-link.yml
          git commit -m "Remove navigation link from Superbuy article content"
          git push origin main
