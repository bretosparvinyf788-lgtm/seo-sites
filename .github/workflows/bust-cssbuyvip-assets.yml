name: Bust CSSBuyVIP asset cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bust-cssbuyvip-assets.yml'

permissions:
  contents: write

jobs:
  bust-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version CSS and JavaScript URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('cssbuyvip.net/index.html')
          workflow_path = Path('.github/workflows/bust-cssbuyvip-assets.yml')
          html = html_path.read_text(encoding='utf-8')
          html = re.sub(r'assets/css/style\.css(?:\?v=[^"\']+)?', 'assets/css/style.css?v=20260730-nav3', html)
          html = re.sub(r'assets/js/main\.js(?:\?v=[^"\']+)?', 'assets/js/main.js?v=20260730-nav3', html)
          html_path.write_text(html, encoding='utf-8')
          if workflow_path.exists():
              workflow_path.unlink()
          PY
      - name: Commit cache-busting URLs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cssbuyvip.net/index.html .github/workflows/bust-cssbuyvip-assets.yml
          git commit -m "Bust CSSBuyVIP navigation asset cache"
          git push
