name: Deploy kakobuylab.com

on:
  push:
    branches: [main]
    paths:
      - "kakobuylab.com/**"
      - ".github/workflows/deploy-kakobuylab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kakobuylab-com
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: kakobuylab.com
      DEFAULT_PROJECT: kakobuylab-com
    steps:
      - uses: actions/checkout@v4

      - name: Resolve or create Cloudflare Pages project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          projects="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")"

          project="$(jq -r --arg domain "$DOMAIN" \
            '.result[]? | select(any(.domains[]?; . == $domain or . == ("www." + $domain))) | .name' \
            <<<"$projects" | head -n 1)"

          if [ -z "$project" ]; then
            project="$DEFAULT_PROJECT"
            status="$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$project\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")"
            if [ "$status" != "200" ] && [ "$status" != "201" ] && [ "$status" != "409" ]; then
              cat /tmp/pages-project.json >&2
              exit 1
            fi
          fi

          echo "name=$project" >> "$GITHUB_OUTPUT"

      - name: Deploy complete static site
        run: >-
          npx --yes wrangler@4 pages deploy kakobuylab.com
          --project-name="${{ steps.project.outputs.name }}"
          --branch=main
          --commit-hash="$GITHUB_SHA"

      - name: Bind apex and www domains
        shell: bash
        run: |
          set -euo pipefail
          project="${{ steps.project.outputs.name }}"
          response="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project")"

          for custom_domain in "$DOMAIN" "www.$DOMAIN"; do
            bound="$(jq -r --arg domain "$custom_domain" \
              'any(.result.domains[]?; . == $domain)' <<<"$response")"
            if [ "$bound" != "true" ]; then
              curl -fsS \
                -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "{\"name\":\"$custom_domain\"}" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/domains" \
                >"/tmp/pages-domain-${custom_domain//./-}.json"
              jq -e '.success == true' "/tmp/pages-domain-${custom_domain//./-}.json" >/dev/null
            fi
          done

      - name: Verify deployment files
        shell: bash
        run: |
          test -f kakobuylab.com/index.html
          test -f kakobuylab.com/robots.txt
          test -f kakobuylab.com/sitemap.xml
          test -f kakobuylab.com/guides/index.html
