name: Publish HipoBuyVIP guide

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == 'Publish HipoBuyVIP August 7 2026 guide'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply latest HipoBuyVIP guide manifest
        run: python3 hipobuyvip.net/.automation/publish_latest.py
      - name: Commit generated index updates
        run: |
          set -euo pipefail
          git diff --check
          git diff --quiet -- hipobuyvip.net/index.html && { echo "Expected homepage update was not produced"; exit 1; }
          git diff --quiet -- hipobuyvip.net/articles/index.html && { echo "Expected article-list update was not produced"; exit 1; }
          git diff --quiet -- hipobuyvip.net/sitemap.xml && { echo "Expected sitemap update was not produced"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hipobuyvip.net/index.html hipobuyvip.net/articles/index.html hipobuyvip.net/sitemap.xml
          git commit -m "Feature August 7 HipoBuyVIP guide on homepage"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Comment on completion
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'HipoBuyVIP August 7 publication completed and index updates were committed.'
            });
