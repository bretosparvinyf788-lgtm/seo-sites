name: Finalize cssbuyvip.com July 28 static article

on:
  push:
    branches: [main]
    paths:
      - '.github/cssbuy-finalize-20260728.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-cssbuyvip-com-20260728
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync main
        run: git pull --rebase origin main

      - name: Move article to a fresh permanent static URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html as html_lib
          import re

          old_slug = 'cssbuy-ship-for-me-inbound-manifest-2026'
          new_slug = 'cssbuy-ship-for-me-intake-manifest-2026'
          old_link = f'/guides/{old_slug}/'
          new_link = f'/guides/{new_slug}/'
          old_dir = Path('cssbuyvip.com/guides') / old_slug
          old_file = old_dir / 'index.html'
          new_dir = Path('cssbuyvip.com/guides') / new_slug
          new_file = new_dir / 'index.html'
          if not old_file.exists() and not new_file.exists():
              raise SystemExit('Source article file missing')
          source = new_file if new_file.exists() else old_file
          text = source.read_text(encoding='utf-8')
          text = text.replace(old_slug, new_slug)
          text = text.replace(old_link, new_link)
          text = text.replace(
              f'https://cssbuyvip.com/guides/{old_slug}/',
              f'https://cssbuyvip.com/guides/{new_slug}/',
          )

          optional_paragraphs = [
              '<p>Update the manifest after every reply. Record the problem, evidence sent, response date and next action. That prevents multiple conversations from producing conflicting instructions.</p>',
              '<p>That discipline turns Ship For Me from a forwarding address into a controlled receiving process. You remain responsible for the purchase, but the manifest gives you the evidence needed to use CSSBuy’s warehouse, QC, consolidation, packaging, storage and support tools more effectively.</p>',
              '<p>This preparation makes requests shorter and more useful. It also prevents random extra-photo requests that do not change the decision. Every requested image should answer a question that leads to approve, return, exchange or wait.</p>',
          ]

          def visible_words(page):
              match = re.search(r'<article\b[^>]*>([\s\S]*?)</article>', page, re.I)
              body = match.group(1) if match else ''
              body = re.sub(r'<script\b[\s\S]*?</script>', ' ', body, flags=re.I)
              body = re.sub(r'<style\b[\s\S]*?</style>', ' ', body, flags=re.I)
              body = re.sub(r'<[^>]+>', ' ', body)
              body = html_lib.unescape(body)
              return len(re.findall(r"\b[\w’'-]+\b", body))

          count = visible_words(text)
          for paragraph in optional_paragraphs:
              if count <= 2000:
                  break
              if paragraph in text:
                  text = text.replace(paragraph, '')
                  count = visible_words(text)
          if not 1500 <= count <= 2000:
              raise SystemExit(f'Local article word count outside range: {count}')
          if text.count('<details>') < 12 or 'CSSBuy Ship For Me FAQ' not in text:
              raise SystemExit('FAQ validation failed')
          forbidden = ('Official sources checked','<h2>Sources</h2>','<h2>References</h2>','资料来源','核实来源','source-box')
          if any(token in text for token in forbidden):
              raise SystemExit('Public source/reference block detected')
          if text.find('</section>') == -1 or '<div class="tags">' not in text or '<div class="actions">' not in text:
              raise SystemExit('FAQ/tags/navigation structure missing')

          new_dir.mkdir(parents=True, exist_ok=True)
          new_file.write_text(text, encoding='utf-8')
          if old_dir.exists() and old_dir != new_dir:
              for item in old_dir.iterdir():
                  item.unlink()
              old_dir.rmdir()

          for path in [Path('cssbuyvip.com/_worker.js'), Path('cssbuyvip.com/all-seo-articles/index.html'), Path('cssbuyvip.com/sitemap.xml')]:
              data = path.read_text(encoding='utf-8')
              data = data.replace(old_link, new_link)
              data = data.replace(
                  f'https://cssbuyvip.com/guides/{old_slug}/',
                  f'https://cssbuyvip.com/guides/{new_slug}/',
              )
              path.write_text(data, encoding='utf-8')

          redirects = Path('cssbuyvip.com/_redirects')
          lines = redirects.read_text(encoding='utf-8').splitlines() if redirects.exists() else []
          lines = [line for line in lines if old_slug not in line and new_slug not in line]
          lines.extend([
              f'/guides/{old_slug} {new_link} 301',
              f'/guides/{old_slug}/ {new_link} 301',
              f'/guides/{old_slug}.html {new_link} 301',
              f'/guides/{new_slug} {new_link} 301',
              f'/guides/{new_slug}.html {new_link} 301',
          ])
          redirects.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          headers = Path('cssbuyvip.com/_headers')
          existing = headers.read_text(encoding='utf-8') if headers.exists() else ''
          block = f'\n{new_link}\n  Cache-Control: no-cache, no-store, must-revalidate\n'
          if new_link not in existing:
              headers.write_text(existing.rstrip() + block, encoding='utf-8')

          print(f'Prepared {new_link}; visible article words: {count}')
          PY

      - name: Validate newest-first links locally
        run: |
          python3 - <<'PY'
          from pathlib import Path
          new = '/guides/cssbuy-ship-for-me-intake-manifest-2026/'
          previous = '/guides/cssbuy-buy-for-me-vs-ship-for-me-2026/'
          worker = Path('cssbuyvip.com/_worker.js').read_text(encoding='utf-8')
          archive = Path('cssbuyvip.com/all-seo-articles/index.html').read_text(encoding='utf-8')
          sitemap = Path('cssbuyvip.com/sitemap.xml').read_text(encoding='utf-8')
          assert worker.count('href:') == 3, 'Homepage latest list must contain exactly 3 entries'
          assert worker.find(new) != -1 and worker.find(new) < worker.find(previous), 'Homepage newest order invalid'
          assert archive.find(new) != -1 and archive.find(new) < archive.find(previous), 'Archive newest order invalid'
          assert 'https://cssbuyvip.com' + new in sitemap, 'Sitemap missing new URL'
          print('Local homepage, archive and sitemap validation passed')
          PY

      - name: Commit fresh static route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cssbuyvip.com
          if git diff --cached --quiet; then
            echo "Fresh static route already prepared"
          else
            git commit -m "Move CSSBuy July 28 guide to fresh static route"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi

      - name: Verify production deployment
        id: verify
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import html as html_lib
          import re
          import time
          import urllib.request
          from pathlib import Path

          article_url = 'https://cssbuyvip.com/guides/cssbuy-ship-for-me-intake-manifest-2026/'
          home_url = 'https://cssbuyvip.com/'
          archive_url = 'https://cssbuyvip.com/all-seo-articles/'
          sitemap_url = 'https://cssbuyvip.com/sitemap.xml'
          link = '/guides/cssbuy-ship-for-me-intake-manifest-2026/'
          previous = '/guides/cssbuy-buy-for-me-vs-ship-for-me-2026/'
          expected_title = 'CSSBuy Ship For Me Guide 2026 | Tracking & Warehouse Intake'

          def fetch(url):
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'CSSBuyVip-Production-Check/2.0',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status, response.read().decode('utf-8', 'replace')

          def visible_words(page):
              match = re.search(r'<article\b[^>]*>([\s\S]*?)</article>', page, re.I)
              body = match.group(1) if match else ''
              body = re.sub(r'<script\b[\s\S]*?</script>', ' ', body, flags=re.I)
              body = re.sub(r'<style\b[\s\S]*?</style>', ' ', body, flags=re.I)
              body = re.sub(r'<[^>]+>', ' ', body)
              body = html_lib.unescape(body)
              return len(re.findall(r"\b[\w’'-]+\b", body))

          final_errors = []
          passed = None
          for attempt in range(1, 37):
              pages = {}
              errors = []
              stamp = '?verify=20260728-fresh-' + str(attempt)
              for name, url in (('article',article_url),('home',home_url),('archive',archive_url),('sitemap',sitemap_url)):
                  try:
                      status, body = fetch(url + stamp)
                      pages[name] = body
                      if status != 200:
                          errors.append(f'{name} HTTP {status}')
                  except Exception as exc:
                      errors.append(f'{name} fetch error: {exc}')
              article = pages.get('article','')
              home = pages.get('home','')
              archive = pages.get('archive','')
              sitemap = pages.get('sitemap','')
              count = visible_words(article)
              if f'<title>{expected_title}</title>' not in article:
                  errors.append('article title mismatch')
              if 'CSSBuy Ship For Me Intake Manifest' not in article:
                  errors.append('article body marker missing')
              if 'CSSBuy Ship For Me FAQ' not in article or article.count('<details>') < 12:
                  errors.append('FAQ incomplete')
              if not 1500 <= count <= 2000:
                  errors.append(f'article visible word count outside range: {count}')
              forbidden = ('Official sources checked','<h2>Sources</h2>','<h2>References</h2>','资料来源','核实来源','source-box')
              if any(token in article for token in forbidden):
                  errors.append('public source/reference block detected')
              if 'Best CSSBuy Spreadsheet for QC-ready finds' in article:
                  errors.append('article is homepage fallback')
              if home.count('<a class="article"') != 3:
                  errors.append('homepage latest card count invalid')
              if home.find(link) == -1 or home.find(link) > home.find(previous):
                  errors.append('homepage link/order invalid')
              if archive.find(link) == -1 or archive.find(link) > archive.find(previous):
                  errors.append('archive link/order invalid')
              if 'https://cssbuyvip.com' + link not in sitemap:
                  errors.append('sitemap missing article URL')
              if not errors:
                  passed = (attempt, count)
                  break
              final_errors = errors
              print('Attempt', attempt, 'failed:', '; '.join(errors))
              time.sleep(20)

          report = Path('cssbuyvip.com/verification/2026-07-28.txt')
          report.parent.mkdir(parents=True, exist_ok=True)
          if passed:
              attempt, count = passed
              report.write_text(
                  'PASS\n'
                  f'Article URL: {article_url}\n'
                  'Article HTTP: 200\n'
                  f'Visible article words: {count}\n'
                  'FAQ entries: 12 or more\n'
                  'Homepage HTTP: 200\n'
                  'Homepage latest cards: 3\n'
                  'Archive HTTP: 200\n'
                  'Sitemap HTTP: 200\n'
                  'Homepage, archive and sitemap contain the fresh permanent URL in newest-first order.\n'
                  'No public source/reference block detected.\n'
                  f'Passed on polling attempt: {attempt}\n',
                  encoding='utf-8',
              )
          else:
              report.write_text('FAIL\n' + '\n'.join(final_errors) + '\n', encoding='utf-8')
              raise SystemExit(1)
          print(report.read_text())
          PY

      - name: Commit production verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add cssbuyvip.com/verification/2026-07-28.txt
          if git diff --cached --quiet; then
            echo "Verification report unchanged"
          else
            git commit -m "Record final CSSBuy July 28 live verification"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi

      - name: Fail if production verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
