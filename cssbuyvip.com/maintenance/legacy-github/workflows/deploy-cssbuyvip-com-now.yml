name: Deploy cssbuyvip.com July 30 Publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cssbuyvip-com-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-cssbuyvip-com-now
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          mkdir -p cssbuyvip.com/verification
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            printf 'DEPLOYMENT BLOCKED\nCloudflare API credentials are not available to this repository workflow.\n' > cssbuyvip.com/verification/2026-07-30-deployment.txt
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy cssbuyvip.com directory to Cloudflare Pages
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy cssbuyvip.com \
            --project-name=cssbuyvip-com \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Publish CSSBuy restricted item route guide for July 30"
      - name: Verify live deployment
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import html as html_lib
          import re, time

          article_url='https://cssbuyvip.com/guides/cssbuy-restricted-item-route-filter-2026/'
          home_url='https://cssbuyvip.com/'
          archive_url='https://cssbuyvip.com/all-seo-articles/'
          sitemap_url='https://cssbuyvip.com/sitemap.xml'
          slug='cssbuy-restricted-item-route-filter-2026'

          def fetch(url):
              request=Request(url, headers={'User-Agent':'Mozilla/5.0 cssbuyvip-production-verifier','Cache-Control':'no-cache'})
              try:
                  with urlopen(request, timeout=30) as response:
                      return response.status, response.read().decode('utf-8','replace')
              except HTTPError as exc:
                  return exc.code, exc.read().decode('utf-8','replace')
              except URLError as exc:
                  return 0, str(exc)

          final=[]
          passed=None
          for attempt in range(1,31):
              stamp='?verify=20260730-deploy-'+str(attempt)+'-'+str(int(time.time()))
              pages={}
              errors=[]
              for name,url in [('article',article_url),('home',home_url),('archive',archive_url),('sitemap',sitemap_url)]:
                  status,body=fetch(url+stamp)
                  pages[name]=body
                  if status != 200:
                      errors.append(f'{name} HTTP {status}')
              article=pages.get('article','')
              visible=re.sub(r'<script\b[\s\S]*?</script>|<style\b[\s\S]*?</style>|<[^>]+>',' ',article,flags=re.I)
              visible=html_lib.unescape(visible)
              words=len(re.findall(r"\b[\w’'-]+\b",visible))
              checks=[
                  ('article title','<title>CSSBuy Restricted Items Guide 2026 | Shipping Route Filter</title>' in article),
                  ('article H1','CSSBuy Restricted Item Route Filter: Build a Shippable Haul Before Parcel Submission' in article),
                  ('article body','Build the route plan before you build the haul' in article and 'Run the final parcel release check' in article),
                  ('FAQ','CSSBuy Restricted Item and Route FAQ' in article and article.count('<details>') >= 12),
                  ('word range',1500 <= words <= 2000),
                  ('not homepage fallback','Best CSSBuy Spreadsheet for QC-ready finds and smarter shipping' not in article),
                  ('no source section',not re.search(r'Official sources checked|>Sources<|>References<|官方消息来源|资料来源|核实来源',article,re.I)),
                  ('homepage link',slug in pages.get('home','')),
                  ('homepage latest three',all(x in pages.get('home','') for x in [slug,'cssbuy-ship-for-me-intake-manifest-2026','cssbuy-buy-for-me-vs-ship-for-me-2026'])),
                  ('archive link',slug in pages.get('archive','')),
                  ('sitemap link',slug in pages.get('sitemap','')),
              ]
              errors.extend(name for name,ok in checks if not ok)
              if not errors:
                  passed=(attempt,words)
                  break
              final=errors
              print('Attempt',attempt,'failed:', '; '.join(errors),'words',words)
              time.sleep(20)

          report=Path('cssbuyvip.com/verification/2026-07-30-deployment.txt')
          if passed:
              report.write_text(
                  'PASS\n'
                  f'article={article_url}\n'
                  f'attempt={passed[0]}\n'
                  f'visible_word_count={passed[1]}\n'
                  'article_http=200\n'
                  'homepage_http=200\n'
                  'archive_http=200\n'
                  'sitemap_http=200\n'
                  'title_h1_body_faq=pass\n'
                  'homepage_archive_sitemap_links=pass\n'
                  'homepage_latest_three=pass\n'
                  'homepage_fallback=false\n'
                  'visible_sources_section=false\n', encoding='utf-8')
          else:
              report.write_text('FAIL\n'+'\n'.join(final)+'\n',encoding='utf-8')
              raise SystemExit('Production verification failed: '+'; '.join(final))
          PY
      - name: Commit deployment report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add cssbuyvip.com/verification/2026-07-30-deployment.txt
          if git diff --cached --quiet; then
            echo "No deployment report change"
            exit 0
          fi
          git commit -m "Record July 30 cssbuyvip.com deployment result"
          git push origin HEAD:main
      - name: Fail when credentials are unavailable
        if: steps.credentials.outputs.available != 'true'
        run: exit 1
