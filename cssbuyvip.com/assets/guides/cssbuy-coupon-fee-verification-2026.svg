<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CSSBuy coupon and fee verification guide</title>
  <desc id="desc">A flat green checklist illustration showing a coupon ticket, fee ledger and verified payment total.</desc>
  <rect width="1200" height="630" fill="#123d27"/>
  <circle cx="1070" cy="92" r="190" fill="#1b5638"/>
  <circle cx="70" cy="590" r="210" fill="#1b5638"/>
  <g transform="translate(88 94)">
    <rect width="610" height="442" rx="34" fill="#fff"/>
    <rect x="38" y="38" width="224" height="48" rx="24" fill="#e9f8ee"/>
    <text x="62" y="70" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#168b4c">PAYMENT CHECKLIST</text>
    <text x="38" y="144" font-family="Arial, sans-serif" font-size="49" font-weight="800" fill="#152119">Coupon first.</text>
    <text x="38" y="198" font-family="Arial, sans-serif" font-size="49" font-weight="800" fill="#152119">Total second.</text>
    <g font-family="Arial, sans-serif" font-size="24" fill="#50645a">
      <circle cx="58" cy="264" r="15" fill="#83dc9e"/><path d="m50 264 6 6 11-14" fill="none" stroke="#123d27" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="272">Confirm eligible payment stage</text>
      <circle cx="58" cy="326" r="15" fill="#83dc9e"/><path d="m50 326 6 6 11-14" fill="none" stroke="#123d27" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="334">Record every visible charge</text>
      <circle cx="58" cy="388" r="15" fill="#83dc9e"/><path d="m50 388 6 6 11-14" fill="none" stroke="#123d27" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="396">Save the final receipt</text>
    </g>
  </g>
  <g transform="translate(760 136)">
    <path d="M0 34A34 34 0 0 1 34 0h260a34 34 0 0 1 34 34v60a30 30 0 0 0 0 60v60a34 34 0 0 1-34 34H34a34 34 0 0 1-34-34v-60a30 30 0 0 0 0-60Z" fill="#83dc9e"/>
    <text x="164" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#123d27">CSSBUY COUPON</text>
    <path d="M164 116v70" stroke="#123d27" stroke-width="3" stroke-dasharray="9 9" opacity=".55"/>
    <text x="164" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#123d27">VERIFY BEFORE PAYING</text>
  </g>
  <text x="760" y="454" font-family="Arial, sans-serif" font-size="45" font-weight="800" fill="#fff">CSSBuy Fees 2026</text>
  <text x="760" y="500" font-family="Arial, sans-serif" font-size="24" fill="#ccebd4">Codes • shipping • payment records</text>
