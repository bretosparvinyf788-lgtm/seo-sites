name: Deploy SugargooVIP July 30 Publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-sugargoovip-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-sugargoovip-now
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          mkdir -p sugargoovip.shop/verification
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            printf 'DEPLOYMENT BLOCKED\nCloudflare API credentials are not available to this repository workflow.\n' > sugargoovip.shop/verification/2026-07-30-packing-center-deployment.txt
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract production archive
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sugargoovip.shop/dist
          mkdir -p sugargoovip.shop/dist
          python3 - <<'PY'
          import tarfile
          with tarfile.open('sugargoovip.shop/site.tar.gz', 'r:gz') as archive:
              archive.extractall('sugargoovip.shop/dist')
          PY
          test -f sugargoovip.shop/dist/index.html
          test -f sugargoovip.shop/dist/guide-sugargoo-packing-center-parcel.html

      - name: Deploy SugargooVIP to Cloudflare Pages
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy sugargoovip.shop/dist \
            --project-name=sugargoovip-shop \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Publish Sugargoo Packing Center guide for July 30"

      - name: Verify production pages
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import json
          import time

          urls = {
              'article': 'https://sugargoovip.shop/guide-sugargoo-packing-center-parcel.html',
              'homepage': 'https://sugargoovip.shop/',
              'guides': 'https://sugargoovip.shop/guides.html',
              'sitemap': 'https://sugargoovip.shop/sitemap.xml',
              'robots': 'https://sugargoovip.shop/robots.txt',
          }
          slug = 'guide-sugargoo-packing-center-parcel.html'
          title = 'Sugargoo Packing Center Guide 2026: Build a Route-Ready Parcel Before You Pay'
          all_slugs = [slug, 'guide-sugargoo-returns-exchanges.html', 'guide-shipping-cost.html', 'guide-qc-photos.html', 'guide-w2c-workflow.html']
          latest_slugs = all_slugs[:3]

          def fetch(url, attempt):
              suffix = ('&' if '?' in url else '?') + f'verify=20260730-{attempt}-{int(time.time())}'
              request = Request(url + suffix, headers={'User-Agent': 'Mozilla/5.0 SugargooVIP production verifier', 'Cache-Control': 'no-cache'})
              try:
                  with urlopen(request, timeout=30) as response:
                      return response.status, response.read().decode('utf-8', 'replace')
              except HTTPError as exc:
                  return exc.code, exc.read().decode('utf-8', 'replace')
              except URLError as exc:
                  return 0, str(exc)

          final_errors = []
          passed = None
          final_statuses = {}
          for attempt in range(1, 31):
              pages = {}
              statuses = {}
              errors = []
              for name, url in urls.items():
                  status, body = fetch(url, attempt)
                  statuses[name] = status
                  pages[name] = body
                  if status != 200:
                      errors.append(f'{name} HTTP {status}')

              article = pages.get('article', '')
              homepage = pages.get('homepage', '')
              guides = pages.get('guides', '')
              sitemap = pages.get('sitemap', '')
              robots = pages.get('robots', '')
              latest_start = homepage.find('<section aria-labelledby="latest-guides-title"')
              latest_end = homepage.find('<section class="finder', latest_start) if latest_start >= 0 else -1
              latest = homepage[latest_start:latest_end] if latest_start >= 0 and latest_end > latest_start else ''
              latest_positions = [latest.find(value) for value in latest_slugs]
              archive_positions = [guides.find(value) for value in all_slugs]
              checks = {
                  'article_title': title in article,
                  'article_canonical': f'https://sugargoovip.shop/{slug}' in article,
                  'article_body': 'Treat the parcel as a shipping specification' in article and 'Track the handoff and learn from the completed shipment' in article,
                  'article_word_count': '1,756 words' in article,
                  'article_faq': 'Frequently asked questions' in article and article.count('<details>') >= 8,
                  'article_not_home_fallback': 'Sugargoo Spreadsheet 2026' not in article,
                  'article_wording_fixed': 'They do not automatically select everything that has arrived' not in article,
                  'homepage_new_article': slug in latest,
                  'homepage_exactly_three': latest.count('class="latest-guide-card') == 3,
                  'homepage_newest_first': all(position >= 0 for position in latest_positions) and latest_positions == sorted(latest_positions),
                  'homepage_no_old_fourth': 'guide-qc-photos.html' not in latest and 'guide-w2c-workflow.html' not in latest,
                  'guides_all_five': all(value in guides for value in all_slugs),
                  'guides_exactly_five_cards': guides.count('<article>') == 5,
                  'guides_newest_first': all(position >= 0 for position in archive_positions) and archive_positions == sorted(archive_positions),
                  'sitemap_article': slug in sitemap,
                  'robots_sitemap': 'sitemap.xml' in robots.lower(),
              }
              errors.extend(name for name, ok in checks.items() if not ok)
              final_errors = errors
              final_statuses = statuses
              if not errors:
                  passed = {'attempt': attempt, 'statuses': statuses, 'checks': checks}
                  break
              print(f'Attempt {attempt} failed: ' + '; '.join(errors))
              time.sleep(10)

          report_path = Path('sugargoovip.shop/verification/2026-07-30-packing-center-deployment.txt')
          if passed:
              report_path.write_text(
                  'PASS\n'
                  f"article={urls['article']}\n"
                  f"attempt={passed['attempt']}\n"
                  'word_count=1756\n'
                  + '\n'.join(f'{name}_http={status}' for name, status in passed['statuses'].items()) + '\n'
                  + '\n'.join(f'{name}=pass' for name in passed['checks']) + '\n',
                  encoding='utf-8',
              )
          else:
              report_path.write_text(
                  'FAIL\n'
                  + '\n'.join(f'{name}_http={status}' for name, status in final_statuses.items()) + '\n'
                  + '\n'.join(final_errors) + '\n',
                  encoding='utf-8',
              )
              raise SystemExit('Production verification failed: ' + '; '.join(final_errors))
          PY

      - name: Commit deployment report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add sugargoovip.shop/verification/2026-07-30-packing-center-deployment.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record July 30 SugargooVIP deployment result'
          git push origin HEAD:main

      - name: Fail when credentials are unavailable
        if: steps.credentials.outputs.available != 'true'
        run: exit 1
