name: Sugargoo article text fix

on:
  push:
    paths:
      - 'sugargoovip.shop/text-fix-request.json'

permissions:
  contents: write

concurrency:
  group: sugargoo-article-text-fix
  cancel-in-progress: false

jobs:
  patch-and-republish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize article copy and verified word count
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sugargoovip.shop/archive_tool.py')
          text = path.read_text(encoding='utf-8')
          old_copy = 'Plan backward from a route-ready parcel. They do not automatically select everything that has arrived. They first decide what can travel together, what still needs evidence, what creates a restriction and what may turn a light parcel into a bulky one.'
          new_copy = 'Plan backward from a route-ready parcel. Do not automatically select everything that has arrived. First decide what can travel together, what still needs evidence, what creates a restriction and what may turn a light parcel into a bulky one.'
          if old_copy in text:
              text = text.replace(old_copy, new_copy, 1)
          old_count = " 'word_count': 1758}"
          new_count = " 'word_count': 1756}"
          if old_count not in text:
              raise SystemExit('Expected article word count marker was not found')
          text = text.replace(old_count, new_count, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 sugargoovip.shop/archive_tool.py

      - name: Commit corrected article and generated site archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sugargoovip.shop/archive_tool.py sugargoovip.shop/site.tar.gz sugargoovip.shop/inspection
          git commit -m 'Synchronize July 30 Sugargoo article word count'
          git pull --rebase origin main
          git push origin HEAD:main
