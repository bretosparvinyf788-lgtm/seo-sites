name: Sugargoo Cloudflare secret diagnostic

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  check:
    if: startsWith(github.event.issue.title, 'Sugargoo Cloudflare secret check')
    runs-on: ubuntu-latest
    steps:
      - name: Report configured secret names
        uses: actions/github-script@v7
        env:
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID != '' }}
          HAS_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY != '' }}
        with:
          script: |
            const names = {
              CLOUDFLARE_API_TOKEN: process.env.HAS_CLOUDFLARE_API_TOKEN,
              CF_API_TOKEN: process.env.HAS_CF_API_TOKEN,
              CLOUDFLARE_ACCOUNT_ID: process.env.HAS_CLOUDFLARE_ACCOUNT_ID,
              CF_ACCOUNT_ID: process.env.HAS_CF_ACCOUNT_ID,
              CLOUDFLARE_API_KEY: process.env.HAS_CLOUDFLARE_API_KEY,
            };
            const lines = Object.entries(names).map(([k,v]) => `- ${k}: **${v === 'true' ? 'configured' : 'not configured'}**`);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'Cloudflare deployment secret diagnostic:\n'+lines.join('\n')});
