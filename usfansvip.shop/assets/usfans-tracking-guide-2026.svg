<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">USFans order and parcel tracking guide</title><desc id="desc">A mobile tracking timeline showing order, warehouse, parcel and delivery milestones.</desc>
  <defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9e8f4"/><stop offset="1" stop-color="#f3f0e8"/></linearGradient></defs>
  <rect width="1440" height="960" rx="48" fill="url(#bg3)"/><circle cx="120" cy="870" r="300" fill="#d9f75a" opacity=".35"/>
  <text x="100" y="126" fill="#ef745d" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="4">USFANS TRACKING · 2026</text><text x="100" y="228" fill="#18211f" font-family="Arial,sans-serif" font-size="78" font-weight="800">Read each status.</text><text x="100" y="302" fill="#52615c" font-family="Arial,sans-serif" font-size="34">Know which clock is moving.</text>
  <g transform="translate(900 92)"><rect width="430" height="770" rx="58" fill="#18211f"/><rect x="24" y="62" width="382" height="660" rx="32" fill="#fff"/><rect x="160" y="25" width="110" height="14" rx="7" fill="#52615c"/>
    <text x="66" y="128" fill="#18211f" font-family="Arial,sans-serif" font-size="26" font-weight="700">Parcel progress</text><path d="M92 185v430" stroke="#d9d7cf" stroke-width="8"/>
    <g font-family="Arial,sans-serif"><g transform="translate(92 205)"><circle r="22" fill="#d9f75a"/><path d="M-9 0l7 7 13-15" fill="none" stroke="#18211f" stroke-width="5"/><text x="48" y="8" font-size="22" font-weight="700" fill="#18211f">Purchased</text><text x="48" y="34" font-size="15" fill="#68746f">Seller order created</text></g><g transform="translate(92 325)"><circle r="22" fill="#d9f75a"/><path d="M-9 0l7 7 13-15" fill="none" stroke="#18211f" stroke-width="5"/><text x="48" y="8" font-size="22" font-weight="700" fill="#18211f">Warehouse</text><text x="48" y="34" font-size="15" fill="#68746f">QC ready</text></g><g transform="translate(92 445)"><circle r="22" fill="#ef745d"/><circle r="8" fill="#fff"/><text x="48" y="8" font-size="22" font-weight="700" fill="#18211f">International transit</text><text x="48" y="34" font-size="15" fill="#68746f">Carrier scan active</text></g><g transform="translate(92 565)"><circle r="22" fill="#fff" stroke="#d9d7cf" stroke-width="6"/><text x="48" y="8" font-size="22" font-weight="700" fill="#68746f">Delivery</text><text x="48" y="34" font-size="15" fill="#68746f">Final-mile handoff</text></g></g>
  </g>
  <g transform="translate(100 410)" font-family="Arial,sans-serif"><rect width="590" height="310" rx="34" fill="#163044"/><text x="48" y="72" fill="#d9f75a" font-size="22" font-weight="700">TWO DIFFERENT RECORDS</text><text x="48" y="137" fill="#fff" font-size="36" font-weight="700">Order status</text><text x="48" y="176" fill="#b9c4bf" font-size="21">Seller → warehouse</text><text x="48" y="238" fill="#fff" font-size="36" font-weight="700">Parcel tracking</text><text x="48" y="277" fill="#b9c4bf" font-size="21">Warehouse → destination</text></g>
  <text x="100" y="882" fill="#52615c" font-family="Arial,sans-serif" font-size="25">Save order IDs, parcel numbers and dated screenshots before asking support.</text>
</svg>
