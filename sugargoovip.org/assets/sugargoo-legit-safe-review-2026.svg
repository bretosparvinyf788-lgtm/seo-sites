<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Sugargoo safety review dashboard</title>
  <desc id="desc">A visual checklist separating marketplace, warehouse, parcel and buyer controls.</desc>
  <rect width="1200" height="800" fill="#f7f4ed"/>
  <rect x="55" y="55" width="1090" height="690" rx="34" fill="#11110f"/>
  <text x="105" y="145" fill="#ff6a2b" font-family="Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="4">BUYER CONTROL REVIEW / 2026</text>
  <text x="105" y="235" fill="#ffffff" font-family="Arial,sans-serif" font-size="58" font-weight="900">LEGIT?</text>
  <text x="365" y="235" fill="#b7f02a" font-family="Arial,sans-serif" font-size="58" font-weight="900">VERIFY THE CHAIN.</text>
  <g font-family="Arial,sans-serif" font-weight="800">
    <rect x="105" y="310" width="220" height="250" rx="20" fill="#ffd7c6"/><text x="135" y="365" font-size="18">01 / SELLER</text><text x="135" y="420" font-size="21">LIVE LISTING</text><path d="M140 470l28 28 70-78" fill="none" stroke="#ff5a1f" stroke-width="17"/>
    <rect x="355" y="310" width="220" height="250" rx="20" fill="#dbe8ff"/><text x="385" y="365" font-size="17">02 / WAREHOUSE</text><text x="385" y="420" font-size="21">QC EVIDENCE</text><path d="M390 470l28 28 70-78" fill="none" stroke="#315fff" stroke-width="17"/>
    <rect x="605" y="310" width="220" height="250" rx="20" fill="#dff3df"/><text x="635" y="365" font-size="18">03 / PARCEL</text><text x="635" y="420" font-size="21">ROUTE TERMS</text><path d="M640 470l28 28 70-78" fill="none" stroke="#15995c" stroke-width="17"/>
    <rect x="855" y="310" width="220" height="250" rx="20" fill="#b7f02a"/><text x="885" y="365" font-size="18">04 / BUYER</text><text x="885" y="420" font-size="21">KEEP RECORDS</text><path d="M890 470l28 28 70-78" fill="none" stroke="#11110f" stroke-width="17"/>
  </g>
  <text x="105" y="650" fill="#bbb7ae" font-family="Arial,sans-serif" font-size="21">A LEGITIMATE AGENT IS A CHECKPOINT — NOT A GUARANTEE.</text>
</svg>
