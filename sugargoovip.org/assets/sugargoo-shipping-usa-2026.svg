<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Sugargoo shipping route to the United States</title>
  <desc id="desc">A parcel route board connecting a China warehouse with a United States destination.</desc>
  <rect width="1200" height="800" fill="#11110f"/>
  <circle cx="1030" cy="130" r="190" fill="#315fff"/>
  <circle cx="1030" cy="130" r="115" fill="none" stroke="#b7f02a" stroke-width="35"/>
  <text x="70" y="105" fill="#ff6a2b" font-family="Arial,sans-serif" font-size="24" font-weight="900" letter-spacing="4">USA ROUTE BOARD / 2026</text>
  <text x="70" y="200" fill="#ffffff" font-family="Arial,sans-serif" font-size="70" font-weight="900">COST. TIME.</text>
  <text x="70" y="275" fill="#b7f02a" font-family="Arial,sans-serif" font-size="70" font-weight="900">ELIGIBILITY.</text>
  <path d="M130 535C330 370 510 650 715 480s280-70 365-165" fill="none" stroke="#dbe8ff" stroke-width="8" stroke-dasharray="20 16"/>
  <g font-family="Arial,sans-serif" font-weight="900">
    <rect x="75" y="450" width="180" height="135" rx="17" fill="#ffd7c6"/><text x="105" y="510" font-size="20">WAREHOUSE</text><text x="105" y="550" font-size="16">MEASURE</text>
    <rect x="450" y="520" width="180" height="135" rx="17" fill="#dbe8ff"/><text x="480" y="580" font-size="20">ROUTE</text><text x="480" y="620" font-size="16">COMPARE</text>
    <rect x="820" y="390" width="240" height="135" rx="17" fill="#b7f02a"/><text x="850" y="450" font-size="20">UNITED STATES</text><text x="850" y="490" font-size="16">TRACK HANDOFF</text>
  </g>
  <text x="70" y="735" fill="#a9a79f" font-family="Arial,sans-serif" font-size="22">THE BEST LINE IS THE ONE THAT FITS THIS PARCEL TODAY.</text>
</svg>
