    header{position:sticky;top:0;z-index:30;background:rgba(247,244,237,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(17,17,15,.08)}.nav{height:76px;display:flex;align-items:center;gap:34px}.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;letter-spacing:-.04em;white-space:nowrap}.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 9px 24px rgba(255,90,31,.28)}.logo em{font-style:normal;color:var(--orange)}.nav-links{display:flex;align-items:center;gap:26px;margin-left:auto}.nav-links a{font-size:13px;font-weight:750;color:#3a3935;transition:.2s}.nav-links a:hover{color:var(--orange)}.nav-actions{display:flex;align-items:center;gap:10px}.language{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 31px 9px 12px;font-size:12px;font-weight:750;color:#2f2e2a}.nav-cta,.primary-btn{border:0;background:var(--ink);color:#fff;border-radius:13px;padding:11px 17px;font-size:13px;font-weight:820;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.25s}.nav-cta:hover,.primary-btn:hover{transform:translateY(-2px);background:var(--orange)}.menu-btn{display:none;border:0;background:#fff;width:42px;height:42px;border-radius:12px;font-size:19px}
    .hero{min-height:calc(100vh - 110px);position:relative;display:flex;align-items:center;background:#11110f;color:#fff;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 24%,rgba(255,90,31,.35),transparent 30%),radial-gradient(circle at 84% 68%,rgba(255,122,26,.25),transparent 28%),linear-gradient(115deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:auto,auto,32px 32px}.hero:after{content:"";position:absolute;width:650px;height:650px;border:1px solid rgba(255,255,255,.12);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-47%);box-shadow:0 0 0 90px rgba(255,255,255,.025),0 0 0 180px rgba(255,255,255,.018)}.orbit{position:absolute;z-index:1;border:1px solid rgba(255,255,255,.14);border-radius:25px;background:rgba(255,255,255,.06);backdrop-filter:blur(8px);padding:10px 14px;font-size:11px;font-weight:850;letter-spacing:.04em;box-shadow:0 18px 60px rgba(0,0,0,.18);animation:float 6s ease-in-out infinite}.orbit b{color:#ff8b58}.o1{left:7%;top:25%;transform:rotate(-7deg)}.o2{right:8%;top:30%;transform:rotate(6deg);animation-delay:-1.5s}.o3{left:10%;bottom:19%;transform:rotate(5deg);animation-delay:-3s}.o4{right:10%;bottom:20%;transform:rotate(-6deg);animation-delay:-4.5s}@keyframes float{50%{translate:0 -12px}}

    .ticker{border-bottom:1px solid var(--line);background:#fff;overflow:hidden}.ticker-track{display:flex;width:max-content;animation:ticker 32s linear infinite}.ticker-item{padding:18px 30px;font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#5e5b55;display:flex;align-items:center;gap:25px}.ticker-item:after{content:"âœ¦";color:var(--orange)}@keyframes ticker{to{transform:translateX(-50%)}}
