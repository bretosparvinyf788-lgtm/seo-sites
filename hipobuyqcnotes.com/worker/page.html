.route-home .simple-hero{width:100%;background:#eaf1f8;color:#163b64;border-bottom:1px solid #d4e0ed;padding:0 24px;overflow:visible}.simple-hero-inner{width:min(960px,100%);margin:0 auto;min-height:465px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:65px 0 70px}.simple-kicker{font-size:13px;line-height:1.5;font-weight:600;letter-spacing:.1em;color:#5b7793;margin:0 0 22px}.route-home .simple-hero h1{font-family:Arial,Helvetica,sans-serif;font-size:clamp(52px,6.4vw,88px);font-weight:700;letter-spacing:-.045em;line-height:1.08;color:#183b62;text-align:center;text-wrap:balance;margin:0 0 25px;max-width:100%}.simple-hero h1 span{color:#426d9c;white-space:normal;overflow-wrap:anywhere}.simple-intro{max-width:630px;font-size:17px;line-height:1.8;color:#5a7088;margin:0 auto}.simple-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:13px;margin-top:32px;width:100%}.simple-actions a{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:13px 23px;font-size:14px;font-weight:600;line-height:1.5;border-radius:6px;max-width:100%}.simple-primary{background:#244f7d;border:1px solid #244f7d;color:white}.simple-primary:hover{background:#183b62}.simple-secondary{color:#244f7d;border:1px solid #b7c9dc;background:transparent}.simple-secondary:hover{background:#dce7f3}.simple-actions a:focus-visible{outline:3px solid #426d9c;outline-offset:4px}
@media(max-width:700px){.route-home .simple-hero{padding:0 20px}.simple-hero-inner{min-height:0;padding:50px 0 52px}.simple-kicker{font-size:12px;letter-spacing:.065em;margin-bottom:19px}.route-home .simple-hero h1{font-size:clamp(40px,10.8vw,65px);line-height:1.12;letter-spacing:-.04em;margin-bottom:22px}.simple-hero h1 span{display:block}.simple-intro{font-size:16px;line-height:1.75;max-width:500px}.simple-actions{gap:11px;margin-top:26px}.simple-actions a{font-size:14px;padding:12px 18px;min-height:46px}.simple-hero h1 span{white-space:normal}}

.desk-catalog{width:min(1440px,calc(100% - 64px));margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:45px;border-top:1px solid var(--ink);padding:40px 0 65px}.route-home #categories{width:100%;padding:0;align-self:start;position:sticky;top:128px}.route-home #categories .section-heading{margin-bottom:25px;display:block}.route-home #categories .section-heading>span{display:none}.route-home #categories h2{font:25px Arial,sans-serif;letter-spacing:-.05em;font-weight:600}.route-home #categories .eyebrow{font-size:9px;color:#89919b;margin-bottom:12px}.route-home .category-grid{display:block;border:0;counter-reset:category}.route-home .category-card{counter-increment:category;min-height:51px;padding:12px 20px 12px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;display:flex;flex-direction:row;align-items:center;gap:11px;background:transparent}.route-home .category-card:hover{background:#e1e4df;transform:none}.route-home .category-card strong{font-size:11px;font-weight:500;color:var(--ink)}.route-home .category-number svg{width:20px;height:20px;color:#77818a}.route-home .category-card>span:last-child{top:19px;right:0;font-size:11px;color:var(--signal)}
.route-home #products{width:100%;padding:0;background:transparent;border:0}.route-home .product-index{display:flex;align-items:end;justify-content:space-between;gap:25px;margin-bottom:28px}.route-home #products .section-heading{margin:0}.route-home #products h2{font:clamp(30px,3.6vw,50px) Arial,sans-serif;font-weight:600;letter-spacing:-.055em}.route-home #products .eyebrow{color:#89919b;font-size:9px}.route-home #products .filterline{margin:0}.route-home #products .search-status{display:none}.route-home .outline-button{border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:9px 0;font-size:11px;color:var(--ink)}.route-home #products .product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 20px}.route-home .product-card{background:transparent}.route-home .product-image{aspect-ratio:1;background:#e5e7e4;border:0;border-radius:0;padding:10px}.route-home .product-image img{object-fit:contain;background:white}.route-home .product-body{padding:13px 0 0}.route-home .product-body h3{font-size:12px;font-weight:500;color:#53606d;line-height:1.6;min-height:38px}.route-home .product-body strong{font:14px monospace;color:var(--ink)}.route-home .product-body span{font-size:9px;color:#697a8a}.route-home .product-card:hover{transform:translateY(-3px)}
.route-home .guide{background:var(--ink);color:white;padding:60px 0}.route-home .guide>.shell{display:grid;grid-template-columns:1fr 2fr;gap:0 70px}.route-home .guide .eyebrow{grid-column:1;grid-row:1;color:#dd8b66;font-size:9px}.route-home .guide h2{grid-column:1;grid-row:1;padding-top:32px;font:42px Arial,sans-serif;font-weight:500;letter-spacing:-.05em;line-height:1.1}.route-home .guide .steps{grid-column:2;grid-row:1;display:block;margin:0}.route-home .guide .step,.route-home .guide .step:first-child{display:grid;grid-template-columns:45px 1fr;gap:8px 20px;padding:25px 0;border-top:1px solid #58626c;position:static}.route-home .guide .step>span,.route-home .guide .step:first-child>span{position:static;grid-row:1/3;color:#df885e;font:24px monospace;margin:0}.route-home .step h3{color:#fff;font-size:19px;font-weight:500;margin:0}.route-home .step p{grid-column:2;color:#acb5c0;font-size:13px;line-height:1.9;margin:0}
.route-home .faq{background:var(--paper);width:min(1440px,calc(100% - 64px));padding:60px 0;max-width:none;border:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px}.route-home .faq>.section-heading{grid-column:1/-1;margin:0 0 4px;border-bottom:1px solid var(--ink);padding-bottom:25px}.route-home .faq h2{font:48px Arial,sans-serif;font-weight:600;letter-spacing:-.06em}.route-home .faq .eyebrow{font-size:9px;color:#89919b}.route-home .faq-group{display:block;border:0;margin:0;padding:0}.route-home .faq-group-heading{display:flex;flex-direction:column;align-items:start;gap:18px;min-height:120px;margin-bottom:24px}.route-home .faq-group-number{font:11px monospace;color:var(--signal);background:transparent;border:1px solid #bdc4c6;width:33px;height:33px;display:grid;place-items:center;border-radius:0}.route-home .faq-group h3{font-size:21px;font-weight:500;line-height:1.2;color:var(--ink)}.route-home .faq-grid{display:block}.route-home .faq-item{padding:17px 0;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0}.route-home .faq-item h4{font-size:12px;color:#3f5062;line-height:1.6;margin:0 0 12px}.route-home .faq-item p{font-size:12px;line-height:1.85;color:#77818b;margin:0}.route-home .footer{background:#e4e6e1;border-top:1px solid var(--line)}.route-home .footer .brand{background:transparent;padding:0}.route-home .footer p,.route-home .footer a{color:#667281}
@media(max-width:1100px){.desk-layout{gap:35px;grid-template-columns:.9fr 1.1fr}.desk-main-image{height:315px}.desk-catalog{grid-template-columns:170px 1fr;gap:30px}.route-home .guide>.shell{gap:0 40px}.route-home .guide h2{font-size:35px}.route-home .faq{grid-template-columns:repeat(2,minmax(0,1fr));gap:35px}.route-home .faq-group-heading{min-height:90px}}
@media(max-width:700px){.route-home .shell,.desk-catalog,.route-home .faq{width:calc(100% - 32px)}.desk-hero{padding:0 16px 30px}.desk-mast{grid-template-columns:1fr auto;padding:18px 0;font-size:10px}.desk-mast>span:nth-child(2){font-size:22px;text-align:right}.desk-mast>a{display:none}.desk-layout{display:flex;flex-direction:column;gap:26px;padding-top:24px}.desk-copy{padding-top:0}.desk-copy .eyebrow{margin-bottom:17px;font-size:8px}.desk-hero h1{font-size:clamp(42px,11vw,66px);margin-bottom:18px;line-height:1.05}.desk-intro{font-size:13px;margin-bottom:22px;max-width:none;line-height:1.75}.desk-cta{max-width:none;padding:15px 18px;font-size:11px}.desk-contents{display:none}.desk-image-wrap{padding:14px}.desk-main-image{height:275px}.desk-coordinate{top:23px;left:23px;font-size:9px}.desk-open{height:40px;width:40px;font-size:23px}.desk-caption{font-size:11px;padding:12px 0;gap:12px}.desk-selector{gap:7px}.desk-selector button{display:block;padding:5px}.desk-selector button>span{display:none}.desk-selector img{height:50px}.desk-catalog{display:block;padding:27px 0 40px}.route-home #categories{position:static;margin-bottom:35px}.route-home #categories .section-heading{margin-bottom:16px}.route-home .category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.route-home .category-card{min-height:49px}.route-home .category-card strong{font-size:11px}.route-home .product-index{display:block;margin-bottom:22px}.route-home #products h2{font-size:36px}.route-home #products .filterline{margin-top:15px}.route-home #products .product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 13px}.route-home .product-image{padding:6px}.route-home .product-body h3{font-size:12px}.route-home .guide{padding:38px 0}.route-home .guide>.shell{display:block}.route-home .guide h2{padding:0;font-size:33px;margin:0 0 28px}.route-home .guide .step,.route-home .guide .step:first-child{grid-template-columns:30px 1fr;gap:9px 15px;padding:22px 0}.route-home .guide .step>span{font-size:21px}.route-home .step h3{font-size:18px}.route-home .faq{display:block;padding:38px 0}.route-home .faq>.section-heading{padding-bottom:22px;margin-bottom:30px}.route-home .faq h2{font-size:37px}.route-home .faq-group{margin-top:30px}.route-home .faq-group-heading{min-height:0;flex-direction:row;align-items:center;margin-bottom:20px;gap:15px}.route-home .faq-group h3{font-size:23px;max-width:none}.route-home .faq-item p{font-size:13px}.route-home .faq-item h4{font-size:13px}}

/* Clear product pricing across home and catalog cards. */
.product-card .product-body>div>strong,.route-home .product-card .product-body>div>strong{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;line-height:1.3;letter-spacing:0;color:#194f86;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.product-card .product-body>div{align-items:center;flex-wrap:wrap;gap:8px 12px}
@media(max-width:700px){.product-card .product-body>div>strong,.route-home .product-card .product-body>div>strong{font-size:20px;line-height:1.35}}

/* Uniform featured product grid. */
.route-home #products .product-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:30px 18px;align-items:start}
.route-home #products .product-card{grid-column:auto;grid-row:auto;min-width:0}
.route-home #products .product-image{aspect-ratio:1;width:100%;padding:8px}
.route-home #products .product-image img{width:100%;height:100%;object-fit:contain}
.route-home #products .product-body h3{height:3.2em;min-height:3.2em;line-height:1.6;margin:0 0 14px}
@media(max-width:1200px){.route-home #products .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.route-home #products .product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 13px}.route-home #products .product-image{padding:6px}}
.route-home .step p{font-size:16px;line-height:1.85}.route-home .step p+p{margin-top:12px}</style>

<body>

  <script>const DATA={"languages":{"en":"English (United States)","en-GB":"English (United Kingdom)","en-AU":"English (Australia)","en-NZ":"English (New Zealand)","en-CA":"English (Canada)","zh":"简体中文（中国）","fr":"Français (France)","de":"Deutsch (Deutschland)","de-CH":"Deutsch (Schweiz)","it":"Italiano (Italia)","pl":"Polski (Polska)","pt":"Português (Portugal)","pt-BR":"Português (Brasil)","es":"Español (España)","es-MX":"Español (México)","da":"Dansk (Danmark)","no":"Norsk (Norge)","sv":"Svenska (Sverige)","ko":"한국어 (대한민국)"},"copy":{"en":{"nav":["Home","All finds","Categories","Image search"],"eyebrow":"INDEPENDENT PRODUCT NOTES","title":"Hipobuy Spreadsheet","intro":"Explore current finds by category, compare listing photos and prices, then check the item on Hipobuy before ordering.","search":"Search products","searchButton":"Search","categories":"Browse by category","latest":"Latest from the source","browse":"Browse all finds","guideTitle":"What deserves a second look?","guide":["An uneven pocket, a tilted print or a different panel shape gives you something specific to compare. Check the same area in another view: folds and camera angles can make a balanced item look uneven.\n\nFor example, if two pockets appear to sit at different heights, compare their distance from the same seam with the garment laid flat. For shoes, compare both heels in one level rear view. Describe the visible mismatch before deciding it is a defect; avoid comparing different sizes, colourways or poses as though they were identical.","A front view cannot tell you how an inside seam is finished. Treat an unseen detail as an open question. A useful extra photo shows the exact area you need, close enough to inspect and wide enough to locate it.\n\nAsk for a specific shot, such as the inside stitching around the left pocket or both heel counters photographed straight from behind. For dimensions, request a flat measurement with the tape’s starting point and endpoint visible. A close-up can help assess stitching, but it cannot confirm comfort, material composition or how long the item will last.","Keep a short note beside the item ID: which part caught your eye, which image shows it and what would resolve it. Revisit that note when photos of your own order arrive; a reference listing cannot settle that check.\n\nA useful note might read: “Left pocket looks lower in photo 3; need a straight-on picture with the shirt laid flat.” Add the selected size and colour so the follow-up concerns the correct variant. Mark the question resolved only when the new evidence answers it. If it remains unclear, ask again before deciding whether to keep the item."],"faqTitle":"Common questions","faq":[["Which views should I compare first?","Start with the front, back and both sides. Compare the same areas across views before relying on a single close-up."],["Why can the same item look different in two photos?","Lighting, exposure and white balance can change its appearance. Request another photo in neutral light if the colour matters to your decision."],["How do I check whether a pair is symmetrical?","Ask for both items side by side, level and photographed from the same angle. Perspective can make matching shapes appear different."],["Can photos reveal every defect?","No. Photos may miss hidden seams, internal damage, odour or how a material feels; identify any remaining uncertainty before deciding."],["How should clothing be positioned for measurements?","Ask for it laid flat without stretching, with the tape endpoints visible. State which measurement you need and compare it with a garment that fits you."],["Is the size label enough to judge the fit?","No. Labels and sizing conventions vary. Compare actual measurements and the seller’s size chart for the selected variant."],["What is a useful shoe measurement to request?","Ask for a clearly identified measurement, such as removable insole length where feasible. It is only a reference and does not establish width or overall fit."],["How should I interpret a small measurement difference?","Check the measuring method and tape placement first. There is no universal acceptable tolerance for every product; assess the difference against your fit needs."],["What makes a stitching close-up useful?","It should be sharp, well lit and show the whole affected seam plus nearby fabric. A wider view helps locate the issue."],["How can I distinguish a mark from a shadow?","Ask for another angle and more even lighting. If the mark remains visible, ask whether it can be inspected; a photo alone may not identify its cause."],["Which details are worth checking on bags and accessories?","Look at attachment points, edges, fasteners and hardware alignment. A still photo cannot confirm that a zip or clasp operates smoothly."],["How do I make a clear request for extra photos?","Name the exact item and area, the angle and any measurement needed. Ask the service provider about availability and charges before requesting extras."],["What should I match against my order before approving shipment?","Check the item, colour, size and selected variant against your order record. Resolve discrepancies with the service provider before you approve."],["How should I check included accessories?","Compare the visible contents with what the listing or seller explicitly promises. Ask for a group photo if expected pieces are not shown."],["Should I decide about packaging before shipping?","Yes. Confirm which packaging you want retained and any protection needed. Ask how changes affect protection, weight and applicable service conditions."],["What if an important detail is still unclear?","Ask a specific follow-up question before approving. Keep the relevant photos and order reference so the service provider can identify the concern."]],"register":"Register on Hipobuy","view":"View details","original":"Check source page","buy":"Open on Hipobuy","source":"Updated product listings","imageTitle":"Image search","imageBody":"Image search is not available yet. Photo uploads are disabled and no photos are stored here.","back":"Back to finds","noResults":"No matching source listings were returned.","unavailable":"The source is temporarily unavailable. Please try again shortly.","independent":"Independent product guide, not operated by Hipobuy. Confirm product details before placing an order.","photoNote":"Source listing photos. No separate QC records were identified for this item.","sourceNote":"Verify images, variants and price on the source and purchase pages.","page":"Page","next":"Next","previous":"Previous","sorting":"Sort","sortOptions":["Source order","Price: low to high","Price: high to low"],"faqGroups":["Reading the photos","Checking the fit","Asking for close-ups","Before shipment"],"guideHeadings":["A difference you can point to","A detail the photos do not show","A question worth keeping"],"guideLabel":"Photo review notes"},"zh":{"nav":["首页","全部商品","分类","图片搜索"],"eyebrow":"独立商品笔记","title":"Hipobuy Spreadsheet","intro":"按分类浏览商品，比较商品图片与标价，再前往 Hipobuy 核对商品后下单。","search":"搜索商品","searchButton":"搜索","categories":"按分类浏览","latest":"精选商品","browse":"浏览全部商品","guideTitle":"哪些细节值得再看一眼？","guide":["口袋一高一低、印花倾斜、拼接轮廓不同，都可以成为具体的对比点。先找另一个角度看同一位置：衣物褶皱和镜头倾斜，也可能让原本对称的部分看起来不齐。\n\n例如，两侧口袋看起来不在同一高度，可以请对方把衣服平铺，比较口袋到同一条接缝的距离；鞋子后跟疑似不对称，则需要两只鞋并排、镜头与后跟保持水平的背面照。先描述“哪里不一样”，再判断是不是瑕疵，避免拿不同尺码、颜色或摆放姿势的照片直接下结论。","一张正面图说明不了内侧缝线的做工。看不到的细节先留作待确认项。补图时明确指出位置，既要近到能看清细节，也要留出足够范围，让人知道拍的是哪里。\n\n补拍要求可以写成“左侧口袋内侧缝线近照”或“两只鞋并排的正后方照片”，比笼统地说“再拍清楚一点”更明确。需要核对尺寸时，要求商品平铺，尺子的起点与终点都入镜。细节图能帮助查看走线，但不能证明上身是否舒适、材质成分是否准确，或穿用后是否耐久。","按商品编号记下三件事：在意哪个位置、哪张图出现了问题、还需要什么才能判断。自己的订单照片到齐后，再回头逐项核对；参考商品页不能替代这一步。\n\n比如可以记：“第3张图左侧口袋疑似偏低，需要衣服平铺后的正面照。”同时记上选购的尺码与颜色，避免后续核对错款。只有新增照片确实回答了问题，才把这一项标记为已确认；如果照片仍然模糊或角度不对，就保留疑问，在决定是否保留商品前继续沟通。"],"faqTitle":"常见问题","faq":[["拿到照片后先比较哪些角度？","先看正面、背面和两侧，再对照不同角度中的同一部位，不要仅凭一张特写判断。"],["为什么同一件商品在两张照片里颜色不同？","灯光、曝光和白平衡都会影响颜色。若色差会影响购买决定，可以要求在中性光线下补拍。"],["怎样查看一双商品是否对称？","请将两只并排、放平，并从同一角度拍摄。透视差异可能让原本相近的外形看起来不同。"],["照片能看出所有瑕疵吗？","不能。隐藏接缝、内部损伤、气味和材质手感都可能无法通过照片判断，应先明确仍未解决的疑问。"],["衣服应该怎样摆放才方便测量？","请平铺且不要拉伸，并让尺子的起止点清楚可见。说明需要测量的位置，再与自己合身衣物的同项尺寸比较。"],["只看尺码标签能判断是否合身吗？","不能。不同商品的尺码标注可能不同，应结合所选款式的实际测量和卖家尺码表判断。"],["鞋子可以要求测量哪个尺寸？","可以明确要求可拆卸鞋垫的长度等可操作项目，并注明测量方式。长度仅供参考，不能单独判断宽度和整体脚感。"],["实测尺寸差一点应该怎么看？","先核对测量方法和尺子位置。不同商品没有统一的可接受误差，应结合自己的穿着需求判断。"],["什么样的走线特写才有参考价值？","照片应清晰、光线充足，展示完整的问题接缝及周围面料，并配一张较远照片说明具体位置。"],["怎样判断一处痕迹是污渍还是阴影？","请换角度并在均匀光线下补拍。如果痕迹仍可见，可请服务方检查；仅靠照片不一定能确认成因。"],["包袋和配件有哪些细节值得重点看？","可查看连接处、边缘、扣件和五金是否对齐。静态照片无法证明拉链或扣件开合顺畅。"],["怎样提出明确的补拍要求？","写清具体商品、需要拍摄的部位、角度和测量项目。补拍前向服务方确认是否支持以及是否收费。"],["确认发货前应与订单核对什么？","逐项对照商品、颜色、尺码和所选规格。如有不符，先联系服务方解决，再确认发货。"],["怎样确认附带配件是否齐全？","以商品说明或卖家明确承诺的内容为准，对照照片中的物品。应有配件未展示时，可以要求合照确认。"],["包装要在发货前决定吗？","是的，应确认保留哪些包装、需要哪些保护，并向服务方了解变动对防护、重量及适用服务条件的影响。"],["重要细节仍然看不清怎么办？","确认发货前提出具体的追问，并保留相关照片与订单信息，方便服务方定位问题。"]],"register":"前往 Hipobuy 注册","view":"查看详情","original":"查看原始商品页","buy":"前往 Hipobuy","source":"实时更新的商品","imageTitle":"图片搜索","imageBody":"图片搜索暂未开放；这里不能上传照片，也不会保存照片。","back":"返回商品列表","noResults":"没有匹配的商品。","unavailable":"商品暂时无法读取，请稍后重试。","independent":"独立商品推荐站，非 Hipobuy 官方运营。下单前请核对商品详情。","photoNote":"来源站商品图片；该商品未识别到独立 QC 记录。","sourceNote":"请在来源页与购买页再次核对图片、规格及价格。","page":"第","next":"下一页","previous":"上一页","sorting":"排序","sortOptions":["默认顺序","价格从低到高","价格从高到低"],"faqGroups":["看懂商品照片","核对尺码与测量","提出补拍要求","发货前确认"],"guideHeadings":["把差异说具体","照片没拍到，就先留个问号","为这件商品留一条核对笔记"],"guideLabel":"照片判断笔记"},"de":{"nav":["Startseite","Alle Artikel","Kategorien","Bildsuche"],"eyebrow":"UNABHÄNGIGE PRODUKTNOTIZEN","title":"Hipobuy Spreadsheet","intro":"Entdecke aktuelle Artikel nach Kategorien, vergleiche Fotos und Preise und prüfe sie vor der Bestellung bei Hipobuy.","search":"Produkte suchen","searchButton":"Suchen","categories":"Kategorien entdecken","latest":"Neu aus der Quelle","browse":"Alle Artikel ansehen","guideTitle":"Was verdient einen zweiten Blick?","guide":["Eine versetzte Tasche, ein schiefer Druck oder eine andere Schnittform bietet einen konkreten Vergleichspunkt. Prüfe dieselbe Stelle aus einem anderen Winkel: Falten und Perspektive können eine scheinbare Asymmetrie erzeugen.\n\nVergleiche etwa den Abstand beider Taschen zu derselben Naht, wenn das Kleidungsstück flach liegt. Bei Schuhen hilft eine gerade Rückansicht beider Fersen nebeneinander. Beschreibe zuerst die sichtbare Abweichung. Unterschiedliche Größen, Farben oder Positionen sollten nicht wie identische Varianten verglichen werden.","Eine Vorderansicht zeigt keine inneren Nähte. Behandle unsichtbare Details als offene Fragen. Ein hilfreiches Zusatzfoto zeigt die Stelle nah genug für Details und mit genug Umgebung zur Orientierung.\n\nBitte konkret um die innere Naht der linken Tasche oder eine gerade Rückansicht beider Schuhe. Für Maße sollte der Artikel flach liegen; Anfang und Ende des Maßbands müssen sichtbar sein. Eine Nahaufnahme hilft bei Nähten, bestätigt aber weder Tragekomfort noch Materialzusammensetzung oder Haltbarkeit.","Notiere zur Artikelnummer die betroffene Stelle, das Foto und die noch fehlende Information. Nutze diese Notiz später bei den Fotos deiner eigenen Bestellung; Referenzbilder ersetzen diese Prüfung nicht.\n\nEine Notiz könnte lauten: „Linke Tasche wirkt auf Foto 3 tiefer; gerade Aufnahme des flach liegenden Hemds nötig.“ Ergänze Größe und Farbe. Erledige die Frage erst, wenn das neue Bild sie beantwortet. Bleibt etwas unklar, frage nach, bevor du entscheidest, den Artikel zu behalten."],"faqTitle":"Häufige Fragen","faq":[["Welche Ansichten sollte ich zuerst vergleichen?","Beginne mit Vorderseite, Rückseite und beiden Seiten. Vergleiche dieselben Stellen aus mehreren Blickwinkeln."],["Warum wirkt die Farbe auf zwei Fotos unterschiedlich?","Licht, Belichtung und Weißabgleich verändern die Darstellung. Bitte bei wichtigen Farbfragen um ein Foto bei neutralem Licht."],["Wie prüfe ich die Symmetrie eines Paars?","Bitte um ein Bild mit beiden Teilen nebeneinander, eben ausgerichtet und aus demselben Winkel. Perspektive kann täuschen."],["Zeigen Fotos jeden Mangel?","Nein. Verdeckte Nähte, innere Schäden, Geruch und Materialgefühl bleiben möglicherweise ungeklärt."],["Wie sollte Kleidung beim Messen liegen?","Flach und ungedehnt, mit sichtbaren Anfangs- und Endpunkten des Maßbands. Vergleiche dieselbe Messung an einem passenden Kleidungsstück."],["Reicht das Größenetikett aus?","Nein. Größenangaben unterscheiden sich. Vergleiche tatsächliche Maße und die Größentabelle der gewählten Variante."],["Welches Schuhmaß kann ich anfordern?","Bitte um ein genau bezeichnetes, machbares Maß, etwa die Länge einer herausnehmbaren Innensohle. Es sagt allein nichts Sicheres über Breite oder Passform aus."],["Wie bewerte ich eine kleine Maßabweichung?","Prüfe zuerst Messmethode und Bandposition. Es gibt keine einheitliche akzeptable Toleranz für alle Produkte."],["Was macht eine Nahtaufnahme hilfreich?","Sie sollte scharf und gut beleuchtet sein und die betroffene Naht samt Umgebung zeigen. Eine Gesamtansicht hilft bei der Zuordnung."],["Wie unterscheide ich einen Fleck von einem Schatten?","Bitte um einen anderen Winkel bei gleichmäßiger Beleuchtung. Bleibt die Stelle sichtbar, frage nach einer Prüfung; Fotos klären die Ursache nicht immer."],["Welche Details sind bei Taschen und Zubehör wichtig?","Befestigungen, Kanten, Verschlüsse und die Ausrichtung von Metallteilen. Ein Foto belegt nicht, dass ein Reißverschluss leicht läuft."],["Wie formuliere ich eine zusätzliche Fotoanfrage?","Nenne Artikel, Stelle, Blickwinkel und gewünschtes Maß. Kläre vorher Verfügbarkeit und Gebühren beim Dienstleister."],["Was gleiche ich vor der Versandfreigabe ab?","Artikel, Farbe, Größe und Variante mit der Bestellung. Kläre Abweichungen vor deiner Freigabe."],["Wie prüfe ich mitgeliefertes Zubehör?","Vergleiche die sichtbaren Teile mit den ausdrücklich zugesagten Bestandteilen. Bitte bei fehlender Darstellung um ein Gruppenfoto."],["Sollte ich die Verpackung vor dem Versand festlegen?","Ja. Kläre, was erhalten bleiben soll und welcher Schutz nötig ist. Frage nach Auswirkungen auf Gewicht, Schutz und Servicebedingungen."],["Was tun, wenn ein wichtiger Punkt unklar bleibt?","Frage vor der Freigabe gezielt nach. Bewahre Fotos und Bestellreferenz zur eindeutigen Zuordnung auf."]],"register":"Bei Hipobuy registrieren","view":"Details ansehen","original":"Quellseite prüfen","buy":"Bei Hipobuy öffnen","source":"Aktuelle Produktangebote","imageTitle":"Bildsuche","imageBody":"Die Bildsuche ist noch nicht verfügbar. Fotos können hier nicht hochgeladen und werden nicht gespeichert.","back":"Zurück zu Artikeln","noResults":"Keine passenden Einträge gefunden.","unavailable":"Die Quelle ist vorübergehend nicht erreichbar.","independent":"Unabhängiger Produktratgeber, nicht von Hipobuy betrieben. Prüfe die Produktdetails vor der Bestellung.","photoNote":"Bilder der Quellanzeige; keine gesonderten QC-Daten erkannt.","sourceNote":"Bilder, Varianten und Preis auf Quelle und Kaufseite prüfen.","page":"Seite","next":"Weiter","previous":"Zurück","sorting":"Sortierung","sortOptions":["Reihenfolge der Quelle","Preis aufsteigend","Preis absteigend"],"faqGroups":["Fotos beurteilen","Maße vergleichen","Detailfotos anfragen","Vor dem Versand"],"guideHeadings":["Den Unterschied benennen","Fehlende Details offenlassen","Eine konkrete Frage festhalten"],"guideLabel":"Notizen zur Fotoprüfung"},"fr":{"nav":["Accueil","Tous les articles","Catégories","Recherche par image"],"eyebrow":"NOTES PRODUITS INDÉPENDANTES","title":"Hipobuy Spreadsheet","intro":"Explorez les produits par catégorie, comparez photos et prix, puis vérifiez le produit sur Hipobuy avant de commander.","search":"Rechercher des produits","searchButton":"Rechercher","categories":"Parcourir les catégories","latest":"Nouveautés de la source","browse":"Voir tous les articles","guideTitle":"Quels détails méritent un second regard ?","guide":["Une poche décalée, un imprimé incliné ou une découpe différente donne un point précis à comparer. Retrouvez cette zone sous un autre angle : les plis et la perspective peuvent créer une fausse asymétrie.\n\nPar exemple, comparez la distance des deux poches à une même couture, vêtement posé à plat. Pour des chaussures, demandez une vue arrière des deux talons au même niveau. Décrivez l’écart visible avant de conclure à un défaut ; des tailles, coloris ou positions différents ne sont pas directement comparables.","Une vue de face ne montre pas la finition des coutures intérieures. Laissez ce détail en suspens. Une photo utile doit être assez proche pour voir la finition et assez large pour situer la zone.\n\nDemandez une vue précise : couture intérieure de la poche gauche ou arrière des deux chaussures côte à côte. Pour une mesure, le vêtement doit être à plat et les deux extrémités du ruban visibles. Un gros plan aide à examiner les coutures, mais ne confirme ni confort, ni composition, ni durabilité.","Notez avec la référence du produit la zone concernée, la photo et ce qui permettrait de trancher. Reprenez cette note à la réception des photos de votre commande ; les images de référence ne remplacent pas ce contrôle.\n\nExemple de note : « Poche gauche plus basse sur la photo 3 ; demander une vue de face à plat. » Ajoutez la taille et la couleur choisies. Ne clôturez la question que si la nouvelle photo y répond. Si elle reste floue ou mal orientée, demandez une précision avant de décider de garder l’article."],"faqTitle":"Questions fréquentes","faq":[["Quelles vues comparer en premier ?","Commencez par l’avant, l’arrière et les deux côtés. Comparez les mêmes zones sous plusieurs angles."],["Pourquoi la couleur change-t-elle entre deux photos ?","La lumière, l’exposition et la balance des blancs modifient le rendu. Demandez une photo sous une lumière neutre si nécessaire."],["Comment vérifier la symétrie d’une paire ?","Demandez une photo des deux éléments côte à côte, à plat et sous le même angle. La perspective peut tromper."],["Les photos révèlent-elles tous les défauts ?","Non. Les coutures cachées, les dégâts internes, l’odeur et le toucher peuvent rester inconnus."],["Comment disposer un vêtement pour le mesurer ?","À plat, sans l’étirer, avec les extrémités du ruban visibles. Comparez la même mesure sur un vêtement qui vous va."],["L’étiquette de taille suffit-elle ?","Non. Comparez les mesures réelles et le tableau du vendeur pour la variante choisie ; les conventions varient."],["Quelle mesure demander pour des chaussures ?","Précisez une mesure réalisable, comme la longueur d’une semelle amovible. Elle ne suffit pas à déterminer la largeur ou le confort."],["Comment évaluer un petit écart de mesure ?","Vérifiez d’abord la méthode et la position du ruban. Aucune tolérance unique ne convient à tous les produits."],["Qu’est-ce qu’un gros plan utile des coutures ?","Une image nette et bien éclairée montrant la couture entière et le tissu voisin, accompagnée d’une vue plus large."],["Comment distinguer une marque d’une ombre ?","Demandez un autre angle avec un éclairage uniforme. Si la marque reste visible, demandez une inspection ; la photo peut être insuffisante."],["Quels détails examiner sur les sacs et accessoires ?","Les attaches, les bords, les fermetures et l’alignement des pièces métalliques. Une photo ne prouve pas leur bon fonctionnement."],["Comment formuler une demande de photos supplémentaires ?","Indiquez l’article, la zone, l’angle et la mesure souhaités. Vérifiez au préalable la disponibilité et les frais auprès du prestataire."],["Que comparer avec la commande avant l’envoi ?","L’article, la couleur, la taille et la variante. Faites résoudre les différences avant d’approuver l’expédition."],["Comment vérifier les accessoires inclus ?","Comparez le contenu visible avec les éléments explicitement promis par le vendeur. Demandez une photo d’ensemble si nécessaire."],["Faut-il décider de l’emballage avant l’envoi ?","Oui. Précisez ce que vous voulez conserver et la protection nécessaire ; demandez les effets sur le poids et les conditions du service."],["Que faire si un détail important reste flou ?","Posez une question précise avant de donner votre accord. Conservez les photos et la référence de commande."]],"register":"S’inscrire sur Hipobuy","view":"Voir le détail","original":"Voir la source","buy":"Ouvrir sur Hipobuy","source":"Produits mis à jour","imageTitle":"Recherche par image","imageBody":"La recherche par image est indisponible. Le téléversement de photos est désactivé et aucune photo ne sera stockée ici.","back":"Retour aux articles","noResults":"Aucune annonce correspondante.","unavailable":"La source est temporairement indisponible.","independent":"Guide indépendant, non exploité par Hipobuy. Vérifiez les détails du produit avant de commander.","photoNote":"Photos de la source ; aucun dossier QC distinct identifié.","sourceNote":"Vérifiez images, variantes et prix à la source et sur la page d’achat.","page":"Page","next":"Suivant","previous":"Précédent","sorting":"Trier","sortOptions":["Ordre de la source","Prix croissant","Prix décroissant"],"faqGroups":["Lire les photos","Vérifier les dimensions","Demander des gros plans","Avant l’expédition"],"guideHeadings":["Nommer la différence","Repérer ce qui reste invisible","Garder une question précise"],"guideLabel":"Notes de lecture des photos"},"es":{"nav":["Inicio","Todos los productos","Categorías","Búsqueda por imagen"],"eyebrow":"NOTAS DE PRODUCTOS INDEPENDIENTES","title":"Hipobuy Spreadsheet","intro":"Explora productos por categoría, compara fotos y precios, y verifica el artículo en Hipobuy antes de comprar.","search":"Buscar productos","searchButton":"Buscar","categories":"Explorar categorías","latest":"Novedades de la fuente","browse":"Ver todos los productos","guideTitle":"¿Qué merece una segunda mirada?","guide":["Un bolsillo desalineado, un estampado inclinado o un panel distinto ofrece un punto concreto de comparación. Busca esa zona desde otro ángulo: los pliegues y la perspectiva pueden crear una falsa asimetría.\n\nPor ejemplo, compara la distancia de ambos bolsillos a la misma costura con la prenda extendida. Para zapatos, pide una vista trasera de ambos talones juntos y al mismo nivel. Describe la diferencia antes de considerarla un defecto; distintas tallas, colores o posturas no permiten una comparación equivalente.","Una vista frontal no muestra las costuras interiores. Trata los detalles invisibles como dudas pendientes. Una foto adicional útil permite ver el acabado de cerca y conserva suficiente contexto para ubicar la zona.\n\nPide una toma concreta: la costura interior del bolsillo izquierdo o ambos zapatos vistos de frente desde atrás. Para comprobar medidas, la prenda debe estar extendida y verse ambos extremos de la cinta. Un primer plano ayuda a revisar costuras, pero no confirma comodidad, composición ni durabilidad.","Anota junto al identificador del artículo la zona, la foto y lo que falta para decidir. Retoma esa nota cuando lleguen las fotos de tu pedido; las imágenes de referencia no sustituyen esa revisión.\n\nUna nota útil sería: « El bolsillo izquierdo parece más bajo en la foto 3; falta una vista frontal con la camisa extendida. » Añade talla y color. Da la duda por resuelta solo cuando la nueva imagen la responda. Si sigue poco clara, pregunta antes de decidir si conservar el artículo."],"faqTitle":"Preguntas frecuentes","faq":[["¿Qué vistas conviene comparar primero?","Empieza por el frente, la parte trasera y ambos lados. Compara la misma zona desde distintos ángulos."],["¿Por qué cambia el color entre dos fotos?","La luz, la exposición y el balance de blancos afectan al aspecto. Pide una foto con luz neutra si el color es decisivo."],["¿Cómo reviso la simetría de un par?","Pide que coloquen ambas piezas juntas, niveladas y fotografiadas desde el mismo ángulo. La perspectiva puede engañar."],["¿Las fotos muestran todos los defectos?","No. Pueden ocultar costuras internas, daños interiores, olores o el tacto del material."],["¿Cómo debe colocarse una prenda para medirla?","Extendida sin estirar, con ambos extremos de la cinta visibles. Compara la misma medida con una prenda que te quede bien."],["¿Basta con la etiqueta de talla?","No. Las tallas varían; compara las medidas reales y la tabla del vendedor para la variante elegida."],["¿Qué medida puedo pedir de un zapato?","Solicita una medida concreta y viable, como el largo de una plantilla extraíble. No determina por sí sola el ancho ni el ajuste."],["¿Cómo valoro una pequeña diferencia de medida?","Revisa primero el método y la posición de la cinta. No existe una tolerancia aceptable universal para todos los productos."],["¿Qué hace útil una foto de las costuras?","Debe ser nítida, bien iluminada y mostrar la costura y el tejido cercano. Una vista general ayuda a localizarla."],["¿Cómo distingo una marca de una sombra?","Pide otro ángulo con iluminación uniforme. Si sigue visible, solicita una revisión; la foto puede no explicar su causa."],["¿Qué detalles reviso en bolsos y accesorios?","Uniones, bordes, cierres y alineación de las piezas metálicas. Una foto no confirma que una cremallera funcione bien."],["¿Cómo pido fotos adicionales con claridad?","Indica el artículo, la zona, el ángulo y la medida necesaria. Consulta antes la disponibilidad y el coste con el proveedor del servicio."],["¿Qué debo comparar con mi pedido antes del envío?","Artículo, color, talla y variante. Resuelve cualquier diferencia antes de autorizar el envío."],["¿Cómo compruebo los accesorios incluidos?","Compara lo visible con lo prometido expresamente por el vendedor. Pide una foto conjunta si falta mostrar alguna pieza."],["¿Debo decidir el embalaje antes del envío?","Sí. Confirma qué conservar y qué protección necesitas. Consulta los efectos sobre el peso, la protección y las condiciones del servicio."],["¿Qué hago si un detalle importante sigue sin verse?","Pregunta de forma concreta antes de aprobar. Conserva las fotos y la referencia del pedido para identificar el problema."]],"register":"Registrarse en Hipobuy","view":"Ver detalles","original":"Ver página original","buy":"Abrir en Hipobuy","source":"Productos actualizados","imageTitle":"Búsqueda por imagen","imageBody":"La búsqueda por imagen aún no está disponible. No se pueden subir fotos y aquí no se almacena ninguna.","back":"Volver a los productos","noResults":"No se encontraron anuncios.","unavailable":"La fuente no está disponible temporalmente.","independent":"Guía independiente, no administrada por Hipobuy. Comprueba los detalles antes de comprar.","photoNote":"Imágenes del anuncio original; no se identificaron registros QC independientes.","sourceNote":"Verifica imágenes, variantes y precio en la fuente y en la página de compra.","page":"Página","next":"Siguiente","previous":"Anterior","sorting":"Ordenar","sortOptions":["Orden de la fuente","Precio ascendente","Precio descendente"],"faqGroups":["Leer las fotos","Comprobar medidas","Pedir primeros planos","Antes del envío"],"guideHeadings":["Señala la diferencia","Deja abiertas las dudas sin imagen","Guarda una pregunta concreta"],"guideLabel":"Notas para revisar fotos"},"it":{"nav":["Home","Tutti i prodotti","Categorie","Ricerca per immagine"],"eyebrow":"NOTE INDIPENDENTI SUI PRODOTTI","title":"Hipobuy Spreadsheet","intro":"Esplora i prodotti per categoria, confronta foto e prezzi e verifica il prodotto su Hipobuy prima di ordinare.","search":"Cerca prodotti","searchButton":"Cerca","categories":"Esplora le categorie","latest":"Novità dalla fonte","browse":"Vedi tutti i prodotti","guideTitle":"Cosa merita un secondo sguardo?","guide":["Una tasca disallineata, una stampa inclinata o un taglio diverso offre un punto concreto da confrontare. Cerca la stessa zona da un’altra angolazione: pieghe e prospettiva possono creare una falsa asimmetria.\n\nPer esempio, confronta la distanza delle due tasche dalla stessa cucitura con il capo disteso. Per le scarpe, chiedi una vista posteriore dei due talloni affiancati e alla stessa altezza. Descrivi la differenza prima di considerarla un difetto: taglie, colori e posizioni diversi non sono confronti equivalenti.","Una foto frontale non mostra le cuciture interne. Considera aperti i dettagli non visibili. Una foto aggiuntiva utile deve mostrare la finitura da vicino, lasciando abbastanza contesto per riconoscere la zona.\n\nChiedi uno scatto preciso, come la cucitura interna della tasca sinistra o il retro di entrambe le scarpe affiancate. Per le misure, il capo va disteso e devono vedersi inizio e fine del metro. Un primo piano aiuta a valutare le cuciture, ma non dimostra comfort, composizione o durata.","Annota insieme al codice articolo la zona, la foto e ciò che manca per valutarla. Riprendi la nota quando arrivano le foto del tuo ordine: le immagini di riferimento non sostituiscono questo controllo.\n\nUna nota utile è: « Tasca sinistra più bassa nella foto 3; serve una foto frontale del capo disteso. » Aggiungi taglia e colore scelti. Considera risolta la domanda solo quando la nuova foto risponde davvero. Se rimane poco chiara, chiedi ancora prima di decidere se tenere l’articolo."],"faqTitle":"Domande frequenti","faq":[["Quali viste conviene confrontare per prime?","Inizia da davanti, dietro e dai due lati. Confronta le stesse zone da angolazioni diverse."],["Perché il colore cambia tra due foto?","Luce, esposizione e bilanciamento del bianco influenzano il risultato. Chiedi una foto con luce neutra se il colore è decisivo."],["Come controllo la simmetria di un paio?","Chiedi una foto con entrambi gli elementi affiancati, allineati e ripresi dalla stessa angolazione. La prospettiva può ingannare."],["Le foto mostrano ogni difetto?","No. Cuciture nascoste, danni interni, odori e sensazione al tatto possono restare sconosciuti."],["Come va disposto un capo per misurarlo?","Steso senza tenderlo, con le estremità del metro visibili. Confronta la stessa misura con un capo che ti veste bene."],["Basta l’etichetta della taglia?","No. Le taglie variano; confronta misure reali e tabella del venditore per la variante scelta."],["Quale misura posso chiedere per le scarpe?","Una misura precisa e fattibile, come la lunghezza di una soletta estraibile. Non basta a stabilire larghezza o vestibilità."],["Come valuto una piccola differenza nelle misure?","Controlla prima il metodo e la posizione del metro. Non esiste una tolleranza accettabile unica per tutti gli articoli."],["Come deve essere un dettaglio utile delle cuciture?","Nitido e ben illuminato, con tutta la cucitura interessata e il tessuto vicino. Una vista ampia aiuta a localizzarla."],["Come distinguo un segno da un’ombra?","Chiedi un’altra angolazione con luce uniforme. Se resta visibile, chiedi una verifica; la foto può non chiarire la causa."],["Quali dettagli controllare su borse e accessori?","Attacchi, bordi, chiusure e allineamento delle parti metalliche. Una foto non dimostra che una zip funzioni bene."],["Come formulo una richiesta di foto aggiuntive?","Specifica articolo, zona, angolo e misura desiderati. Verifica prima disponibilità e costi con il fornitore del servizio."],["Cosa confronto con l’ordine prima della spedizione?","Articolo, colore, taglia e variante. Risolvi eventuali differenze prima di autorizzare la partenza."],["Come verifico gli accessori inclusi?","Confronta ciò che si vede con quanto promesso espressamente dal venditore. Chiedi una foto d’insieme per gli elementi non mostrati."],["Devo decidere l’imballaggio prima della spedizione?","Sì. Conferma cosa conservare e la protezione necessaria. Chiedi gli effetti su peso, protezione e condizioni del servizio."],["Cosa faccio se un dettaglio importante resta poco chiaro?","Fai una domanda specifica prima di approvare. Conserva foto e riferimento dell’ordine per identificare il problema."]],"register":"Registrati su Hipobuy","view":"Vedi dettagli","original":"Controlla la fonte","buy":"Apri su Hipobuy","source":"Prodotti aggiornati","imageTitle":"Ricerca per immagine","imageBody":"La ricerca per immagine non è ancora disponibile. Il caricamento delle foto è disattivato e qui non vengono salvate immagini.","back":"Torna ai prodotti","noResults":"Nessun annuncio corrispondente.","unavailable":"La fonte non è temporaneamente disponibile.","independent":"Guida indipendente, non gestita da Hipobuy. Verifica i dettagli prima di ordinare.","photoNote":"Foto della fonte; nessun record QC distinto identificato.","sourceNote":"Controlla immagini, varianti e prezzo sulla fonte e sulla pagina di acquisto.","page":"Pagina","next":"Successiva","previous":"Precedente","sorting":"Ordina","sortOptions":["Ordine della fonte","Prezzo crescente","Prezzo decrescente"],"faqGroups":["Leggere le foto","Controllare le misure","Richiedere dettagli","Prima della spedizione"],"guideHeadings":["Individua la differenza","Lascia aperti i dettagli non visibili","Conserva una domanda precisa"],"guideLabel":"Appunti sulle foto"},"pt":{"nav":["Início","Todos os produtos","Categorias","Pesquisa por imagem"],"eyebrow":"NOTAS INDEPENDENTES DE PRODUTOS","title":"Hipobuy Spreadsheet","intro":"Explore produtos por categoria, compare fotos e preços e confirme o artigo na Hipobuy antes de comprar.","search":"Pesquisar produtos","searchButton":"Pesquisar","categories":"Explorar categorias","latest":"Novidades da origem","browse":"Ver todos os produtos","guideTitle":"O que merece uma segunda olhada?","guide":["Um bolso desalinhado, uma estampa inclinada ou um recorte diferente oferece um ponto concreto de comparação. Veja a mesma área por outro ângulo: dobras e perspectiva podem criar uma falsa assimetria.\n\nPor exemplo, compare a distância dos dois bolsos até a mesma costura com a peça estendida. Para calçados, peça uma vista traseira dos dois calcanhares lado a lado e no mesmo nível. Descreva a diferença antes de considerá-la um defeito; tamanhos, cores ou posições diferentes não são comparações equivalentes.","Uma vista frontal não mostra as costuras internas. Trate os detalhes invisíveis como dúvidas pendentes. Uma foto adicional útil mostra o acabamento de perto e mantém contexto suficiente para localizar a área.\n\nPeça uma imagem específica: a costura interna do bolso esquerdo ou a parte traseira dos dois calçados lado a lado. Para medidas, a peça deve estar estendida, com início e fim da fita visíveis. Uma foto próxima ajuda a avaliar costuras, mas não comprova conforto, composição ou durabilidade.","Anote junto ao código do produto a área, a foto e o que falta para avaliar. Retome a nota quando chegarem as fotos do seu pedido; as imagens de referência não substituem essa conferência.\n\nUma nota útil seria: “Bolso esquerdo parece mais baixo na foto 3; preciso de uma vista frontal da camisa estendida.” Inclua tamanho e cor. Considere a dúvida resolvida apenas quando a nova imagem responder. Se ainda não estiver claro, pergunte antes de decidir se fica com o produto."],"faqTitle":"Perguntas frequentes","faq":[["Que vistas devo comparar primeiro?","Comece pela frente, pelas costas e pelos dois lados. Compare as mesmas zonas sob ângulos diferentes."],["Porque muda a cor entre duas fotografias?","A luz, a exposição e o equilíbrio de brancos alteram o aspeto. Peça uma foto com luz neutra se a cor for decisiva."],["Como verifico a simetria de um par?","Peça os dois elementos lado a lado, nivelados e fotografados do mesmo ângulo. A perspetiva pode enganar."],["As fotografias mostram todos os defeitos?","Não. Costuras ocultas, danos internos, odores e o toque do material podem não ser avaliáveis."],["Como colocar uma peça de roupa para a medir?","Estendida sem esticar, com as extremidades da fita visíveis. Compare a mesma medida com uma peça que lhe assente bem."],["A etiqueta do tamanho é suficiente?","Não. Os tamanhos variam; compare medidas reais e a tabela do vendedor para a variante escolhida."],["Que medida posso pedir para calçado?","Uma medida concreta e viável, como o comprimento de uma palmilha removível. Não determina sozinha a largura nem o ajuste."],["Como avaliar uma pequena diferença de medida?","Confirme primeiro o método e a posição da fita. Não há uma tolerância aceitável universal para todos os produtos."],["Como deve ser uma foto útil das costuras?","Nítida e bem iluminada, mostrando a costura afetada e o tecido próximo. Uma vista geral ajuda a localizar a zona."],["Como distinguir uma marca de uma sombra?","Peça outro ângulo com luz uniforme. Se continuar visível, solicite uma verificação; a foto pode não revelar a causa."],["Que detalhes verificar em malas e acessórios?","Pontos de fixação, bordos, fechos e alinhamento das peças metálicas. Uma foto não demonstra que um fecho funciona bem."],["Como pedir fotografias adicionais com clareza?","Indique artigo, zona, ângulo e medida desejados. Confirme antes a disponibilidade e os custos com o prestador."],["O que comparar com a encomenda antes do envio?","Artigo, cor, tamanho e variante. Resolva diferenças antes de autorizar a expedição."],["Como verificar os acessórios incluídos?","Compare o conteúdo visível com o que o vendedor prometeu expressamente. Peça uma foto conjunta se faltarem elementos nas imagens."],["Devo decidir a embalagem antes do envio?","Sim. Confirme o que pretende conservar e a proteção necessária. Pergunte pelos efeitos no peso, proteção e condições do serviço."],["E se um detalhe importante continuar pouco claro?","Faça uma pergunta específica antes de aprovar. Guarde as fotografias e a referência da encomenda."]],"register":"Registar na Hipobuy","view":"Ver detalhes","original":"Ver página de origem","buy":"Abrir na Hipobuy","source":"Produtos atualizados","imageTitle":"Pesquisa por imagem","imageBody":"A pesquisa por imagem ainda não está disponível. O envio de fotos está desativado e nenhuma foto é guardada aqui.","back":"Voltar aos produtos","noResults":"Nenhum anúncio encontrado.","unavailable":"A origem está temporariamente indisponível.","independent":"Guia independente, não operado pela Hipobuy. Confirme os detalhes antes de encomendar.","photoNote":"Imagens da origem; nenhum registo QC separado identificado.","sourceNote":"Confirme imagens, variantes e preço na origem e na página de compra.","page":"Página","next":"Seguinte","previous":"Anterior","sorting":"Ordenar","sortOptions":["Ordem da origem","Preço crescente","Preço decrescente"],"faqGroups":["Ler as fotografias","Conferir medidas","Pedir detalhes","Antes do envio"],"guideHeadings":["Identifique a diferença","Deixe em aberto o que não aparece","Guarde uma pergunta específica"],"guideLabel":"Notas de análise das fotos"},"pl":{"nav":["Strona główna","Wszystkie produkty","Kategorie","Wyszukiwanie obrazem"],"eyebrow":"NIEZALEŻNY KATALOG PRODUKTÓW","title":"Hipobuy Spreadsheet","intro":"Przeglądaj produkty według kategorii, porównuj zdjęcia i ceny, a przed zamówieniem sprawdź ofertę na Hipobuy.","search":"Szukaj produktów","searchButton":"Szukaj","categories":"Przeglądaj kategorie","latest":"Polecane produkty","browse":"Zobacz wszystkie produkty","guideTitle":"Co warto obejrzeć ponownie?","guide":["Nierówna kieszeń, przekrzywiony nadruk lub inny kształt panelu daje konkretny punkt porównania. Sprawdź to miejsce z innej strony: fałdy i perspektywa mogą tworzyć pozorną asymetrię.\n\nNa przykład porównaj odległość obu kieszeni od tego samego szwu przy ubraniu rozłożonym płasko. Przy butach poproś o zdjęcie obu pięt od tyłu na jednym poziomie. Najpierw opisz różnicę, zamiast od razu uznawać ją za wadę. Różne rozmiary, kolory i ułożenia nie dają równoważnego porównania.","Zdjęcie z przodu nie pokazuje wykończenia szwów wewnątrz. Niewidoczne szczegóły pozostają pytaniem. Przydatne dodatkowe zdjęcie pokazuje detal z bliska oraz otoczenie pozwalające rozpoznać miejsce.\n\nPoproś o konkretny kadr, na przykład szew wewnątrz lewej kieszeni albo oba buty ustawione obok siebie od tyłu. Przy pomiarach produkt powinien leżeć płasko, a początek i koniec miarki być widoczne. Zbliżenie pomaga ocenić szwy, ale nie potwierdza wygody, składu materiału ani trwałości.","Przy numerze produktu zapisz miejsce, zdjęcie i informację potrzebną do oceny. Wróć do notatki po otrzymaniu zdjęć własnego zamówienia; zdjęcia referencyjne nie zastępują tej kontroli.\n\nPrzykład notatki: „Lewa kieszeń wydaje się niższa na zdjęciu 3; potrzebne zdjęcie koszuli na płasko od przodu”. Dodaj wybrany rozmiar i kolor. Zamknij pytanie dopiero, gdy nowe zdjęcie na nie odpowie. Jeśli nadal jest niejasne, zapytaj ponownie przed decyzją o zatrzymaniu produktu."],"faqTitle":"Często zadawane pytania","faq":[["Które ujęcia porównać najpierw?","Zacznij od przodu, tyłu i obu boków. Porównuj te same miejsca z różnych perspektyw."],["Dlaczego kolor różni się na dwóch zdjęciach?","Światło, ekspozycja i balans bieli zmieniają wygląd. Jeśli kolor ma znaczenie, poproś o zdjęcie w neutralnym świetle."],["Jak sprawdzić symetrię pary?","Poproś o ułożenie obu elementów obok siebie, równo i sfotografowanie pod tym samym kątem. Perspektywa może mylić."],["Czy zdjęcia ujawnią każdą wadę?","Nie. Ukryte szwy, uszkodzenia wewnętrzne, zapach i dotyk materiału mogą pozostać niewidoczne."],["Jak ułożyć ubranie do pomiaru?","Na płasko, bez rozciągania, z widocznymi końcami miarki. Porównaj ten sam wymiar z pasującym ubraniem."],["Czy metka z rozmiarem wystarczy?","Nie. Rozmiarówki się różnią; porównaj rzeczywiste wymiary i tabelę sprzedawcy dla wybranego wariantu."],["O jaki pomiar butów poprosić?","O konkretny wykonalny pomiar, np. długość wyjmowanej wkładki. Sam nie określa szerokości ani dopasowania."],["Jak ocenić niewielką różnicę wymiarów?","Najpierw sprawdź metodę i ułożenie miarki. Nie ma jednej dopuszczalnej tolerancji dla wszystkich produktów."],["Jak wygląda przydatne zbliżenie szwu?","Jest ostre, dobrze oświetlone i pokazuje cały problematyczny szew wraz z otoczeniem. Szersze ujęcie pomaga go zlokalizować."],["Jak odróżnić ślad od cienia?","Poproś o inny kąt i równomierne światło. Jeśli ślad pozostaje, zapytaj o sprawdzenie; zdjęcie może nie wyjaśnić przyczyny."],["Co sprawdzać w torbach i dodatkach?","Mocowania, krawędzie, zapięcia i ułożenie metalowych części. Zdjęcie nie potwierdza sprawnego działania zamka."],["Jak jasno poprosić o dodatkowe zdjęcia?","Podaj produkt, miejsce, kąt i potrzebny pomiar. Wcześniej zapytaj usługodawcę o dostępność i opłaty."],["Co porównać z zamówieniem przed wysyłką?","Produkt, kolor, rozmiar i wariant. Wyjaśnij różnice przed zatwierdzeniem wysyłki."],["Jak sprawdzić dołączone akcesoria?","Porównaj widoczną zawartość z elementami wyraźnie obiecanymi przez sprzedawcę. Poproś o wspólne zdjęcie niewidocznych części."],["Czy ustalić opakowanie przed wysyłką?","Tak. Potwierdź, co zachować i jakiej ochrony potrzebujesz. Zapytaj o wpływ zmian na wagę, ochronę i warunki usługi."],["Co zrobić, jeśli ważny szczegół jest niejasny?","Zadaj konkretne pytanie przed zatwierdzeniem. Zachowaj zdjęcia i numer zamówienia, aby wskazać problem."]],"register":"Zarejestruj się w Hipobuy","view":"Zobacz szczegóły","original":"Sprawdź stronę źródłową","buy":"Otwórz w Hipobuy","source":"Aktualna lista produktów","imageTitle":"Wyszukiwanie obrazem","imageBody":"Wyszukiwanie obrazem nie jest jeszcze dostępne. Przesyłanie zdjęć jest wyłączone; zdjęcia nie są tu przechowywane.","back":"Wróć do produktów","noResults":"Nie znaleziono pasujących produktów.","unavailable":"Źródło jest chwilowo niedostępne. Spróbuj ponownie później.","independent":"Niezależny katalog produktów, nieprowadzony przez Hipobuy. Przed zakupem sprawdź szczegóły oferty.","photoNote":"Zdjęcia ze strony źródłowej; nie znaleziono oddzielnych zapisów QC.","sourceNote":"Sprawdź zdjęcia, warianty i cenę na stronie źródłowej oraz na stronie zakupu.","page":"Strona","next":"Następna","previous":"Poprzednia","sorting":"Sortuj","sortOptions":["Kolejność źródłowa","Cena rosnąco","Cena malejąco"],"faqGroups":["Odczytywanie zdjęć","Sprawdzanie wymiarów","Prośby o zbliżenia","Przed wysyłką"],"guideHeadings":["Nazwij konkretną różnicę","Zostaw niewidoczne szczegóły do sprawdzenia","Zapisz precyzyjne pytanie"],"guideLabel":"Notatki z oglądania zdjęć"},"da":{"nav":["Forside","Alle varer","Kategorier","Billedsøgning"],"eyebrow":"UAFHÆNGIG PRODUKTOVERSIGT","title":"Hipobuy Spreadsheet","intro":"Gennemse varer efter kategori, sammenlign billeder og priser, og kontrollér varen på Hipobuy før bestilling.","search":"Søg efter varer","searchButton":"Søg","categories":"Gennemse kategorier","latest":"Udvalgte varer","browse":"Se alle varer","guideTitle":"Hvad fortjener et ekstra kig?","guide":["En skæv lomme, et skråt tryk eller en anden panelform giver noget konkret at sammenligne. Se samme område fra en anden vinkel: folder og perspektiv kan skabe en falsk asymmetri.\n\nSammenlign for eksempel begge lommers afstand til samme søm med tøjet lagt fladt. Ved sko hjælper et lige billede bagfra af begge hæle ved siden af hinanden. Beskriv forskellen, før du kalder den en fejl; forskellige størrelser, farver eller placeringer giver ikke en ensartet sammenligning.","Et billede forfra viser ikke de indvendige sømme. Behandl usete detaljer som åbne spørgsmål. Et nyttigt ekstra billede viser detaljen tæt på og nok af omgivelserne til at placere den.\n\nBed om et bestemt billede, eksempelvis sømmen inde i venstre lomme eller begge sko lige bagfra. Ved mål skal varen ligge fladt, og målebåndets start og slutning være synlige. Et nærbillede hjælper med at vurdere syninger, men bekræfter ikke komfort, materialesammensætning eller holdbarhed.","Notér område, billede og manglende information sammen med varens ID. Brug noten igen, når billederne af din egen ordre kommer; referencebilleder erstatter ikke denne kontrol.\n\nEn note kan lyde: “Venstre lomme virker lavere på billede 3; mangler et lige billede med skjorten lagt fladt.” Tilføj størrelse og farve. Luk først spørgsmålet, når det nye billede besvarer det. Er det stadig uklart, så spørg igen, før du beslutter at beholde varen."],"faqTitle":"Ofte stillede spørgsmål","faq":[["Hvilke vinkler bør jeg sammenligne først?","Begynd med forside, bagside og begge sider. Sammenlign de samme områder fra flere vinkler."],["Hvorfor varierer farven mellem to billeder?","Lys, eksponering og hvidbalance ændrer udseendet. Bed om et foto i neutralt lys, hvis farven er afgørende."],["Hvordan undersøger jeg symmetrien i et par?","Bed om begge dele ved siden af hinanden, plant placeret og fotograferet fra samme vinkel. Perspektivet kan snyde."],["Afslører billeder alle fejl?","Nej. Skjulte sømme, indvendige skader, lugt og materialets følelse kan forblive ukendte."],["Hvordan skal tøj ligge ved måling?","Fladt uden at blive strakt, med målebåndets ender synlige. Sammenlign samme mål på tøj, der passer dig."],["Er størrelsesmærket nok?","Nej. Størrelser varierer; sammenlign faktiske mål og sælgerens tabel for den valgte variant."],["Hvilket skomål kan jeg bede om?","Et præcist og muligt mål, eksempelvis længden på en udtagelig indersål. Det fastslår ikke bredde eller samlet pasform."],["Hvordan vurderer jeg en lille måleforskel?","Tjek først metoden og målebåndets placering. Der findes ingen fælles acceptabel tolerance for alle varer."],["Hvad gør et nærbillede af sømme nyttigt?","Det skal være skarpt og godt belyst og vise hele den berørte søm samt stoffet omkring. Et oversigtsfoto hjælper med placeringen."],["Hvordan skelner jeg et mærke fra en skygge?","Bed om en anden vinkel i jævnt lys. Hvis mærket består, bed om en undersøgelse; billedet forklarer ikke altid årsagen."],["Hvad bør jeg se på ved tasker og tilbehør?","Fastgørelser, kanter, lukninger og metaldelenes placering. Et foto beviser ikke, at en lynlås fungerer let."],["Hvordan beder jeg tydeligt om ekstra billeder?","Angiv varen, området, vinklen og det ønskede mål. Spørg udbyderen om mulighed og pris på forhånd."],["Hvad skal jeg sammenholde med ordren før afsendelse?","Vare, farve, størrelse og variant. Få forskelle afklaret, før du godkender afsendelsen."],["Hvordan kontrollerer jeg medfølgende tilbehør?","Sammenlign det synlige med det, sælgeren udtrykkeligt lover. Bed om et samlet foto, hvis dele ikke vises."],["Skal emballagen aftales før afsendelse?","Ja. Bekræft, hvad du vil beholde, og hvilken beskyttelse du ønsker. Spørg til betydningen for vægt, beskyttelse og servicevilkår."],["Hvad hvis en vigtig detalje stadig er uklar?","Stil et konkret spørgsmål før godkendelse. Gem billeder og ordrenummer, så problemet kan identificeres."]],"register":"Opret konto hos Hipobuy","view":"Se detaljer","original":"Se kildesiden","buy":"Åbn hos Hipobuy","source":"Opdaterede varer","imageTitle":"Billedsøgning","imageBody":"Billedsøgning er endnu ikke tilgængelig. Billeder kan ikke uploades eller gemmes her.","back":"Tilbage til varer","noResults":"Ingen matchende varer fundet.","unavailable":"Kilden er midlertidigt utilgængelig. Prøv igen senere.","independent":"Uafhængig produktoversigt, ikke drevet af Hipobuy. Kontrollér detaljer før bestilling.","photoNote":"Billeder fra kilden; ingen særskilt QC-registrering fundet.","sourceNote":"Kontrollér billeder, varianter og pris hos kilden og på købssiden.","page":"Side","next":"Næste","previous":"Forrige","sorting":"Sortér","sortOptions":["Kildens rækkefølge","Pris: lav til høj","Pris: høj til lav"],"faqGroups":["Læs billederne","Kontrollér mål","Bed om nærbilleder","Før afsendelse"],"guideHeadings":["Sæt ord på forskellen","Lad usete detaljer stå åbne","Gem et konkret spørgsmål"],"guideLabel":"Noter til billedgennemgang"},"no":{"nav":["Forside","Alle varer","Kategorier","Bildesøk"],"eyebrow":"UAVHENGIG PRODUKTOVERSIKT","title":"Hipobuy Spreadsheet","intro":"Se varer etter kategori, sammenlign bilder og priser, og kontroller varen på Hipobuy før bestilling.","search":"Søk etter varer","searchButton":"Søk","categories":"Se kategorier","latest":"Utvalgte varer","browse":"Se alle varer","guideTitle":"Hva fortjener en ekstra titt?","guide":["En skjev lomme, et skrått trykk eller en annen panelform gir noe konkret å sammenligne. Se samme område fra en annen vinkel: folder og perspektiv kan skape en falsk asymmetri.\n\nSammenlign for eksempel begge lommenes avstand til samme søm med plagget lagt flatt. For sko hjelper et rett bilde bakfra av begge hælene ved siden av hverandre. Beskriv forskjellen før du kaller den en feil; ulike størrelser, farger eller plasseringer gir ikke en likeverdig sammenligning.","Et bilde forfra viser ikke de innvendige sømmene. Behandle usette detaljer som åpne spørsmål. Et nyttig ekstrabilde viser detaljen på nært hold og nok av omgivelsene til å plassere den.\n\nBe om et bestemt bilde, for eksempel sømmen inne i venstre lomme eller begge sko rett bakfra. Ved mål bør varen ligge flatt, med målebåndets start og slutt synlig. Et nærbilde hjelper med å vurdere sømmer, men bekrefter ikke komfort, materialsammensetning eller holdbarhet.","Noter område, bilde og manglende informasjon sammen med varens ID. Bruk notatet igjen når bildene av din egen ordre kommer; referansebilder erstatter ikke denne kontrollen.\n\nEt notat kan lyde: “Venstre lomme virker lavere på bilde 3; trenger et rett bilde med skjorten lagt flatt.” Legg til størrelse og farge. Avslutt spørsmålet først når det nye bildet besvarer det. Er det fortsatt uklart, spør igjen før du bestemmer deg for å beholde varen."],"faqTitle":"Vanlige spørsmål","faq":[["Hvilke vinkler bør jeg sammenligne først?","Start med forsiden, baksiden og begge sidene. Sammenlign de samme områdene fra flere vinkler."],["Hvorfor varierer fargen mellom to bilder?","Lys, eksponering og hvitbalanse endrer inntrykket. Be om et bilde i nøytralt lys hvis fargen er avgjørende."],["Hvordan kontrollerer jeg symmetrien i et par?","Be om begge delene ved siden av hverandre, plant plassert og fotografert fra samme vinkel. Perspektivet kan villede."],["Avslører bilder alle feil?","Nei. Skjulte sømmer, innvendige skader, lukt og materialfølelse kan forbli ukjent."],["Hvordan skal klær ligge ved måling?","Flatt uten strekk, med målebåndets endepunkter synlige. Sammenlign samme mål på et plagg som passer deg."],["Er størrelsesmerket tilstrekkelig?","Nei. Størrelser varierer; sammenlign faktiske mål og selgerens tabell for valgt variant."],["Hvilket skomål kan jeg be om?","Et tydelig angitt, gjennomførbart mål, som lengden på en uttakbar innersåle. Det fastslår ikke bredde eller samlet passform."],["Hvordan vurderer jeg et lite måleavvik?","Kontroller først metoden og målebåndets plassering. Ingen felles akseptabel toleranse gjelder alle varer."],["Hva gjør et nærbilde av sømmer nyttig?","Det bør være skarpt og godt belyst og vise hele den aktuelle sømmen med stoffet rundt. Et oversiktsbilde viser plasseringen."],["Hvordan skiller jeg et merke fra en skygge?","Be om en annen vinkel i jevnt lys. Hvis merket fortsatt vises, be om kontroll; bildet forklarer ikke nødvendigvis årsaken."],["Hva bør jeg se på ved vesker og tilbehør?","Festepunkter, kanter, lukkinger og metalldelenes plassering. Et stillbilde viser ikke at en glidelås fungerer jevnt."],["Hvordan ber jeg tydelig om ekstra bilder?","Oppgi varen, området, vinkelen og ønsket mål. Spør tjenesteleverandøren om mulighet og kostnad først."],["Hva skal jeg sammenholde med ordren før sending?","Vare, farge, størrelse og variant. Avklar forskjeller før du godkjenner sendingen."],["Hvordan kontrollerer jeg medfølgende tilbehør?","Sammenlign det synlige med det selgeren uttrykkelig har lovet. Be om et samlet bilde dersom deler ikke vises."],["Bør emballasjen avklares før sending?","Ja. Bekreft hva som skal beholdes og nødvendig beskyttelse. Spør om virkningen på vekt, beskyttelse og tjenestevilkår."],["Hva om en viktig detalj fortsatt er uklar?","Still et konkret spørsmål før godkjenning. Ta vare på bilder og ordrereferanse for å identifisere problemet."]],"register":"Registrer deg på Hipobuy","view":"Se detaljer","original":"Sjekk kildesiden","buy":"Åpne på Hipobuy","source":"Oppdaterte varer","imageTitle":"Bildesøk","imageBody":"Bildesøk er ikke tilgjengelig ennå. Bilder kan ikke lastes opp eller lagres her.","back":"Tilbake til varer","noResults":"Ingen varer funnet.","unavailable":"Kilden er midlertidig utilgjengelig. Prøv igjen senere.","independent":"Uavhengig produktoversikt, ikke drevet av Hipobuy. Kontroller detaljene før kjøp.","photoNote":"Bilder fra kilden; ingen separat QC-registrering funnet.","sourceNote":"Kontroller bilder, varianter og pris hos kilden og på kjøpssiden.","page":"Side","next":"Neste","previous":"Forrige","sorting":"Sorter","sortOptions":["Kildens rekkefølge","Pris: lav til høy","Pris: høy til lav"],"faqGroups":["Les bildene","Kontroller mål","Be om nærbilder","Før sending"],"guideHeadings":["Sett ord på forskjellen","La usette detaljer stå åpne","Ta vare på et konkret spørsmål"],"guideLabel":"Notater til bildegjennomgang"},"sv":{"nav":["Start","Alla varor","Kategorier","Bildsökning"],"eyebrow":"OBEROENDE PRODUKTÖVERSIKT","title":"Hipobuy Spreadsheet","intro":"Bläddra efter kategori, jämför bilder och priser och kontrollera varan på Hipobuy före beställning.","search":"Sök produkter","searchButton":"Sök","categories":"Bläddra bland kategorier","latest":"Utvalda varor","browse":"Visa alla varor","guideTitle":"Vad förtjänar en andra titt?","guide":["En sned ficka, ett lutande tryck eller en annan panelform ger en konkret jämförelsepunkt. Se samma område från en annan vinkel: veck och perspektiv kan skapa en falsk asymmetri.\n\nJämför exempelvis båda fickornas avstånd till samma söm med plagget plant. För skor hjälper en rak bild bakifrån av båda hälarna bredvid varandra. Beskriv skillnaden innan du kallar den ett fel; olika storlekar, färger eller placeringar ger inte en likvärdig jämförelse.","En bild framifrån visar inte sömmarna på insidan. Behandla osynliga detaljer som öppna frågor. En användbar extrabild visar detaljen nära och tillräckligt av omgivningen för att hitta rätt plats.\n\nBe om en bestämd bild, exempelvis sömmen inuti vänster ficka eller båda skorna rakt bakifrån. Vid mått ska varan ligga plant, med måttbandets början och slut synliga. En närbild hjälper vid granskning av sömmar, men bekräftar inte komfort, materialsammansättning eller hållbarhet.","Anteckna område, bild och saknad information vid produktens ID. Gå tillbaka till anteckningen när bilderna på din egen beställning kommer; referensbilder ersätter inte den kontrollen.\n\nEn anteckning kan lyda: ”Vänster ficka verkar lägre på bild 3; behöver en rak bild med skjortan plant.” Lägg till storlek och färg. Avsluta frågan först när den nya bilden besvarar den. Är det fortfarande oklart, fråga igen innan du bestämmer dig för att behålla varan."],"faqTitle":"Vanliga frågor","faq":[["Vilka vinklar bör jag jämföra först?","Börja med framifrån, bakifrån och båda sidorna. Jämför samma områden från flera vinklar."],["Varför varierar färgen mellan två bilder?","Ljus, exponering och vitbalans ändrar intrycket. Be om en bild i neutralt ljus om färgen är avgörande."],["Hur kontrollerar jag symmetrin i ett par?","Be om båda delarna bredvid varandra, plant placerade och fotograferade från samma vinkel. Perspektivet kan vilseleda."],["Avslöjar bilder alla fel?","Nej. Dolda sömmar, invändiga skador, lukt och materialets känsla kan förbli okända."],["Hur ska kläder ligga vid mätning?","Platt utan att sträckas, med måttbandets ändpunkter synliga. Jämför samma mått på ett plagg som passar dig."],["Räcker storleksetiketten?","Nej. Storlekar varierar; jämför faktiska mått och säljarens tabell för den valda varianten."],["Vilket skomått kan jag be om?","Ett tydligt och genomförbart mått, till exempel längden på en uttagbar innersula. Det avgör inte bredd eller fullständig passform."],["Hur bedömer jag en liten måttskillnad?","Kontrollera först metoden och måttbandets placering. Det finns ingen gemensam godtagbar tolerans för alla varor."],["Vad gör en närbild av sömmar användbar?","Den ska vara skarp och väl belyst och visa hela den berörda sömmen med tyget runt. En översiktsbild visar platsen."],["Hur skiljer jag ett märke från en skugga?","Be om en annan vinkel i jämnt ljus. Om märket kvarstår, be om kontroll; bilden förklarar inte alltid orsaken."],["Vad bör jag granska på väskor och tillbehör?","Fästen, kanter, stängningar och metalldelarnas placering. Ett foto bevisar inte att en dragkedja fungerar smidigt."],["Hur ber jag tydligt om extra bilder?","Ange vara, område, vinkel och önskat mått. Fråga tjänsteleverantören om möjligheten och kostnaden först."],["Vad ska jag jämföra med ordern före leverans?","Vara, färg, storlek och variant. Red ut skillnader innan du godkänner avsändningen."],["Hur kontrollerar jag medföljande tillbehör?","Jämför det synliga med vad säljaren uttryckligen lovar. Be om ett samlat foto om delar inte visas."],["Bör jag bestämma emballage före leverans?","Ja. Bekräfta vad som ska sparas och vilket skydd som behövs. Fråga om påverkan på vikt, skydd och tjänstens villkor."],["Vad gör jag om en viktig detalj är oklar?","Ställ en konkret fråga före godkännandet. Spara bilderna och orderreferensen för att identifiera problemet."]],"register":"Registrera dig hos Hipobuy","view":"Visa detaljer","original":"Kontrollera källsidan","buy":"Öppna hos Hipobuy","source":"Aktuella produktlistor","imageTitle":"Bildsökning","imageBody":"Bildsökning är ännu inte tillgänglig. Bilder kan inte laddas upp eller sparas här.","back":"Tillbaka till varor","noResults":"Inga matchande varor hittades.","unavailable":"Källan är tillfälligt otillgänglig. Försök igen senare.","independent":"Oberoende produktöversikt, inte driven av Hipobuy. Kontrollera detaljerna före köp.","photoNote":"Bilder från källan; inga separata QC-poster hittades.","sourceNote":"Kontrollera bilder, varianter och pris hos källan och på köpsidan.","page":"Sida","next":"Nästa","previous":"Föregående","sorting":"Sortera","sortOptions":["Källans ordning","Pris: lågt till högt","Pris: högt till lågt"],"faqGroups":["Läs bilderna","Kontrollera mått","Be om närbilder","Före leverans"],"guideHeadings":["Sätt ord på skillnaden","Låt osynliga detaljer vara öppna frågor","Spara en konkret fråga"],"guideLabel":"Anteckningar om bilder"},"ko":{"nav":["홈","전체 상품","카테고리","이미지 검색"],"eyebrow":"독립 상품 안내","title":"Hipobuy Spreadsheet","intro":"카테고리별로 상품을 보고 사진과 가격을 비교한 뒤 Hipobuy에서 주문 전 다시 확인하세요.","search":"상품 검색","searchButton":"검색","categories":"카테고리 보기","latest":"추천 상품","browse":"전체 상품 보기","guideTitle":"어떤 부분을 다시 봐야 할까요?","guide":["높이가 다른 주머니, 기울어진 프린트, 다른 패널 모양은 구체적인 비교 지점이 됩니다. 같은 부분을 다른 각도에서도 보세요. 옷의 주름과 촬영 각도 때문에 비대칭처럼 보일 수 있습니다.\n\n예를 들어 양쪽 주머니 높이가 달라 보이면 옷을 평평하게 펼친 상태에서 같은 봉제선까지의 거리를 비교하세요. 신발은 두 뒤꿈치를 나란히 놓고 수평으로 찍은 뒷면 사진이 도움이 됩니다. 먼저 보이는 차이를 설명한 뒤 결함인지 판단하세요. 사이즈, 색상, 놓인 자세가 다른 사진을 동일한 조건처럼 비교하지 마세요.","정면 사진만으로는 안쪽 봉제 마감을 알 수 없습니다. 보이지 않는 부분은 확인할 질문으로 남겨 두세요. 추가 사진은 세부가 보일 만큼 가까우면서 어느 부위인지 알 수 있을 만큼 주변도 보여야 합니다.\n\n“왼쪽 주머니 안쪽 봉제선” 또는 “두 신발을 나란히 놓은 정후면”처럼 필요한 장면을 지정하세요. 치수 확인에는 상품을 평평하게 놓고 줄자의 시작과 끝이 모두 보이는 사진이 필요합니다. 근접 사진은 봉제 상태 판단에 도움이 되지만 착용감, 소재 성분, 내구성까지 확인해 주지는 않습니다.","상품 번호와 함께 신경 쓰이는 부위, 해당 사진, 판단에 필요한 정보를 적어 두세요. 본인 주문의 사진이 도착하면 이 기록으로 다시 확인하세요. 참고 상품 사진이 이 확인을 대신할 수는 없습니다.\n\n“사진 3에서 왼쪽 주머니가 낮아 보임. 셔츠를 평평하게 펼친 정면 사진 필요”처럼 기록할 수 있습니다. 선택한 사이즈와 색상도 적어 다른 옵션과 혼동하지 않도록 하세요. 새 사진이 실제로 답을 줄 때만 확인 완료로 표시하세요. 여전히 불명확하다면 상품을 보유할지 결정하기 전에 다시 문의하세요."],"faqTitle":"자주 묻는 질문","faq":[["어떤 각도부터 비교하면 좋나요?","앞면, 뒷면과 양옆부터 살펴보세요. 한 장의 확대 사진만 보지 말고 같은 부분을 여러 각도에서 비교하세요."],["같은 상품의 색상이 사진마다 다른 이유는 무엇인가요?","조명, 노출과 화이트밸런스가 색 표현을 바꿀 수 있습니다. 색상이 중요하다면 중립적인 조명에서 촬영을 요청하세요."],["한 쌍의 좌우 대칭은 어떻게 확인하나요?","두 개를 나란히 평평하게 놓고 같은 각도에서 찍어 달라고 요청하세요. 원근 때문에 모양이 다르게 보일 수 있습니다."],["사진으로 모든 결함을 알 수 있나요?","아닙니다. 숨겨진 봉제선, 내부 손상, 냄새나 촉감은 확인하기 어려울 수 있습니다."],["옷은 어떻게 놓고 치수를 재야 하나요?","늘리지 않고 평평하게 놓으며 줄자의 시작과 끝이 보여야 합니다. 잘 맞는 옷의 같은 부위를 측정해 비교하세요."],["사이즈 라벨만으로 맞는지 판단해도 되나요?","아닙니다. 사이즈 기준은 다르므로 선택한 옵션의 실측과 판매자 사이즈표를 비교하세요."],["신발은 어떤 치수를 요청할 수 있나요?","분리 가능한 깔창의 길이처럼 구체적이고 가능한 측정을 요청하세요. 길이만으로 너비나 전체 착용감을 판단할 수는 없습니다."],["실측에 작은 차이가 있으면 어떻게 보나요?","먼저 측정 방법과 줄자 위치를 확인하세요. 모든 상품에 적용되는 허용 오차는 없으므로 필요한 핏을 기준으로 판단하세요."],["봉제선 확대 사진은 어떻게 찍혀야 유용한가요?","선명하고 밝아야 하며 해당 봉제선 전체와 주변 원단이 보여야 합니다. 위치를 알 수 있는 넓은 사진도 도움이 됩니다."],["자국인지 그림자인지 어떻게 구분하나요?","고른 조명에서 다른 각도로 촬영을 요청하세요. 자국이 계속 보이면 확인을 부탁하세요. 사진만으로 원인을 확정하기는 어렵습니다."],["가방과 액세서리에서 어떤 부분을 확인하나요?","연결 부위, 가장자리, 잠금장치와 금속 부품의 정렬을 보세요. 사진만으로 지퍼나 잠금장치가 부드럽게 작동하는지는 알 수 없습니다."],["추가 사진은 어떻게 구체적으로 요청하나요?","상품, 부위, 각도와 필요한 치수를 명시하세요. 요청 전에 서비스 제공자에게 가능 여부와 비용을 확인하세요."],["발송 승인 전에 주문과 무엇을 대조해야 하나요?","상품, 색상, 사이즈와 선택한 옵션을 비교하세요. 다른 점은 서비스 제공자와 해결한 뒤 승인하세요."],["포함된 구성품은 어떻게 확인하나요?","판매자가 명확히 약속한 구성과 사진 속 물품을 비교하세요. 예상한 구성품이 보이지 않으면 함께 찍은 사진을 요청하세요."],["포장은 발송 전에 정해야 하나요?","네. 유지할 포장과 필요한 보호 조치를 확인하세요. 변경이 무게, 보호 수준과 서비스 조건에 미치는 영향도 문의하세요."],["중요한 부분이 여전히 불명확하면 어떻게 하나요?","승인 전에 구체적으로 다시 질문하세요. 문제를 찾기 쉽도록 관련 사진과 주문 정보를 보관하세요."]],"register":"Hipobuy 가입","view":"상세 보기","original":"원본 페이지 확인","buy":"Hipobuy에서 열기","source":"업데이트된 상품 목록","imageTitle":"이미지 검색","imageBody":"이미지 검색은 아직 제공되지 않습니다. 이 사이트에서는 사진을 업로드하거나 저장할 수 없습니다.","back":"상품 목록으로","noResults":"일치하는 상품이 없습니다.","unavailable":"원본 데이터를 일시적으로 불러올 수 없습니다. 잠시 후 다시 시도하세요.","independent":"Hipobuy에서 운영하지 않는 독립 상품 안내 사이트입니다. 주문 전에 상품 정보를 확인하세요.","photoNote":"원본 페이지의 사진이며 별도의 QC 기록은 확인되지 않았습니다.","sourceNote":"원본 페이지와 구매 페이지에서 사진, 옵션, 가격을 다시 확인하세요.","page":"페이지","next":"다음","previous":"이전","sorting":"정렬","sortOptions":["원본 순서","가격 낮은 순","가격 높은 순"],"faqGroups":["사진 살펴보기","치수 확인하기","추가 사진 요청","발송 전 확인"],"guideHeadings":["차이를 구체적으로 짚기","보이지 않는 부분은 확인 항목으로 남기기","상품별 질문을 기록하기"],"guideLabel":"사진 검토 노트"}},"products":[],"categories":[],"categoryProducts":{},"homeIds":[],"details":{},"generatedAt":"2026-09-29T07:06:07.513Z","currencies":[{"country":"United States","code":"USD","symbol":"$"},{"country":"Brazil","code":"BRL","symbol":"R$"},{"country":"China","code":"CNY","symbol":"¥"},{"country":"Denmark","code":"DKK","symbol":"kr"},{"country":"France","code":"EUR","symbol":"€"},{"country":"Mexico","code":"MXN","symbol":"MX$"},{"country":"New Zealand","code":"NZD","symbol":"NZ$"},{"country":"Norway","code":"NOK","symbol":"kr"},{"country":"Poland","code":"PLN","symbol":"zł"},{"country":"Sweden","code":"SEK","symbol":"kr"},{"country":"Switzerland","code":"CHF","symbol":"Fr."},{"country":"South Korea","code":"KRW","symbol":"₩"},{"country":"Australia","code":"AUD","symbol":"A$"},{"country":"United Kingdom","code":"GBP","symbol":"£"},{"country":"Canada","code":"CAD","symbol":"C$"}]};</script>
